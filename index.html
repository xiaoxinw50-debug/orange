<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>橙心回忆 - 专属家园</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        /* ================= 昼夜主题 CSS 变量 (全面替换为梦幻蓝色调) ================= */
        :root {
            /* 白昼模式：海盐雾蓝 */
            --paper-bg: #F0F4F8; 
            --card-bg: #FFFFFF;
            --ink-main: #2C3E50; /* 海军蓝文字 */
            --ink-light: #7F8C8D;
            --accent-bronze: #5B8FB9; /* 主题蓝：海盐蓝 */
            --accent-red: #E69A8D; /* 珊瑚色点缀 (用于印章和警告) */
            --accent-indigo: #2980B9;
            --glass-bg: rgba(240, 244, 248, 0.75); 
            --border-fine: rgba(44, 62, 80, 0.08);
            --story-bg: linear-gradient(180deg, #FFFFFF 0%, #F0F4F8 100%);
            
            /* 专属情侣双色 */
            --color-xiaocheng: #3498DB; /* 晴空蓝 */
            --color-xiaoxin: #F1948A;   /* 珊瑚粉 */
            
            --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
            --font-serif: "Noto Serif SC", "Songti SC", "STSong", serif;
        }

        /* 暗夜模式：深海星空 */
        [data-theme="dark"] {
            --paper-bg: #0F172A; /* 深邃藏青 */
            --card-bg: #1E293B;
            --ink-main: #F1F5F9; 
            --ink-light: #94A3B8;
            --accent-bronze: #38BDF8; /* 荧光海蓝 */
            --accent-red: #FDA4AF; 
            --accent-indigo: #7DD3FC;
            --glass-bg: rgba(15, 23, 42, 0.85); 
            --border-fine: rgba(241, 245, 249, 0.12);
            --story-bg: linear-gradient(180deg, #1E293B 0%, #0F172A 100%);
            
            --color-xiaocheng: #7DD3FC; /* 暗夜高亮蓝 */
            --color-xiaoxin: #FDA4AF;   /* 暗夜高亮粉 */
        }

        /* 全局平滑过渡 */
        body, .card, .control-panel, input, textarea, button, .story-seg {
            transition: background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
        }

        /* ================= 基础排版 ================= */
        body { font-family: var(--font-ui); background-color: var(--paper-bg); background-image: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)" opacity="0.03"/%3E%3C/svg%3E'); margin: 0; padding: 0; color: var(--ink-main); -webkit-font-smoothing: antialiased; }
        #app { max-width: 900px; margin: 0 auto; padding: 40px 20px; position: relative; box-sizing: border-box;}
        
        /* 登录屏风 */
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--paper-bg); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .login-box { text-align: center; }
        .login-box h1 { font-family: var(--font-serif); font-size: 32px; letter-spacing: 8px; margin-bottom: 40px; color: var(--accent-bronze); }
        .login-box input { width: 200px; text-align: center; letter-spacing: 2px; padding: 12px; border-radius: 8px; border: 1px solid var(--accent-bronze); background: transparent; color: var(--ink-main); outline: none;}

        /* 顶部导航与操作区 */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .nav-tabs { display: flex; gap: 25px; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 5px; -ms-overflow-style: none; scrollbar-width: none; }
        .nav-tabs::-webkit-scrollbar { display: none; }
        .tab { font-family: var(--font-serif); font-size: 18px; cursor: pointer; padding-bottom: 5px; color: var(--ink-light); white-space: nowrap; }
        .tab.active { color: var(--accent-bronze); border-bottom: 2px solid var(--accent-bronze); font-weight: bold; }
        
        .header-actions { display: flex; gap: 12px; align-items: center; }
        .theme-toggle { font-size: 20px; cursor: pointer; background: transparent; border: none; color: var(--ink-main); padding: 0;}
        .user-badge { font-family: var(--font-serif); font-size: 14px; color: var(--accent-bronze); border: 1px solid var(--accent-bronze); padding: 4px 12px; border-radius: 20px; cursor: pointer; opacity: 0.8; white-space: nowrap;}

        /* 岁月拾遗 */
        .memory-flashback { text-align: center; margin-bottom: 40px; padding: 20px; border-top: 1px solid var(--border-fine); border-bottom: 1px solid var(--border-fine); background: linear-gradient(90deg, transparent, rgba(91, 143, 185, 0.05), transparent); }
        .memory-title { font-family: var(--font-serif); font-size: 14px; color: var(--accent-bronze); margin-bottom: 10px; letter-spacing: 2px; }
        .memory-text { font-family: var(--font-serif); font-size: 16px; font-style: italic; cursor: pointer; }
        
        .story-legend { text-align: center; font-family: var(--font-serif); font-size: 13px; margin-bottom: 20px; }
        .legend-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin: 0 5px; }

        /* 控制台 */
        .control-panel { background: var(--glass-bg); backdrop-filter: blur(20px); border-radius: 12px; padding: 25px; margin-bottom: 50px; border: 1px solid var(--border-fine); display: flex; flex-direction: column; gap: 15px; box-shadow: 0 8px 32px rgba(44, 62, 80, 0.05); }
        .input-group { display: flex; gap: 15px; align-items: center; }
        .title-input { font-family: var(--font-serif); font-size: 18px; padding: 12px 14px; border-radius: 6px; border: 1px solid var(--border-fine); background: transparent; width: 100%; box-sizing: border-box; text-align: center; letter-spacing: 2px; color: var(--ink-main);}
        .note-input { font-family: var(--font-ui); padding: 12px 14px; border-radius: 6px; border: 1px solid var(--border-fine); background: transparent; flex: 1; color: var(--ink-main);}
        input[type="file"], input[type="date"] { color: var(--ink-main); }
        input:focus, textarea:focus { border-color: var(--accent-bronze); background: var(--card-bg); outline: none; box-shadow: 0 0 0 3px rgba(91, 143, 185, 0.15);}
        button { background: var(--accent-bronze); color: #FFFFFF; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; }

        /* 时间轴与网格 */
        .timeline-group { margin-bottom: 50px; }
        .timeline-header { font-family: var(--font-serif); font-size: 18px; color: var(--accent-bronze); margin-bottom: 20px; position: sticky; top: 0; z-index: 10; background: var(--glass-bg); backdrop-filter: blur(10px); padding: 10px 0; border-bottom: 1px solid var(--border-fine); }
        .grid { display: grid; gap: 25px; }
        .grid-memory { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
        .grid-list { grid-template-columns: 1fr; }

        /* 卡片通用 */
        .card { background: var(--card-bg); border-radius: 10px; border: 1px solid var(--border-fine); position: relative; overflow: hidden; box-shadow: 0 4px 20px rgba(44, 62, 80, 0.03);}
        .card img { width: 100%; height: 260px; object-fit: cover; border-bottom: 1px solid var(--border-fine); display: block;}
        .card-info { padding: 30px 25px; position: relative; }
        
        .author-stamp { position: absolute; bottom: 15px; right: 20px; font-family: var(--font-serif); font-size: 12px; color: var(--accent-bronze); opacity: 0.7; }
        .date { font-size: 12px; color: var(--ink-light); margin-bottom: 15px; display: block; text-align: center; }
        
        /* 浮梦小说 */
        .story-title { font-family: var(--font-serif); font-size: 22px; font-weight: bold; text-align: center; margin-bottom: 20px; letter-spacing: 2px; color: var(--accent-bronze);}
        .card-story { background: var(--story-bg); }
        .story-content { font-family: var(--font-serif); font-size: 16px; line-height: 2; text-align: justify; }
        .text-xiaocheng { color: var(--color-xiaocheng); }
        .text-xiaoxin { color: var(--color-xiaoxin); }
        .story-seg { border-radius: 4px; padding: 4px 8px; margin-bottom: 8px; white-space: pre-wrap; word-wrap: break-word; display: block;}
        .story-seg:hover { background: rgba(91, 143, 185, 0.08); }

        /* 编辑模式 */
        .edit-title { width: 100%; box-sizing: border-box; font-family: var(--font-serif); font-size: 18px; padding: 10px; margin-bottom: 20px; border: 1px solid var(--accent-bronze); background: transparent; color: var(--ink-main); border-radius: 6px; text-align: center;}
        .edit-seg-row { display: flex; gap: 10px; margin-bottom: 12px; align-items: flex-start; }
        .seg-author-badge { font-family: var(--font-serif); font-size: 12px; padding: 4px 8px; border-radius: 4px; color: white; white-space: nowrap; margin-top: 5px;}
        .bg-xiaocheng { background: var(--color-xiaocheng); }
        .bg-xiaoxin { background: var(--color-xiaoxin); }
        .seg-textarea { flex: 1; font-family: var(--font-serif); font-size: 16px; line-height: 1.8; padding: 10px; border: 1px solid var(--border-fine); background: transparent; color: var(--ink-main); border-radius: 6px; outline: none; resize: vertical; min-height: 80px; }
        .add-seg-btn { width: 100%; background: transparent; border: 1px dashed var(--accent-bronze); color: var(--accent-bronze); padding: 10px; margin-top: 10px; }
        
        .edit-area { width: 100%; box-sizing: border-box; font-family: var(--font-serif); font-size: 16px; line-height: 1.8; padding: 10px; border: 1px solid var(--accent-bronze); background: transparent; color: var(--ink-main); border-radius: 6px; outline: none; resize: vertical; min-height: 120px; }
        .edit-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: center;}

        /* 操作按钮 */
        .actions { position: absolute; top: 10px; right: 10px; display: flex; gap: 8px; opacity: 0; z-index: 20;}
        .card:hover .actions { opacity: 1; }
        .action-btn { width: 32px; height: 32px; border-radius: 50%; background: var(--card-bg); border: 1px solid var(--border-fine); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; color: var(--accent-bronze); }
        .action-btn:hover { color: #FFFFFF; background: var(--accent-bronze); border-color: var(--accent-bronze); }
        .btn-delete:hover { color: #FFFFFF; background: var(--accent-red); border-color: var(--accent-red); }

        /* 心愿与常规文字 */
        .wish-item { display: flex; align-items: center; gap: 15px; }
        .wish-checkbox { width: 20px; height: 20px; accent-color: var(--accent-bronze); }
        .wish-completed { text-decoration: line-through; color: var(--ink-light); }
        .note { font-family: var(--font-serif); font-size: 16px; line-height: 2; color: var(--ink-main); white-space: pre-wrap; }
        
        .capsule-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 260px; background: var(--glass-bg); backdrop-filter: blur(15px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 5; border-bottom: 1px solid var(--border-fine); }

        /* ================= 移动端极致适配 ================= */
        @media (max-width: 600px) {
            #app { padding: 20px 15px; }
            .header { margin-bottom: 25px; }
            .nav-tabs { gap: 15px; }
            .tab { font-size: 16px; }
            .control-panel { padding: 15px; margin-bottom: 30px;}
            .input-group { flex-direction: column; align-items: stretch; gap: 10px; }
            .input-group input[type="file"] { width: 100% !important; }
            button { width: 100%; padding: 14px; font-size: 16px; }
            .actions { opacity: 1; background: var(--glass-bg); padding: 5px; border-radius: 20px; border: 1px solid var(--border-fine);}
            .action-btn { width: 28px; height: 28px; font-size: 12px;}
            .card-info { padding: 20px 15px 35px 15px; }
            .story-content { font-size: 15px; }
            .author-stamp { bottom: 10px; right: 15px; }
        }
    </style>
</head>
<body>

<div id="app">
    <div v-if="!currentUser" class="login-overlay">
        <div class="login-box">
            <h1>叩门</h1>
            <input type="password" v-model="loginCode" @keyup.enter="login" placeholder="输入暗号...">
            <div style="margin-top:20px; font-size:12px; color:var(--ink-light);">
                (暗号：xiaoxin 或 xiaocheng)
            </div>
        </div>
    </div>

    <template v-else>
        <div class="header">
            <div class="nav-tabs">
                <div :class="['tab', {active: currentTab === 'memory'}]" @click="switchTab('memory')">纪事</div>
                <div :class="['tab', {active: currentTab === 'diary'}]" @click="switchTab('diary')">随笔</div>
                <div :class="['tab', {active: currentTab === 'wish'}]" @click="switchTab('wish')">心愿</div>
                <div :class="['tab', {active: currentTab === 'story'}]" @click="switchTab('story')">浮梦</div>
            </div>
            
            <div class="header-actions">
                <button class="theme-toggle" @click="toggleTheme" :title="isDarkMode ? '切换至白昼' : '切换至暗夜'">
                    {{ isDarkMode ? '🌙' : '☀️' }}
                </button>
                <div class="user-badge" @click="logout" title="点击可退出">
                    {{ currentUser }} 印
                </div>
            </div>
        </div>

        <div v-if="currentTab === 'story'" class="story-legend">
            <span class="legend-dot bg-xiaocheng"></span> 小橙字迹 &nbsp;&nbsp;
            <span class="legend-dot bg-xiaoxin"></span> 小心字迹
        </div>

        <div class="control-panel">
            <input v-if="currentTab === 'story'" type="text" v-model="newTitle" class="title-input" placeholder="《 篇章名 》 (如：末日废土篇)...">
            <div class="input-group">
                <input v-if="currentTab === 'memory' || currentTab === 'wish' || currentTab === 'story'" type="file" @change="handleFile" accept="image/*" style="width:200px;">
                <input type="date" v-model="newDate">
                <input type="text" class="note-input" v-model="newNote" :placeholder="placeholderText" @keyup.enter="uploadItem">
                <button @click="uploadItem">{{ btnText }}</button>
            </div>
        </div>

        <div v-for="(itemsInGroup, monthYear) in groupedItems" :key="monthYear" class="timeline-group">
            <div class="timeline-header">{{ monthYear }}</div>
            
            <div :class="['grid', currentTab === 'memory' ? 'grid-memory' : 'grid-list']">
                <div v-for="item in itemsInGroup" :key="item._id" :class="['card', {'card-story': currentTab === 'story'}]">
                    
                    <div class="actions">
                        <button class="action-btn" @click="startEdit(item)" title="修编/续写">✎</button>
                        <button class="action-btn btn-delete" @click="deleteItem(item._id)" title="抹去">×</button>
                    </div>

                    <template v-if="item.url && (currentTab === 'memory' || currentTab === 'story')">
                        <div v-if="isFuture(item.time)" class="capsule-overlay">
                            <div style="font-size:24px; margin-bottom:10px;">✉️</div>
                            <div style="font-family: var(--font-serif); color:var(--ink-light);">静待花开时</div>
                        </div>
                        <img :src="item.url" @click="!isFuture(item.time) && viewFull(item.url)">
                    </template>
                    <img v-if="item.url && currentTab === 'wish'" :src="item.url" style="height: 150px;">

                    <div class="card-info">
                        <span class="date">{{ formatDate(item.date) }}</span>
                        
                        <div v-if="editingId === item._id">
                            <template v-if="currentTab === 'story'">
                                <input type="text" class="edit-title" v-model="editTitle" placeholder="篇章名">
                                <div v-for="(seg, index) in editSegments" :key="index" class="edit-seg-row">
                                    <span :class="['seg-author-badge', seg.author === '小心' ? 'bg-xiaoxin' : 'bg-xiaocheng']">
                                        {{ seg.author }}
                                    </span>
                                    <textarea class="seg-textarea" v-model="seg.text"></textarea>
                                    <button @click="editSegments.splice(index, 1)" class="action-btn" style="margin-top:5px;" title="删除此段">×</button>
                                </div>
                                <button class="add-seg-btn" @click="addNewSegment">✦ 续写新段落</button>
                            </template>
                            
                            <template v-else>
                                <textarea class="edit-area" v-model="editNote"></textarea>
                            </template>

                            <div class="edit-actions">
                                <button @click="saveEdit(item._id)">保存落笔</button>
                                <button style="background:transparent; border:1px solid var(--border-fine); color:var(--ink-main);" @click="cancelEdit">取消</button>
                            </div>
                        </div>

                        <div v-else>
                            <template v-if="currentTab === 'story'">
                                <div v-if="item.title" class="story-title">《 {{ item.title }} 》</div>
                                <div class="story-content">
                                    <p v-for="seg in item.segments" :key="seg.id" 
                                          :class="['story-seg', seg.author === '小心' ? 'text-xiaoxin' : 'text-xiaocheng']"
                                          :title="'本段作者: ' + seg.author">
                                        {{ seg.text }}
                                    </p>
                                </div>
                            </template>

                            <template v-else>
                                <div v-if="currentTab === 'wish'" class="wish-item">
                                    <input type="checkbox" class="wish-checkbox" :checked="item.completed" @change="toggleWish(item, $event)">
                                    <span :class="['note', {'wish-completed': item.completed}]">{{ item.note }}</span>
                                </div>
                                <div v-else class="note">
                                    <template v-if="currentTab === 'memory' && isFuture(item.time)">[ 时光胶囊 · 尚未解封 ]</template>
                                    <template v-else>{{ item.note }}</template>
                                </div>
                            </template>
                        </div>

                        <div class="author-stamp">
                            <span v-if="currentTab === 'story'">共创平行宇宙</span>
                            <span v-else>记录者：{{ item.author }}</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>
</div>

<script>
    const { createApp } = Vue;
    createApp({
        data() {
            return {
                currentUser: null,
                loginCode: '',
                currentTab: 'memory', 
                items: [],
                newTitle: '', newNote: '', newDate: '', selectedFile: null,
                randomMemory: null,
                editingId: null, editTitle: '', editNote: '', editSegments: [],
                isDarkMode: false
            }
        },
        computed: {
            placeholderText() {
                if (this.currentTab === 'memory') return '记叙那一刻的回忆...';
                if (this.currentTab === 'diary') return '写下今天的随笔碎语...';
                if (this.currentTab === 'story') return '在这个世界里，你写下了第一句话...';
                return '许下一个愿望...';
            },
            btnText() {
                if (this.currentTab === 'memory') return '入卷';
                if (this.currentTab === 'diary') return '落笔';
                if (this.currentTab === 'story') return '筑梦';
                return '许愿';
            },
            groupedItems() {
                const groups = {};
                this.items.forEach(item => {
                    const dateObj = new Date(item.date);
                    const yearOptions = ['〇','一','二','三','四','五','六','七','八','九'];
                    const yearStr = dateObj.getFullYear().toString().split('').map(n => yearOptions[n]).join('');
                    const yearMonth = `${yearStr}年 ${dateObj.getMonth() + 1}月`;
                    if (!groups[yearMonth]) groups[yearMonth] = [];
                    groups[yearMonth].push(item);
                });
                return groups;
            }
        },
        methods: {
            login() {
                if (this.loginCode === 'xiaoxin') this.currentUser = '小心';
                else if (this.loginCode === 'xiaocheng') this.currentUser = '小橙';
                else return alert('暗号有误，门扉紧闭');
                
                localStorage.setItem('orange_user', this.currentUser);
                this.initApp();
            },
            logout() {
                localStorage.removeItem('orange_user');
                this.currentUser = null;
                this.loginCode = '';
            },
            toggleTheme() {
                this.isDarkMode = !this.isDarkMode;
                const theme = this.isDarkMode ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('orange_theme', theme);
            },
            switchTab(tab) {
                this.currentTab = tab;
                this.getItems();
                this.selectedFile = null;
                this.newNote = '';
                this.newTitle = '';
            },
            handleFile(e) { this.selectedFile = e.target.files[0]; },
            async uploadItem() {
                if (!this.newNote && !this.selectedFile) return alert("总得留下些什么痕迹吧？");
                
                const fd = new FormData();
                if (this.selectedFile) fd.append('file', this.selectedFile);
                fd.append('category', this.currentTab);
                fd.append('title', this.newTitle);
                fd.append('author', this.currentUser); 
                if (this.newDate) fd.append('date', this.newDate);
                
                if (this.currentTab === 'story') {
                    const initialSegment = [{ id: Date.now().toString(), author: this.currentUser, text: this.newNote }];
                    fd.append('segments', JSON.stringify(initialSegment));
                } else {
                    fd.append('note', this.newNote);
                }
                
                try {
                    await axios.post('/api/items', fd);
                    this.newNote = ''; this.newTitle = '';
                    this.newDate = new Date().toISOString().split('T')[0];
                    this.selectedFile = null;
                    const fileInput = document.querySelector('input[type="file"]');
                    if(fileInput) fileInput.value = '';
                    
                    this.getItems();
                } catch (error) { alert("记录失败，请稍后重试"); }
            },
            async getItems() {
                const res = await axios.get(`/api/items?category=${this.currentTab}`);
                this.items = res.data;
            },
            async deleteItem(id) {
                if (confirm("是否确认将此记忆抹去？")) {
                    await axios.delete(`/api/items/${id}`);
                    this.getItems();
                }
            },
            startEdit(item) {
                this.editingId = item._id;
                this.editTitle = item.title || '';
                this.editNote = item.note || '';
                
                if (this.currentTab === 'story') {
                    if (item.segments && item.segments.length > 0) {
                        this.editSegments = JSON.parse(JSON.stringify(item.segments));
                    } else if (item.note) {
                        this.editSegments = [{ id: Date.now().toString(), author: item.author, text: item.note }];
                    } else {
                        this.editSegments = [];
                    }
                }
            },
            addNewSegment() {
                this.editSegments.push({
                    id: Date.now().toString(),
                    author: this.currentUser,
                    text: ''
                });
            },
            cancelEdit() {
                this.editingId = null;
            },
            async saveEdit(id) {
                let payload = { title: this.editTitle };
                
                if (this.currentTab === 'story') {
                    payload.segments = this.editSegments.filter(seg => seg.text.trim() !== '');
                } else {
                    payload.note = this.editNote;
                }

                try {
                    await axios.put(`/api/items/${id}`, payload);
                    this.editingId = null;
                    this.getItems();
                } catch (e) { alert("修改失败"); }
            },
            async toggleWish(item, event) {
                try {
                    await axios.put(`/api/items/${item._id}`, { completed: event.target.checked });
                    item.completed = event.target.checked;
                } catch (e) { event.target.checked = !event.target.checked; }
            },
            isFuture(timestamp) { return timestamp > Date.now(); },
            viewFull(url) { window.open(url, '_blank'); },
            formatDate(dateString) { return new Date(dateString).toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' }); },
            initApp() {
                this.newDate = new Date().toISOString().split('T')[0];
                this.getItems(); 
            }
        },
        mounted() { 
            const savedUser = localStorage.getItem('orange_user');
            if (savedUser) {
                this.currentUser = savedUser;
                this.initApp();
            }
            
            const savedTheme = localStorage.getItem('orange_theme');
            if (savedTheme === 'dark') {
                this.isDarkMode = true;
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        }
    }).mount('#app');
</script>
</body>
</html>
