<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="/manifest.json">
    <meta name="description" content="橙心回忆，一款适合手机安装的双人回忆与游乐小宇宙。">
    <meta name="theme-color" content="#FFB7B2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="橙心回忆">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    
    <title>橙心回忆 - 我们的琉璃城堡</title>
    <script src="/mobile-config.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
    <style>
        :root {
            --paper-bg: #FFF0F5; --card-bg: rgba(255, 255, 255, 0.9); --ink-main: #7B5C6A; --ink-light: #A8959F;
            --accent-main: #F4C2C2; --accent-bronze: #E6A8D7; --accent-red: #FFB6C1; 
            --glass-bg: rgba(255, 255, 255, 0.6); --border-fine: rgba(255, 182, 193, 0.4);
            --story-bg: linear-gradient(180deg, rgba(255,255,255,0.95) 0%, rgba(255,240,245,0.7) 100%);
            --color-xiaocheng: #82CAFF; --color-xiaoxin: #FFB7B2;   
            --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
            --font-serif: "Noto Serif SC", "Songti SC", "STSong", serif;
            
            /* 午夜秘境专属色 */
            --midnight-red: #8B0000;
            --midnight-dark: #1A0505;
        }

        [data-theme="dark"] {
            --paper-bg: #2C1A3D; --card-bg: rgba(60, 35, 80, 0.85); --ink-main: #F5E6E8; --ink-light: #B8A5B6;
            --accent-main: #DDA0DD; --accent-bronze: #B3CEE5; --accent-red: #FFB7B2; 
            --glass-bg: rgba(44, 26, 61, 0.7); --border-fine: rgba(221, 160, 221, 0.2);
            --story-bg: linear-gradient(180deg, rgba(60,35,80,0.9) 0%, rgba(44,26,61,0.8) 100%);
            --color-xiaocheng: #AEC6CF; --color-xiaoxin: #F8C8DC;   
        }

        body { font-family: var(--font-ui); background: linear-gradient(-45deg, #FFE4E1, #FFF0F5, #E6E6FA, #F0F8FF); background-size: 400% 400%; animation: silkGradient 15s ease infinite; margin: 0; padding: 0; color: var(--ink-main); -webkit-font-smoothing: antialiased; }
        [data-theme="dark"] body { background: linear-gradient(-45deg, #2C1A3D, #1A1A2E, #3B1C32, #16213E); background-size: 400% 400%; }
        @keyframes silkGradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        body, .card, .control-panel, input, textarea, button, .story-seg { transition: background-color 0.5s ease, color 0.5s ease, border-color 0.5s ease, box-shadow 0.5s ease; }
        #app { max-width: 900px; margin: 0 auto; padding: 40px 20px; position: relative; box-sizing: border-box;}
        
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--paper-bg); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .login-box { text-align: center; background: var(--glass-bg); padding: 50px; border-radius: 30px; box-shadow: 0 15px 35px rgba(255, 182, 193, 0.2); border: 1px solid var(--border-fine); backdrop-filter: blur(20px);}
        [data-theme="dark"] .login-box { box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4); }
        .login-box h1 { font-family: var(--font-serif); font-size: 32px; letter-spacing: 4px; margin-bottom: 30px; color: var(--ink-main); }
        .login-box input { width: 220px; text-align: center; letter-spacing: 2px; padding: 15px; border-radius: 20px; border: 2px solid var(--border-fine); background: rgba(255,255,255,0.5); color: var(--ink-main); outline: none; font-size: 16px;}
        .login-box input:focus { border-color: var(--accent-bronze); background: var(--card-bg);}

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .nav-tabs { display: flex; gap: 20px; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 5px; -ms-overflow-style: none; scrollbar-width: none; }
        .nav-tabs::-webkit-scrollbar { display: none; }
        .tab { font-family: var(--font-serif); font-size: 18px; cursor: pointer; padding-bottom: 5px; color: var(--ink-light); white-space: nowrap; position: relative; display: inline-flex; align-items: center; gap: 8px;}
        .tab::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 0; height: 3px; background: linear-gradient(90deg, var(--color-xiaoxin), var(--color-xiaocheng)); transition: 0.3s; border-radius: 3px;}
        .tab.active { color: var(--ink-main); font-weight: bold; }
        .tab.active::after { width: 100%; }
        .tab-badge { width: 9px; height: 9px; border-radius: 999px; background: #ff6f8f; box-shadow: 0 0 0 4px rgba(255, 111, 143, 0.14); flex: none; }
        .tab.active .tab-badge { background: #ff5178; box-shadow: 0 0 0 4px rgba(255, 81, 120, 0.18); }
        
        .header-actions { display: flex; gap: 15px; align-items: center; }
        .theme-toggle { font-size: 22px; cursor: pointer; background: transparent; border: none; color: var(--ink-main); padding: 0; transition: transform 0.4s;}
        .theme-toggle:hover { transform: rotate(20deg); }
        .user-badge { font-family: var(--font-serif); font-size: 14px; color: var(--ink-main); background: linear-gradient(135deg, rgba(255,255,255,0.8), rgba(255,255,255,0.4)); border: 1px solid var(--border-fine); padding: 6px 16px; border-radius: 30px; cursor: pointer; display: flex; align-items: center; gap: 5px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); backdrop-filter: blur(10px);}
        [data-theme="dark"] .user-badge { background: rgba(0,0,0,0.2); }
        .notice { margin: -15px 0 25px; padding: 14px 18px; border-radius: 16px; border: 1px solid var(--border-fine); background: var(--card-bg); backdrop-filter: blur(12px); box-shadow: 0 8px 20px rgba(0,0,0,0.04); }
        .notice.success { color: #2f7a4c; border-color: rgba(93, 181, 122, 0.35); }
        .notice.error { color: #b25463; border-color: rgba(255, 154, 162, 0.45); }
        .notice.info { color: var(--ink-main); }
        [data-theme="dark"] .notice.success { color: #a7e1bb; }
        [data-theme="dark"] .notice.error { color: #ffc0ca; }
        .undo-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: -12px 0 22px; padding: 14px 18px; border-radius: 16px; border: 1px solid rgba(130, 202, 255, 0.28); background: rgba(255,255,255,0.72); backdrop-filter: blur(12px); color: var(--ink-main); }
        .undo-text { font-size: 14px; line-height: 1.6; }

        .control-panel { background: var(--glass-bg); backdrop-filter: blur(25px); border-radius: 24px; padding: 30px; margin-bottom: 50px; border: 1px solid var(--border-fine); display: flex; flex-direction: column; gap: 15px; box-shadow: 0 10px 40px rgba(255, 182, 193, 0.15); }
        [data-theme="dark"] .control-panel { box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3); }
        .filter-panel { margin-bottom: 22px; }
        .filter-label { font-family: var(--font-serif); font-size: 14px; color: var(--ink-light); letter-spacing: 1px; }
        .filter-select { padding: 12px; border-radius: 12px; border: 1px solid var(--border-fine); background: rgba(255,255,255,0.5); color: var(--ink-main); font-family: var(--font-ui); min-width: 120px; }
        [data-theme="dark"] .filter-select { background: rgba(0,0,0,0.2); }
        .secondary-btn { background: transparent; color: var(--accent-bronze); border: 1px solid var(--accent-bronze); box-shadow: none; }
        .secondary-btn:hover { background: rgba(255,255,255,0.35); }
        .danger-btn { background: linear-gradient(135deg, #ff9aa2, #ff6b81); }
        .danger-btn:hover { box-shadow: 0 10px 25px rgba(255, 107, 129, 0.45); }
        .mood-row { display: flex; gap: 10px; flex-wrap: wrap; }
        .mood-chip { border: 1px solid var(--border-fine); background: rgba(255,255,255,0.45); color: var(--ink-main); border-radius: 999px; padding: 8px 12px; cursor: pointer; font-family: var(--font-ui); font-size: 14px; transition: 0.25s; }
        .mood-chip.active { background: linear-gradient(135deg, rgba(255,183,178,0.95), rgba(130,202,255,0.95)); color: white; border-color: transparent; transform: translateY(-2px); }
        .mood-chip:hover { transform: translateY(-2px); }
        .mood-badge { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 12px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border-fine); background: rgba(255,255,255,0.55); color: var(--ink-main); font-size: 13px; }
        
        .file-upload-wrapper { position: relative; flex: none; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.5); border: 1px dashed var(--accent-bronze); border-radius: 12px; padding: 0 15px; height: 50px; cursor: pointer; transition: 0.3s;}
        [data-theme="dark"] .file-upload-wrapper { background: rgba(0,0,0,0.2); }
        .file-upload-wrapper:hover { background: var(--card-bg); }
        .file-upload-wrapper input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .file-upload-text { font-family: var(--font-ui); color: var(--accent-bronze); font-size: 14px; font-weight: bold;}

        .input-group { display: flex; gap: 15px; align-items: center; position: relative; z-index: 1;}
        .title-input, .note-input { padding: 14px; border-radius: 12px; border: 1px solid var(--border-fine); background: rgba(255,255,255,0.5); color: var(--ink-main); transition: 0.3s;}
        .title-input { font-family: var(--font-serif); font-size: 18px; width: 100%; box-sizing: border-box; text-align: center; letter-spacing: 2px; }
        .note-input { font-family: var(--font-ui); flex: 1; }
        [data-theme="dark"] .title-input, .note-input, input[type="date"] { background: rgba(0,0,0,0.2); }
        input[type="date"] { padding: 12px; border-radius: 12px; border: 1px solid var(--border-fine); background: rgba(255,255,255,0.5); color: var(--ink-main); font-family: var(--font-ui); }
        input:focus, textarea:focus { border-color: var(--accent-bronze); background: var(--card-bg); outline: none; box-shadow: 0 0 0 4px rgba(230, 168, 215, 0.2);}
        button.action-submit { background: linear-gradient(135deg, var(--color-xiaoxin), var(--color-xiaocheng)); color: #FFFFFF; border: none; padding: 14px 28px; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 15px; letter-spacing: 1px; box-shadow: 0 6px 20px rgba(255, 182, 193, 0.4); transition: 0.3s; }
        button.action-submit:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(255, 182, 193, 0.6); }
        button:disabled { opacity: 0.6; cursor: not-allowed; transform: none !important; }
        
        button.action-midnight { background: linear-gradient(135deg, #1A0505, #8B0000); box-shadow: 0 6px 20px rgba(139, 0, 0, 0.4); color: white;}
        button.action-midnight:hover { box-shadow: 0 10px 25px rgba(139, 0, 0, 0.6); }

        /* ====== 星月塔罗 & 秘戏大冒险 ====== */
        .tarot-board { display: flex; flex-direction: column; align-items: center; padding: 20px 0 50px 0; transition: 0.5s;}
        .tarot-title { font-family: var(--font-serif); font-size: 24px; color: var(--ink-main); margin-bottom: 10px; letter-spacing: 3px; font-weight: bold; transition: 0.5s;}
        .tarot-subtitle { font-family: var(--font-ui); font-size: 14px; color: var(--ink-light); margin-bottom: 30px; transition: 0.5s;}
        
        .mode-switch-wrap { margin-bottom: 30px; }
        .mode-switch { font-family: var(--font-serif); font-size: 13px; font-weight: bold; padding: 8px 16px; border-radius: 20px; cursor: pointer; transition: 0.3s; border: 1px solid var(--border-fine); background: var(--glass-bg); color: var(--ink-main);}
        .mode-switch.is-midnight { background: #2A0808; color: #FFD700; border-color: #8B0000; box-shadow: 0 0 15px rgba(139,0,0,0.5);}
        
        .tarot-card-container { width: 280px; height: 420px; perspective: 1000px; cursor: pointer; margin-bottom: 30px;}
        .game-decks-wrap { display: flex; gap: 30px; justify-content: center; flex-wrap: wrap; width: 100%;}
        .tarot-inner { width: 100%; height: 100%; transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform-style: preserve-3d; position: relative;}
        .tarot-card-container.flipped .tarot-inner { transform: rotateY(180deg); }
        .tarot-card-container.shaking { animation: shake 0.5s infinite; }
        @keyframes shake { 0% { transform: translate(1px, 1px) rotate(0deg); } 20% { transform: translate(-3px, 0px) rotate(1deg); } 40% { transform: translate(1px, -1px) rotate(1deg); } 60% { transform: translate(-3px, 1px) rotate(0deg); } 80% { transform: translate(-1px, -1px) rotate(1deg); } 100% { transform: translate(1px, -2px) rotate(-1deg); } }
        
        .tarot-front, .tarot-back { width: 100%; height: 100%; position: absolute; backface-visibility: hidden; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.15); border: 2px solid var(--accent-bronze); transition: 0.5s;}
        
        /* 浪漫牌背 */
        .tarot-back { background: linear-gradient(135deg, #2C1A3D, #3B1C32); background-size: 200% 200%; animation: silkGradient 5s ease infinite; display: flex; align-items: center; justify-content: center;}
        .tarot-back::after { content: '✨ 命运之轮 ✨'; color: rgba(255,255,255,0.7); font-family: var(--font-serif); font-size: 20px; letter-spacing: 3px; writing-mode: vertical-rl; transition: 0.5s;}
        
        /* 午夜塔罗牌背 */
        .midnight-mode .tarot-back { background: linear-gradient(135deg, #1A0505, #4A0E17); border-color: #8B0000; box-shadow: 0 0 20px rgba(139,0,0,0.4);}
        .midnight-mode .tarot-back::after { content: '⛓️ 午夜秘境 ⛓️'; color: rgba(255, 69, 0, 0.7); }

        /* 真心话大冒险 专属牌背 */
        .game-deck-truth .tarot-back { background: linear-gradient(135deg, #3B1C32, #8B0045); border-color: #FF1493;}
        .game-deck-truth .tarot-back::after { content: '👄 抽一张真心话'; color: #FFB6C1; }
        .game-deck-dare .tarot-back { background: linear-gradient(135deg, #1A0505, #4A0E17); border-color: #8B0000;}
        .game-deck-dare .tarot-back::after { content: '⛓️ 抽一张大冒险'; color: #FF4500; }
        
        .tarot-front { background: var(--card-bg); transform: rotateY(180deg); padding: 30px 20px; display: flex; flex-direction: column; align-items: center; box-sizing: border-box; overflow-y: auto;}
        .midnight-mode .tarot-front { background: #1A1A1A; border-color: #8B0000;}
        .tarot-front::-webkit-scrollbar { width: 4px; }
        .tarot-front::-webkit-scrollbar-thumb { background: var(--border-fine); border-radius: 4px; }
        .midnight-mode .tarot-front::-webkit-scrollbar-thumb { background: #8B0000; }
        
        .tarot-emoji { font-size: 65px; margin-bottom: 15px; filter: drop-shadow(0 4px 10px rgba(255,182,193,0.5));}
        .midnight-mode .tarot-emoji { filter: drop-shadow(0 4px 15px rgba(255,0,0,0.4)); }
        
        .tarot-name { font-family: var(--font-serif); font-size: 22px; font-weight: bold; color: var(--accent-bronze); margin-bottom: 15px; border-bottom: 1px solid var(--border-fine); padding-bottom: 15px; width: 100%; text-align: center; transition: 0.5s;}
        .midnight-mode .tarot-name { color: #FF4500; border-bottom-color: #8B0000; }
        
        .tarot-text-box { text-align: left; width: 100%; font-family: var(--font-ui); font-size: 15px; color: var(--ink-main); line-height: 1.7; transition: 0.5s;}
        .midnight-mode .tarot-text-box { color: #E0E0E0; }
        .tarot-keyword { color: var(--accent-bronze); font-weight: bold; font-family: var(--font-serif); transition: 0.5s;}
        .midnight-mode .tarot-keyword { color: #FF4500; }
        .tarot-action { background: rgba(230, 168, 215, 0.15); padding: 12px 15px; border-radius: 12px; margin-top: 20px; font-weight: bold; color: var(--ink-main); border: 1px dashed var(--accent-bronze); transition: 0.5s;}
        .midnight-mode .tarot-action { background: rgba(139, 0, 0, 0.2); border-color: #8B0000; color: #FFB6C1; }
        .game-content { font-size: 18px; line-height: 2; text-align: center; margin-top: 20px; font-family: var(--font-serif);}

        /* 列表与其他样式 */
        .stats-dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 20px;}
        .stats-card { background: var(--card-bg); border-radius: 24px; border: 1px solid var(--border-fine); padding: 30px; box-shadow: 0 10px 30px rgba(255, 182, 193, 0.15); backdrop-filter: blur(10px); text-align: center;}
        [data-theme="dark"] .stats-card { box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        .stats-title { font-family: var(--font-serif); font-size: 20px; color: var(--ink-main); margin-bottom: 20px; font-weight: bold;}
        .chart-container { position: relative; height: 250px; width: 100%; display: flex; justify-content: center; align-items: center;}
        .review-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; margin-top: 10px; }
        .review-card { background: var(--card-bg); border-radius: 24px; border: 1px solid var(--border-fine); padding: 26px; box-shadow: 0 10px 30px rgba(255, 182, 193, 0.12); backdrop-filter: blur(12px); }
        .review-card.wide { grid-column: span 2; }
        .review-card h3 { margin: 0 0 12px; font-family: var(--font-serif); font-size: 22px; color: var(--ink-main); }
        .review-kicker { font-size: 13px; color: var(--ink-light); margin-bottom: 10px; letter-spacing: 1px; }
        .review-metric { font-family: var(--font-serif); font-size: 34px; color: var(--ink-main); margin-bottom: 8px; }
        .review-desc { font-size: 14px; color: var(--ink-light); line-height: 1.8; }
        .review-list { display: grid; gap: 14px; }
        .review-item { padding: 16px 18px; border-radius: 16px; border: 1px solid var(--border-fine); background: rgba(255,255,255,0.35); }
        .review-item-title { font-family: var(--font-serif); font-size: 17px; color: var(--ink-main); margin-bottom: 6px; }
        .review-item-meta { font-size: 12px; color: var(--ink-light); margin-bottom: 8px; }
        .review-item-text { font-size: 14px; line-height: 1.7; color: var(--ink-main); white-space: pre-wrap; }
        .empty-state { text-align: center; padding: 28px; border-radius: 20px; border: 1px dashed var(--border-fine); color: var(--ink-light); background: rgba(255,255,255,0.22); }
        .empty-state.rich { display: grid; gap: 10px; justify-items: center; padding: 38px 24px; }
        .empty-state-icon { font-size: 46px; }
        .empty-state-title { font-family: var(--font-serif); font-size: 24px; color: var(--ink-main); }
        .empty-state-text { max-width: 520px; font-size: 14px; line-height: 1.8; color: var(--ink-light); }
        .skeleton-grid { display: grid; gap: 22px; }
        .skeleton-grid.cards { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
        .skeleton-card { min-height: 220px; border-radius: 24px; border: 1px solid var(--border-fine); background: rgba(255,255,255,0.38); overflow: hidden; position: relative; }
        .skeleton-card::after { content: ''; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255,255,255,0.52), transparent); animation: shimmer 1.4s infinite; }
        .skeleton-media { height: 150px; background: rgba(255,255,255,0.38); }
        .skeleton-body { padding: 18px; display: grid; gap: 10px; }
        .skeleton-line { height: 12px; border-radius: 999px; background: rgba(255,255,255,0.6); }
        .skeleton-line.short { width: 38%; }
        .skeleton-line.medium { width: 64%; }
        .skeleton-line.long { width: 88%; }
        @keyframes shimmer { to { transform: translateX(100%); } }
        .home-shell { display: grid; gap: 24px; }
        .home-hero { position: relative; overflow: hidden; background:
            radial-gradient(circle at top left, rgba(255, 183, 178, 0.22), transparent 34%),
            radial-gradient(circle at top right, rgba(130, 202, 255, 0.18), transparent 30%),
            linear-gradient(135deg, rgba(255,255,255,0.62), rgba(255,240,245,0.36)); }
        .home-hero::after { content: ''; position: absolute; inset: auto -10% -52% auto; width: 260px; height: 260px; background: radial-gradient(circle, rgba(255,255,255,0.22), transparent 65%); pointer-events: none; }
        .home-kicker { font-size: 12px; letter-spacing: 3px; color: var(--ink-light); }
        .home-title { margin: 8px 0 10px; font-family: var(--font-serif); font-size: 34px; color: var(--ink-main); }
        .home-text { max-width: 700px; font-size: 15px; line-height: 1.9; color: var(--ink-main); }
        .home-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
        .home-metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
        .home-metric { border-radius: 20px; border: 1px solid var(--border-fine); background: rgba(255,255,255,0.38); padding: 16px; }
        .home-metric-label { font-size: 12px; color: var(--ink-light); letter-spacing: 1px; margin-bottom: 8px; }
        .home-metric-value { font-family: var(--font-serif); font-size: 28px; color: var(--ink-main); }
        .home-metric-note { font-size: 12px; line-height: 1.6; color: var(--ink-light); margin-top: 6px; }
        .home-grid { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 24px; }
        .home-stack { display: grid; gap: 24px; }
        .home-card { background: var(--card-bg); border-radius: 24px; border: 1px solid var(--border-fine); padding: 26px; box-shadow: 0 10px 30px rgba(255, 182, 193, 0.12); backdrop-filter: blur(10px); }

        .idv-input { width: 100%; box-sizing: border-box; border-radius: 14px; border: 1px solid var(--border-fine); background: rgba(255,255,255,0.46); color: var(--ink-main); padding: 13px 14px; font-family: var(--font-ui); }
        .idv-highlight { border-radius: 20px; border: 1px solid var(--border-fine); background: linear-gradient(135deg, rgba(255,255,255,0.42), rgba(255,240,245,0.34)); padding: 18px; }
        .idv-highlight-kicker { font-size: 12px; letter-spacing: 2px; color: var(--ink-light); margin-bottom: 8px; }
        .idv-highlight-title { font-family: var(--font-serif); font-size: 24px; color: var(--ink-main); margin-bottom: 8px; }
        .idv-highlight-text { color: var(--ink-main); line-height: 1.85; }
        .idv-highlight-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
        .idv-highlight-tag { border-radius: 999px; padding: 6px 12px; background: rgba(255,255,255,0.56); border: 1px solid var(--border-fine); color: var(--ink-main); font-size: 12px; }
        .idv-log-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
        .idv-note { font-size: 13px; color: var(--ink-light); line-height: 1.7; }

        .timeline-group { margin-bottom: 60px; }
        .timeline-header { font-family: var(--font-serif); font-size: 20px; color: var(--ink-main); margin-bottom: 25px; position: sticky; top: 0; z-index: 10; background: var(--glass-bg); backdrop-filter: blur(15px); padding: 15px 20px; border-radius: 20px; border: 1px solid var(--border-fine); display: inline-block; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        .grid { display: grid; gap: 30px; }
        .grid-memory { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
        .grid-list { grid-template-columns: 1fr; }

        .card { background: var(--card-bg); border-radius: 24px; border: 1px solid var(--border-fine); position: relative; overflow: hidden; box-shadow: 0 10px 30px rgba(255, 182, 193, 0.15); backdrop-filter: blur(10px); }
        [data-theme="dark"] .card { box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        .card:hover { transform: translateY(-6px); box-shadow: 0 15px 40px rgba(255, 182, 193, 0.3); }
        .card img { width: 100%; height: 280px; object-fit: cover; border-bottom: 1px solid var(--border-fine); display: block; cursor: zoom-in;}
        .card-info { padding: 30px; position: relative; }
        .card-topline { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
        .card-title-inline { font-family: var(--font-serif); font-size: 20px; color: var(--ink-main); margin: 0; }
        .card-meta-inline { font-size: 12px; color: var(--ink-light); }
        .compact-toggle-row { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
        .density-switch { display: flex; gap: 8px; flex-wrap: wrap; }
        .density-chip { border-radius: 999px; border: 1px solid var(--border-fine); background: rgba(255,255,255,0.28); color: var(--ink-main); padding: 8px 12px; cursor: pointer; transition: 0.2s; }
        .density-chip.active { background: linear-gradient(135deg, rgba(255,183,178,0.92), rgba(130,202,255,0.82)); color: white; border-color: transparent; }
        .card-section-toggle { margin-top: 14px; border: 1px dashed var(--border-fine); background: rgba(255,255,255,0.24); color: var(--ink-main); border-radius: 14px; padding: 10px 14px; cursor: pointer; transition: 0.2s; }
        .card-section-toggle:hover { transform: translateY(-1px); }
        .story-preview-note { font-size: 13px; color: var(--ink-light); margin-top: 6px; }
        .actions { position: absolute; top: 15px; right: 15px; z-index: 24; }
        .card-menu-btn { width: 38px; height: 38px; border-radius: 50%; background: var(--glass-bg); border: 1px solid var(--border-fine); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--ink-light); backdrop-filter: blur(10px); transition: 0.25s; }
        .card-menu-btn:hover { color: white; background: var(--accent-bronze); border-color: var(--accent-bronze); }
        .card-menu-panel { position: absolute; top: 46px; right: 0; min-width: 132px; display: grid; gap: 8px; padding: 10px; border-radius: 18px; border: 1px solid var(--border-fine); background: rgba(255,255,255,0.94); box-shadow: 0 16px 36px rgba(0,0,0,0.12); backdrop-filter: blur(14px); }
        [data-theme="dark"] .card-menu-panel { background: rgba(43, 27, 58, 0.94); }
        .card-menu-item { width: 100%; text-align: left; border: none; border-radius: 12px; background: rgba(255,255,255,0.2); color: var(--ink-main); padding: 10px 12px; cursor: pointer; font-family: var(--font-ui); }
        .card-menu-item:hover { background: rgba(255,183,178,0.18); }
        .card-menu-item.danger { color: #b25463; }
        .bond-section-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; cursor: pointer; }
        .bond-section-kicker { font-size: 12px; letter-spacing: 2px; color: var(--ink-light); margin-bottom: 6px; }
        .bond-section-toggle { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--border-fine); background: rgba(255,255,255,0.38); color: var(--ink-main); cursor: pointer; font-size: 18px; }
        .bond-section-body { margin-top: 18px; display: grid; gap: 24px; }

        .album-cover { position: relative; cursor: pointer; background: #fff;}
        .album-cover::before, .album-cover::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--card-bg); border: 1px solid var(--border-fine); border-radius: 24px 24px 0 0; z-index: -1; transition: 0.3s;}
        .album-cover::before { transform: rotate(-3deg) scale(0.98); }
        .album-cover::after { transform: rotate(3deg) scale(0.98); }
        .album-badge { position: absolute; bottom: 15px; right: 15px; background: rgba(255,255,255,0.85); backdrop-filter: blur(5px); padding: 6px 12px; border-radius: 20px; font-size: 12px; color: var(--ink-main); font-weight: bold; border: 1px solid var(--border-fine); pointer-events: none;}
        
        .album-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--paper-bg); z-index: 1000; display: flex; flex-direction: column; overflow-y: auto; backdrop-filter: blur(20px); }
        .album-modal-header { position: sticky; top: 0; padding: 20px 30px; background: var(--glass-bg); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border-fine); display: flex; justify-content: space-between; align-items: center; z-index: 10;}
        .album-modal-header h2 { margin: 0; font-family: var(--font-serif); font-size: 24px; color: var(--ink-main); }
        .close-btn { background: var(--card-bg); border: 1px solid var(--border-fine); color: var(--ink-main); width: 40px; height: 40px; border-radius: 50%; font-size: 20px; cursor: pointer; }
        .lightbox-overlay { position: fixed; inset: 0; z-index: 1200; background: rgba(19, 12, 25, 0.92); backdrop-filter: blur(12px); display: flex; flex-direction: column; }
        .lightbox-header { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 18px 24px; color: #fff6fb; }
        .lightbox-title { font-family: var(--font-serif); font-size: 22px; }
        .lightbox-meta { font-size: 13px; color: rgba(255,255,255,0.64); margin-top: 4px; }
        .lightbox-stage { flex: 1; display: flex; align-items: center; justify-content: center; gap: 16px; padding: 10px 24px 24px; }
        .lightbox-nav { width: 46px; height: 46px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: #fff; cursor: pointer; font-size: 20px; }
        .lightbox-figure { max-width: min(1100px, 100%); max-height: 100%; display: grid; justify-items: center; gap: 14px; }
        .lightbox-figure img { max-width: min(1100px, 100%); max-height: calc(100vh - 170px); border-radius: 24px; object-fit: contain; box-shadow: 0 22px 60px rgba(0,0,0,0.3); }
        .lightbox-thumbs { display: flex; gap: 10px; overflow-x: auto; padding: 0 24px 20px; }
        .lightbox-thumb { width: 76px; height: 76px; border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.08); cursor: pointer; opacity: 0.68; }
        .lightbox-thumb.active { opacity: 1; border-color: rgba(255,183,178,0.88); transform: translateY(-2px); }
        .lightbox-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .album-modal-body { padding: 30px; max-width: 1200px; margin: 0 auto; width: 100%; box-sizing: border-box;}
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .gallery-item { position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 1; border: 1px solid var(--border-fine); background: var(--card-bg);}
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; transition: 0.4s; }
        .gallery-item:hover img { transform: scale(1.05); }
        .delete-img-btn { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; background: rgba(255,255,255,0.9); border-radius: 50%; border: none; color: #FF9AA2; cursor: pointer; opacity: 0; transition: 0.3s; font-size: 16px;}
        .gallery-item:hover .delete-img-btn { opacity: 1; }
        .append-area { margin-top: 40px; padding: 30px; text-align: center; border: 2px dashed var(--accent-bronze); border-radius: 20px; background: rgba(255,255,255,0.3); }
        .upload-preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 12px; margin-top: 16px; }
        .upload-preview-card { border-radius: 14px; overflow: hidden; border: 1px solid var(--border-fine); background: rgba(255,255,255,0.45); aspect-ratio: 1; }
        .upload-preview-card img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .author-stamp { position: absolute; bottom: 15px; right: 25px; font-family: var(--font-serif); font-size: 12px; color: var(--ink-light); }
        .deleted-stamp { position: absolute; top: 18px; left: 18px; font-size: 12px; color: #b25463; background: rgba(255,255,255,0.92); padding: 6px 12px; border-radius: 999px; border: 1px solid rgba(255, 154, 162, 0.35); z-index: 5; }
        .date { font-size: 13px; color: var(--ink-light); margin-bottom: 15px; display: block; text-align: center; letter-spacing: 1px;}
        
        .story-title { font-family: var(--font-serif); font-size: 24px; font-weight: bold; text-align: center; margin-bottom: 25px; letter-spacing: 2px; color: var(--ink-main);}
        .card-story { background: var(--story-bg); border: 1px solid var(--border-fine); }
        .story-content { font-family: var(--font-serif); font-size: 16px; line-height: 2.2; text-align: justify; }
        .text-xiaocheng { color: var(--color-xiaocheng); }
        .text-xiaoxin { color: var(--color-xiaoxin); }
        .story-seg { border-radius: 8px; padding: 4px 10px; margin-bottom: 10px; white-space: pre-wrap; word-wrap: break-word; display: block; transition: 0.3s;}
        .story-seg:hover { background: rgba(255, 182, 193, 0.1); }

        .edit-title, .seg-textarea, .edit-area { width: 100%; box-sizing: border-box; font-family: var(--font-serif); padding: 15px; border: 1px solid var(--border-fine); background: rgba(255,255,255,0.5); color: var(--ink-main); border-radius: 12px; outline: none; }
        .edit-seg-row { display: flex; gap: 12px; margin-bottom: 15px; align-items: flex-start; }
        .seg-author-badge { font-family: var(--font-serif); font-size: 12px; padding: 6px 10px; border-radius: 8px; color: white; white-space: nowrap; margin-top: 5px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);}
        .bg-xiaocheng { background: var(--color-xiaocheng); }
        .bg-xiaoxin { background: var(--color-xiaoxin); }
        .add-seg-btn { width: 100%; background: rgba(255, 255, 255, 0.3); border: 2px dashed var(--accent-bronze); color: var(--ink-main); padding: 12px; margin-top: 10px; border-radius: 12px; cursor: pointer; transition: 0.3s;}

        .action-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--glass-bg); border: 1px solid var(--border-fine); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; color: var(--ink-light); backdrop-filter: blur(10px); transition: 0.3s;}
        .action-btn:hover { color: white; background: var(--accent-bronze); border-color: var(--accent-bronze); transform: scale(1.1);}

        .wish-item { display: flex; align-items: center; gap: 15px; background: rgba(255,255,255,0.4); padding: 10px 15px; border-radius: 12px; border: 1px solid var(--border-fine);}
        .wish-checkbox { width: 22px; height: 22px; accent-color: var(--accent-bronze); cursor: pointer;}
        .wish-completed { text-decoration: line-through; color: var(--ink-light); opacity: 0.7;}
        .note { font-family: var(--font-serif); font-size: 16px; line-height: 2.2; color: var(--ink-main); white-space: pre-wrap; }
        
        @media (max-width: 768px) {
            #app { padding: 16px 14px calc(28px + env(safe-area-inset-bottom, 0px)); }
            .login-box { width: min(100%, 320px); padding: 34px 24px; border-radius: 24px; }
            .login-box h1 { font-size: 26px; letter-spacing: 2px; }
            .login-box input { width: 100%; box-sizing: border-box; }
            .header { position: sticky; top: 0; z-index: 40; margin: 0 -2px 20px; padding: 10px 0 12px; align-items: stretch; flex-direction: column-reverse; gap: 12px; background: linear-gradient(180deg, rgba(255,240,245,0.92), rgba(255,240,245,0.68)); backdrop-filter: blur(16px); }
            [data-theme="dark"] .header { background: linear-gradient(180deg, rgba(44,26,61,0.94), rgba(44,26,61,0.72)); }
            .nav-tabs { gap: 10px; padding: 0 2px 6px; scroll-snap-type: x proximity; }
            .tab { font-size: 15px; padding: 10px 2px 8px; scroll-snap-align: start; }
            .header-actions { justify-content: space-between; }
            .theme-toggle { width: 42px; height: 42px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(255,255,255,0.32); }
            .user-badge { padding: 8px 14px; min-height: 42px; box-sizing: border-box; }
            .notice, .undo-bar { margin-left: 0; margin-right: 0; }
            .undo-bar { align-items: stretch; flex-direction: column; }
            .undo-bar .action-submit { width: 100%; }
            .control-panel { padding: 18px; margin-bottom: 24px; border-radius: 20px; }
            .input-group { flex-direction: column; align-items: stretch; gap: 12px; }
            .file-upload-wrapper { width: 100%; box-sizing: border-box; min-height: 52px; }
            .title-input, .note-input, .filter-select, input[type="date"], .bond-select, .private-input { min-height: 50px; box-sizing: border-box; font-size: 16px; }
            textarea.edit-area, textarea.seg-textarea, .bond-textarea, textarea.private-input { min-height: 112px; }
            button.action-submit, .secondary-btn, .danger-btn, .bond-chip, .private-chip, .night-subtab, .density-chip, .mood-chip, .mode-switch { min-height: 46px; }
            .fun-actions, .bond-actions, .home-actions { display: grid; grid-template-columns: 1fr; }
            .fun-actions .action-submit, .bond-actions .action-submit, .home-actions .action-submit { width: 100%; }
            .compact-toggle-row { align-items: stretch; }
            .density-switch { width: 100%; }
            .density-chip { flex: 1 1 0; text-align: center; }
            .actions { opacity: 1; }
            .card { border-radius: 20px; }
            .card img { height: 220px; }
            .card-info { padding: 18px 18px 52px; }
            .card-topline { align-items: flex-start; }
            .card-title-inline { font-size: 18px; }
            .card-menu-btn { width: 42px; height: 42px; }
            .card-menu-panel { top: 48px; min-width: 148px; }
            .timeline-header { width: calc(100% - 2px); box-sizing: border-box; position: sticky; top: 68px; display: block; padding: 12px 16px; font-size: 17px; border-radius: 16px; }
            .gallery-grid { grid-template-columns: repeat(2, 1fr); }
            .album-modal-header { padding: 14px 16px; }
            .album-modal-header h2 { font-size: 20px; max-width: calc(100% - 56px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            .album-modal-body { padding: 18px 16px 26px; }
            .gallery-item:hover img { transform: none; }
            .delete-img-btn { opacity: 1; width: 32px; height: 32px; }
            .stats-dashboard { grid-template-columns: 1fr; }
            .review-grid { grid-template-columns: 1fr; }
            .review-card.wide { grid-column: auto; }
            .fun-dashboard { grid-template-columns: 1fr; }
            .fun-card.wide { grid-column: auto; }
            .game-metrics, .game-dice-grid { grid-template-columns: 1fr; }
            .gomoku-board { gap: 3px; padding: 6px; border-radius: 18px; }
            .gomoku-cell { border-radius: 8px; }
            .arcade-stats { grid-template-columns: 1fr 1fr; }
            .home-metrics { grid-template-columns: 1fr 1fr; }
            .home-grid { grid-template-columns: 1fr; }
            .home-title { font-size: 28px; }
            .home-card, .fun-card { padding: 20px; border-radius: 20px; }
            .home-card-title, .fun-title { font-size: 22px; }
            .home-recent-item { padding: 12px 14px; }
            .private-grid { grid-template-columns: 1fr; }
            .night-play-grid { grid-template-columns: 1fr; }
            .idv-grid, .idv-role-grid, .idv-log-grid, .idv-stats { grid-template-columns: 1fr; }
            .utility-grid { grid-template-columns: 1fr; }
            .decision-wheel-grid { grid-template-columns: 1fr; }
            .scenario-grid { grid-template-columns: 1fr; }
            .bond-grid { grid-template-columns: 1fr; }
            .bond-card.wide { grid-column: auto; }
            .bond-metrics { grid-template-columns: 1fr 1fr; }
            .bond-weekly-grid { grid-template-columns: 1fr; }
            .bond-split { grid-template-columns: 1fr; }
            .bond-card, .bond-highlight, .private-panel, .night-panel { border-radius: 18px; }
            .idv-panel, .idv-stat, .idv-highlight, .idv-role-card { border-radius: 18px; }
            .bond-section-head { align-items: flex-start; }
            .bond-section-toggle { width: 40px; height: 40px; flex: none; }
            .night-dice { width: 100%; min-height: 116px; }
            .night-play-stat { min-width: auto; flex: 1 1 120px; }
            .lightbox-stage { padding: 0 12px 18px; gap: 8px; }
            .lightbox-header { padding: 16px; }
            .lightbox-title { font-size: 18px; }
            .lightbox-nav { width: 42px; height: 42px; }
            .lightbox-figure img { max-height: calc(100vh - 190px); border-radius: 18px; }
            .lightbox-thumbs { padding: 0 16px 16px; }
            .lightbox-thumb { width: 64px; height: 64px; }
        }

        @media (max-width: 520px) {
            #app { padding: 14px 12px calc(24px + env(safe-area-inset-bottom, 0px)); }
            .tab { font-size: 14px; }
            .nav-tabs { gap: 8px; }
            .home-metrics, .arcade-stats, .bond-metrics { grid-template-columns: 1fr; }
            .grid-memory { grid-template-columns: 1fr; }
            .gallery-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
            .card img { height: 190px; }
            .card-info { padding: 16px 16px 48px; }
            .story-title { font-size: 20px; margin-bottom: 18px; }
            .note, .story-content { font-size: 15px; line-height: 1.9; }
            .timeline-header { top: 64px; font-size: 16px; }
            .home-title { font-size: 24px; }
            .home-card-title, .fun-title, .night-play-title, .idv-panel-title { font-size: 20px; }
            .album-modal-body { padding: 16px 12px 24px; }
            .lightbox-header { padding: 12px; }
            .lightbox-stage { padding: 0 8px 14px; }
            .lightbox-figure img { max-height: calc(100vh - 170px); }
        }
    </style>
</head>
<body>

<div id="app">
    <div v-if="!currentUser" class="login-overlay">
        <div class="login-box">
            <h1>开启梦境 🎀</h1>
            <input type="password" v-model="loginCode" @keyup.enter="login" placeholder="输入魔法暗号...">
        </div>
    </div>

    <template v-else>
        <div v-if="currentAlbum" class="album-modal">
            <div class="album-modal-header">
                <h2>《 {{ currentAlbum.title || '无名相册' }} 》</h2>
                <button class="close-btn" @click="closeAlbum">×</button>
            </div>
            <div class="album-modal-body">
                <div v-if="currentAlbum.note" class="album-desc" style="text-align: center; margin-bottom:30px;">{{ currentAlbum.note }}</div>
                <div v-if="getItemImages(currentAlbum).length > 0" class="gallery-grid">
                    <div v-for="(img, index) in getItemImages(currentAlbum)" :key="img._id || img.public_id || img.url" class="gallery-item">
                        <img :src="img.url" @error="handleImageError($event)" @click="openItemMedia(currentAlbum, index)">
                        <button v-if="!albumReadOnly && img._id" class="delete-img-btn" @click="deleteImageFromAlbum(currentAlbum._id, img._id)">×</button>
                    </div>
                </div>
                <div v-else class="empty-state">这本相册里暂时没有可显示的照片。</div>
                <div v-if="!albumReadOnly" class="append-area">
                    <div class="file-upload-wrapper" style="max-width: 300px; margin: 0 auto; margin-bottom: 15px;">
                        <input type="file" @change="handleAppendFiles" accept="image/*" multiple>
                        <span class="file-upload-text">{{ appendFiles.length > 0 ? `已选 ${appendFiles.length} 张图片 🌸` : '+ 挑选新照片入册' }}</span>
                    </div>
                    <div v-if="appendFilePreviews.length > 0" class="upload-preview-grid">
                        <div v-for="preview in appendFilePreviews" :key="preview.id" class="upload-preview-card">
                            <img :src="preview.url" :alt="preview.name" @error="handleImageError($event)">
                        </div>
                    </div>
                    <button class="action-submit" @click="submitAppendPhotos" v-if="appendFiles.length > 0" :disabled="isUploading">
                        {{ isUploading ? '✨ 传送中...' : '确认追加照片' }}
                    </button>
                </div>
                <div v-else class="append-area" style="border-style: solid;">
                    回收站中的相册仅支持查看，恢复后才能继续追加或删除照片。
                </div>
            </div>
        </div>

        <div v-if="lightboxOpen" class="lightbox-overlay" @click.self="closeLightbox">
            <div class="lightbox-header">
                <div>
                    <div class="lightbox-title">{{ lightboxTitle || '图片预览' }}</div>
                    <div class="lightbox-meta">第 {{ lightboxIndex + 1 }} / {{ lightboxImages.length }} 张</div>
                </div>
                <button class="close-btn" @click="closeLightbox">×</button>
            </div>

            decisionOptionsResolved() {
                const custom = this.decisionOptionsInput
                    .split(/[,，]/)
                    .map(item => item.trim())
                    .filter(Boolean);
                if (custom.length >= 2) return custom.slice(0, 6);
                const preset = this.decisionPresetDecks.find(item => item.key === this.decisionPreset);

            decisionWheelSegments() {
                const options = this.decisionOptionsResolved;
                const step = options.length > 0 ? 360 / options.length : 360;
                return options.map((option, index) => {
                    const angle = index * step + step / 2 - 90;
                    return {
                        key: `${option}-${index}`,
                        label: option,
                        style: {
                            transform: `translate(-50%, -50%) rotate(${angle}deg) translateY(-98px) rotate(${-angle}deg)`
                        }
                    };
                });
            },
            decisionWheelStyle() {
                const options = this.decisionOptionsResolved;
                const palette = ['rgba(255,183,178,0.95)', 'rgba(130,202,255,0.88)', 'rgba(230,168,215,0.88)', 'rgba(255,225,168,0.88)', 'rgba(190,228,197,0.9)', 'rgba(188,183,255,0.85)'];
                if (options.length === 0) {
                    return { transform: `rotate(${this.decisionRotationDeg}deg)` };
                }
                const step = 360 / options.length;
                const stops = options.map((_, index) => {
                    const start = Math.round(index * step);
                    const end = Math.round((index + 1) * step);
                    return `${palette[index % palette.length]} ${start}deg ${end}deg`;
                }).join(', ');
                return {
                    '--wheel-gradient': `conic-gradient(from -90deg, ${stops})`,

            weeklyBondReport() {
                const now = new Date();
                const start = new Date(now);
                start.setDate(now.getDate() - 6);
                start.setHours(0, 0, 0, 0);
                const startTime = start.getTime();
                const allRelationshipEntries = Object.values(this.relationshipEntries).flat();
                const recentRelationshipEntries = allRelationshipEntries.filter(entry => Number(entry.time || 0) >= startTime);
                const recentReplies = this.relationshipItems.flatMap(item => (item.replies || []).map(reply => ({ ...reply, source: 'reply' }))).filter(entry => Number(entry.time || 0) >= startTime);
                const recentPerspectives = this.relationshipItems.flatMap(item => (item.perspectives || []).map(entry => ({ ...entry, source: 'perspective' }))).filter(entry => Number(entry.time || 0) >= startTime);
                const praiseCount = recentRelationshipEntries.filter(entry => entry.type === 'praise').length;
                const repairCount = recentRelationshipEntries.filter(entry => entry.type === 'repair').length;
                const completedCompanionCount = recentRelationshipEntries.filter(entry => entry.type === 'companion' && entry.completed).length;
                const completedRitualCount = recentRelationshipEntries.filter(entry => entry.type === 'ritual' && entry.completed).length;
                const totalInteractions = recentRelationshipEntries.length + recentReplies.length + recentPerspectives.length;
                const headline = totalInteractions === 0 ? '这一周还很安静' : `${totalInteractions} 次认真靠近已经发生`;
                const summary = totalInteractions === 0
                    ? '本周还没有新的关系互动记录，可以从一条回信、一次温度记录或一张小修复卡开始。'
                    : `这周你们已经留下 ${praiseCount} 条夸夸、${recentReplies.length} 封回信、${recentPerspectives.length} 段双视角补完。关系不是靠大事件推进，而是靠这些小而稳定的回应慢慢变厚。`;
                return {
                    totalInteractions,
                    praiseCount,
                    repairCount,
                    replyCount: recentReplies.length,
                    perspectiveCount: recentPerspectives.length,
                    completedCompanionCount,
                    completedRitualCount,
                    completedCount: completedCompanionCount + completedRitualCount,
                    headline,
                    summary
                };
            },
            bondStreakDays() {
                const activeDates = new Set();
                Object.values(this.relationshipEntries).flat().forEach(entry => {
                    if (entry.date) activeDates.add(entry.date);
                });
                this.relationshipItems.forEach(item => {
                    (item.replies || []).forEach(entry => { if (entry.date) activeDates.add(entry.date); });
                    (item.perspectives || []).forEach(entry => { if (entry.date) activeDates.add(entry.date); });
                });
                let streak = 0;
                let cursor = new Date();
                while (true) {
                    const date = new Date(cursor.getTime() - cursor.getTimezoneOffset() * 60000).toISOString().split('T')[0];
                    if (!activeDates.has(date)) break;
                    streak += 1;
                    cursor.setDate(cursor.getDate() - 1);
                }
                return streak;
            },
            bondHeatmapCells() {
                const counts = new Map();
                Object.values(this.relationshipEntries).flat().forEach(entry => {
                    if (!entry.date) return;
                    counts.set(entry.date, (counts.get(entry.date) || 0) + 1);
                });
                this.relationshipItems.forEach(item => {
                    (item.replies || []).forEach(entry => {
                        if (!entry.date) return;
                        counts.set(entry.date, (counts.get(entry.date) || 0) + 1);
                    });
                    (item.perspectives || []).forEach(entry => {
                        if (!entry.date) return;
                        counts.set(entry.date, (counts.get(entry.date) || 0) + 1);
                    });
                });

                const days = [];
                const today = new Date();
                for (let offset = 55; offset >= 0; offset -= 1) {
                    const date = new Date(today);
                    date.setDate(today.getDate() - offset);
                    const iso = new Date(date.getTime() - date.getTimezoneOffset() * 60000).toISOString().split('T')[0];
                    const count = counts.get(iso) || 0;
                    let level = 0;
                    if (count >= 4) level = 3;
                    else if (count >= 2) level = 2;
                    else if (count >= 1) level = 1;
                    days.push({
                        date: iso,
                        count,
                        level,
                        short: `${date.getMonth() + 1}/${date.getDate()}`
                    });
                }
                return days;
            },

            emptyStateText() {

            groupedItems() {

        },
        methods: {
            // ✨ 震动触觉核心魔法
            vibrate(pattern = 50) {
                if ('vibrate' in navigator) { try { navigator.vibrate(pattern); } catch (e) {} }
            },
            refreshInstallState() {
                const standaloneByDisplayMode = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches;
                const standaloneByNavigator = window.navigator.standalone === true;
                this.isStandaloneApp = Boolean(standaloneByDisplayMode || standaloneByNavigator);
                const ua = window.navigator.userAgent || '';
                this.isIosDevice = /iPhone|iPad|iPod/i.test(ua);
                this.showIosInstallHint = this.isIosDevice && !this.isStandaloneApp && !this.canInstallApp;
                if (this.isStandaloneApp) {
                    this.canInstallApp = false;
                    this.deferredInstallPrompt = null;
                }
            },
            handleBeforeInstallPrompt(event) {
                event.preventDefault();
                this.deferredInstallPrompt = event;
                this.canInstallApp = true;
                this.refreshInstallState();
            },
            async promptInstallApp() {
                if (!this.deferredInstallPrompt) {
                    this.refreshInstallState();
                    this.showNotice('info', this.showIosInstallHint ? '请按下方步骤添加到主屏幕' : '当前浏览器还没给出安装时机');
                    return;
                }
                this.deferredInstallPrompt.prompt();
                try {
                    await this.deferredInstallPrompt.userChoice;
                } catch (error) {}
                this.deferredInstallPrompt = null;
                this.canInstallApp = false;
                this.refreshInstallState();
            },
            handleAppInstalled() {
                this.deferredInstallPrompt = null;
                this.canInstallApp = false;
                this.refreshInstallState();
                this.showNotice('success', '已经安装到主屏幕，可以像客户端一样打开了');
            },
            toggleIosInstallHint() {
                this.iosInstallHintOpen = !this.iosInstallHintOpen;
            },
            showNotice(type, text) {
                if (!text) return;
                if (this.noticeTimer) clearTimeout(this.noticeTimer);
                this.notice = { type, text };
                this.noticeTimer = setTimeout(() => {
                    this.notice = { type: '', text: '' };
                    this.noticeTimer = null;
                }, 4000);
            },
            clearNotice() {
                if (this.noticeTimer) {
                    clearTimeout(this.noticeTimer);
                    this.noticeTimer = null;
                }
                this.notice = { type: '', text: '' };
            },
            pushUndoAction(action) {
                if (!action?.kind) return;
                if (this.undoTimer) clearTimeout(this.undoTimer);
                this.undoAction = action;
                this.undoTimer = window.setTimeout(() => {
                    this.undoAction = null;
                    this.undoTimer = null;
                }, 8000);
            },
            clearUndoAction() {
                if (this.undoTimer) {
                    clearTimeout(this.undoTimer);
                    this.undoTimer = null;
                }
                this.undoAction = null;
            },
            async undoLastAction() {
                const action = this.undoAction;
                if (!action) return;
                this.clearUndoAction();
                try {
                    if (action.kind === 'delete') {
                        await axios.post(`/api/items/${action.id}/restore`);
                        if (this.showListView) this.getItems();
                        this.fetchAllItemsForStats();
                        this.showNotice('success', '刚才删除的内容已经恢复');
                    } else if (action.kind === 'draft') {
                        localStorage.setItem(this.getComposerDraftKey(action.tab), action.raw);
                        this.refreshComposerDraftMeta();
                        if (action.tab === this.currentTab && this.showComposer) this.loadComposerDraftForTab(action.tab);
                        this.showNotice('success', '草稿已恢复');
                    } else if (action.kind === 'wish_toggle') {
                        await axios.put(`/api/items/${action.id}`, { completed: action.previousCompleted });
                        if (this.showListView) this.getItems();
                        this.fetchAllItemsForStats();
                        this.showNotice('success', '心愿状态已恢复');
                    }

                    kind: 'create_item',

                }, ...this.syncQueue];

                }, ...this.syncQueue];

                    .filter(entry => entry.kind === 'create_item' && entry.localItem)

                    .sort((a, b) => this.getItemActivityTimestamp(b) - this.getItemActivityTimestamp(a));

            mergeItemsWithQueuedContent(remoteItems, tab = '') {
                const merged = [...(Array.isArray(remoteItems) ? remoteItems : [])];
                const existingIds = new Set(merged.map(item => item._id));
                this.getQueuedCreateItems(tab).forEach(item => {
                    if (!existingIds.has(item._id)) merged.unshift(item);
                });
                return this.applyQueuedReplyOverlays(merged);

            applyQueuedReplyOverlays(sourceItems) {
                const items = (sourceItems || []).map(item => ({ ...item, replies: Array.isArray(item.replies) ? [...item.replies] : [] }));
                const itemMap = new Map(items.map(item => [item._id, item]));
                (this.syncQueue || [])
                    .filter(entry => entry.kind === 'reply_item' && entry.localReply)
                    .forEach(entry => {
                        const target = itemMap.get(entry.itemId);
                        if (!target) return;
                        if (target.replies.some(reply => reply.pendingKey === entry.localReply.pendingKey)) return;
                        target.replies = [entry.localReply, ...(target.replies || [])];
                    });
                return items;

            async processSyncQueue(showSuccessNotice = false) {
                if (!this.currentUser || !this.isOnline || this.syncInFlight || (this.syncQueue || []).length === 0) return;
                this.syncInFlight = true;
                let syncedCount = 0;
                try {
                    for (let index = 0; index < this.syncQueue.length;) {
                        const entry = this.syncQueue[index];
                        try {
                            if (entry.kind === 'create_item') {
                                const payload = entry.payload || {};
                                const fd = new FormData();
                                fd.append('category', payload.category || 'diary');
                                fd.append('title', payload.title || '');
                                fd.append('author', payload.author || this.currentUser);
                                fd.append('mood', payload.mood || '');
                                fd.append('date', payload.date || this.getLocalDateString());
                                if (payload.category === 'story') {
                                    fd.append('segments', JSON.stringify(payload.segments || []));
                                } else {
                                    fd.append('note', payload.note || '');
                                }
                                const res = await axios.post('/api/items', fd);
                                this.replaceLocalItemWithServer(entry.localId, res.data);
                                this.syncQueue = this.syncQueue.map(queueEntry => {
                                    if (queueEntry.kind === 'reply_item' && queueEntry.itemId === entry.localId) {
                                        return { ...queueEntry, itemId: res.data._id };
                                    }
                                    return queueEntry;
                                });
                            } else if (entry.kind === 'reply_item') {
                                const targetId = entry.itemId || '';
                                if (!targetId || String(targetId).startsWith('local-item-')) {
                                    index += 1;
                                    continue;
                                }
                                const res = await axios.post(`/api/items/${targetId}/replies`, entry.payload || {});
                                this.replaceItemInCollections(res.data);
                            }
                            this.syncQueue.splice(index, 1);
                            this.persistSyncQueue();
                            syncedCount += 1;
                        } catch (error) {
                            if (!this.isLikelyOfflineError(error)) {
                                this.showNotice('error', this.getErrorMessage(error, '有一条离线内容同步失败'));
                                break;
                            }
                            break;
                        }
                    }
                } finally {
                    this.syncInFlight = false;
                    if (syncedCount > 0) {
                        if (this.showListView) this.getItems();
                        this.refreshAllItemsSnapshot(false);
                        if (showSuccessNotice) this.showNotice('success', `已自动同步 ${syncedCount} 项内容`);
                    }
                }
            },

            getItemActivityTimestamp(item) {
                const numericDirect = Number(item?.time || 0);
                if (Number.isFinite(numericDirect) && numericDirect > 0) return numericDirect;
                const createdAt = item?.createdAt ? Date.parse(item.createdAt) : NaN;
                if (Number.isFinite(createdAt) && createdAt > 0) return createdAt;
                const updatedAt = item?.updatedAt ? Date.parse(item.updatedAt) : NaN;
                if (Number.isFinite(updatedAt) && updatedAt > 0) return updatedAt;

                return Number.isFinite(parsed) ? parsed : 0;

            async ensureContentNotificationSetup(interactive = false) {
                const backgroundRunner = this.getCapacitorPlugin('BackgroundRunner');
                if (this.isNativeShell()) {
                    const localNotifications = this.getCapacitorPlugin('LocalNotifications');
                    if (localNotifications?.checkPermissions) {
                        try {
                            let permission = await localNotifications.checkPermissions();
                            let display = permission?.display || 'granted';
                            if (display === 'prompt' && interactive && localNotifications.requestPermissions) {
                                permission = await localNotifications.requestPermissions();
                                display = permission?.display || display;
                            }
                            this.notificationPermissionState = display;
                        } catch (error) {
                            this.notificationPermissionState = 'denied';
                        }
                    } else {
                        this.notificationPermissionState = 'granted';
                    }
                    if (backgroundRunner?.requestPermissions && interactive) {
                        try {
                            await backgroundRunner.requestPermissions({ apis: ['notifications'] });
                        } catch (error) {}
                    }
                    if (this.notificationPermissionState === 'granted') {
                        await this.ensureNotificationChannel();
                    }
                } else if ('Notification' in window) {
                    this.notificationPermissionState = Notification.permission || 'default';
                    if (interactive && this.notificationPermissionState === 'default') {

                        }

                    this.remoteLatestByCategory = payload.latestByCategory || {};
                    if (this.getTrackedTabs().includes(this.currentTab)) {
                        const previousSeen = Number(this.seenTabActivity?.[this.currentTab] || 0);
                        const currentTabLatest = Math.max(

                            this.getLatestRemoteActivityForTab(this.currentTab)

            },
            startNewDiceRound() {
                this.gameDiceRound = { '小橙': 0, '小心': 0 };
                this.gameDiceRoundWinner = '';
                this.persistGameState();
            },
            clearDiceHistory() {
                this.startNewDiceRound();
                this.gameDiceHistory = [];
                this.gameDiceWins = { '小橙': 0, '小心': 0 };
                this.persistGameState();
            },
            getGomokuStoneForPlayer(player) {
                return player === '小橙' ? 'black' : 'white';
            },
            getPlayerByStone(stone) {
                return stone === 'black' ? '小橙' : '小心';
            },
            placeGomokuStone(row, col) {
                if (this.gomokuWinner || this.gomokuBoard[row]?.[col]) return;
                const stone = this.getGomokuStoneForPlayer(this.gomokuCurrentPlayer);
                const nextBoard = this.gomokuBoard.map(line => line.slice());
                nextBoard[row][col] = stone;
                this.gomokuBoard = nextBoard;
                this.gomokuMoves = [...this.gomokuMoves, { row, col, stone }];
                if (this.checkGomokuWinner(row, col, stone)) {
                    this.gomokuWinner = this.gomokuCurrentPlayer;
                    this.gomokuWins = {
                        ...this.gomokuWins,
                        [this.gomokuCurrentPlayer]: this.gomokuWins[this.gomokuCurrentPlayer] + 1
                    };
                    this.vibrate([120, 80, 160]);
                } else {
                    this.gomokuCurrentPlayer = this.gomokuCurrentPlayer === '小橙' ? '小心' : '小橙';
                    this.vibrate(30);
                }
                this.persistGameState();
            },
            checkGomokuWinner(row, col, stone) {
                const directions = [[1, 0], [0, 1], [1, 1], [1, -1]];
                return directions.some(([dr, dc]) => {
                    let count = 1;
                    let r = row + dr;
                    let c = col + dc;
                    while (this.gomokuBoard[r]?.[c] === stone) {
                        count += 1;
                        r += dr;
                        c += dc;
                    }
                    r = row - dr;
                    c = col - dc;
                    while (this.gomokuBoard[r]?.[c] === stone) {
                        count += 1;
                        r -= dr;
                        c -= dc;
                    }
                    return count >= 5;
                });
            },
            undoGomokuMove() {
                if (this.gomokuMoves.length === 0 || this.gomokuWinner) return;
                const moves = this.gomokuMoves.slice();
                const last = moves.pop();
                const nextBoard = this.gomokuBoard.map(line => line.slice());
                nextBoard[last.row][last.col] = '';
                this.gomokuBoard = nextBoard;
                this.gomokuMoves = moves;
                this.gomokuCurrentPlayer = this.getPlayerByStone(last.stone);
                this.persistGameState();
            },
            resetGomokuBoard() {
                this.gomokuBoard = this.createEmptyGomokuBoard();
                this.gomokuMoves = [];
                this.gomokuCurrentPlayer = '小橙';
                this.gomokuWinner = '';
                this.persistGameState();
            },
            getDisplayCategory(item) {
                return this.currentTab === 'recycle' ? item.category : this.currentTab;
            },
            toggleCardMenu(id) {
                this.activeCardMenuId = this.activeCardMenuId === id ? '' : id;
            },
            closeCardMenu() {
                this.activeCardMenuId = '';
            },
            toggleBondSection(key) {
                this.bondSectionOpen = {
                    ...this.bondSectionOpen,
                    [key]: !this.bondSectionOpen[key]
                };
            },
            getMoodLabel(moodKey) {
                const mood = this.moodOptions.find(item => item.key === moodKey);
                return mood ? mood.label : '';
            },
            normalizeClientImageUrl(url) {
                const normalized = typeof url === 'string' ? url.trim() : '';
                if (!normalized) return '';
                if (normalized.startsWith('data:') || normalized.startsWith('blob:')) {
                    return normalized;
                }
                if (normalized.startsWith('/api/')) {
                    return ORANGE_API_BASE ? `${ORANGE_API_BASE}${normalized}` : normalized;
                }
                const secureUrl = normalized.replace(/^http:\/\//i, 'https://');
                try {
                    const parsed = new URL(secureUrl, window.location.origin);
                    if (parsed.origin === window.location.origin) {
                        return parsed.href;
                    }
                    if (parsed.hostname === 'res.cloudinary.com' || parsed.hostname.endsWith('.cloudinary.com')) {
                        return `/api/media/proxy?src=${encodeURIComponent(parsed.href)}`;
                    }
                    return parsed.href;
                } catch (error) {
                    return secureUrl;
                }
            },
            getItemImages(item) {
                if (!item) return [];
                const images = Array.isArray(item.images) ? item.images : [];
                const normalizedImages = images
                    .map((image, index) => {
                        const url = this.normalizeClientImageUrl(image?.url);
                        if (!url) return null;
                        return {
                            ...image,
                            _id: image?._id || '',
                            public_id: image?.public_id || `${item._id || 'image'}-${index}`,
                            url
                        };
                    })
                    .filter(Boolean);
                if (normalizedImages.length > 0) return normalizedImages;
                const fallbackUrl = this.normalizeClientImageUrl(item.url);
                return fallbackUrl
                    ? [{
                        _id: '',
                        public_id: item.public_id || `${item._id || 'cover'}-legacy`,
                        url: fallbackUrl
                    }]
                    : [];
            },
            getPrimaryImage(item) {
                return this.getItemImages(item)[0]?.url || this.fallbackImage;
            },
            openLightbox(images = [], startIndex = 0, title = '') {
                if (!Array.isArray(images) || images.length === 0) return;
                this.lightboxImages = images;
                this.lightboxIndex = Math.max(0, Math.min(startIndex, images.length - 1));
                this.lightboxTitle = title;
                this.lightboxOpen = true;
                document.body.style.overflow = 'hidden';
            },
            closeLightbox() {
                this.lightboxOpen = false;
                this.lightboxImages = [];
                this.lightboxIndex = 0;
                this.lightboxTitle = '';
                if (!this.currentAlbum) document.body.style.overflow = 'auto';
            },
            setLightboxIndex(index) {
                if (index < 0 || index >= this.lightboxImages.length) return;
                this.lightboxIndex = index;
            },
            showPrevLightbox() {
                if (this.lightboxImages.length <= 1) return;
                this.lightboxIndex = (this.lightboxIndex - 1 + this.lightboxImages.length) % this.lightboxImages.length;
            },
            showNextLightbox() {
                if (this.lightboxImages.length <= 1) return;
                this.lightboxIndex = (this.lightboxIndex + 1) % this.lightboxImages.length;
            },
            openItemMedia(item, index = 0) {
                const images = this.getItemImages(item).map(image => ({ url: image.url, alt: this.getItemDisplayTitle(item) }));
                this.openLightbox(images, index, this.getItemDisplayTitle(item));
            },
            handleImageError(event) {
                if (event?.target && event.target.src !== this.fallbackImage) {
                    event.target.src = this.fallbackImage;
                }
            },
            revokePreviewUrls(previews = []) {
                previews.forEach(preview => {
                    if (preview?.url && preview.url.startsWith('blob:')) {
                        URL.revokeObjectURL(preview.url);
                    }
                });
            },
            createFilePreviews(files = []) {
                return files.map((file, index) => ({
                    id: `${file.name || 'image'}-${file.lastModified || Date.now()}-${index}`,
                    name: file.name || `照片 ${index + 1}`,
                    url: URL.createObjectURL(file)
                }));
            },
            getGroupGridClass(itemsInGroup) {
                const hasMediaCard = itemsInGroup.some(item => ['memory', 'album'].includes(this.getDisplayCategory(item)));
                return hasMediaCard ? 'grid-memory' : 'grid-list';
            },
            getCategoryLabel(category) {
                const labels = { memory: '纪事', album: '相册', diary: '随笔', story: '浮梦' };
                return labels[category] || '内容';
            },
            getItemDisplayTitle(item) {
                if (item.title && item.title.trim()) return item.title.trim();
                if (item.note && item.note.trim()) return item.note.trim().slice(0, 24);
                return `${this.getCategoryLabel(item.category)}记录`;
            },
            getItemExcerpt(item) {
                if (item.note && item.note.trim()) return item.note.trim().slice(0, 120);
                if (item.segments && item.segments.length > 0) {
                    return item.segments.map(seg => seg.text).join(' ').trim().slice(0, 120);
                }
                return '这条记录里没有留下更多文字。';
            },
            getCompactTitle(item) {
                if (item.title && item.title.trim()) return item.title.trim();
                return `${this.getCategoryLabel(item.category)} · ${item.author || '我们'}`;
            },
            isCardExpanded(item) {

            },
            toggleCardExpanded(itemId) {
                this.expandedCardIds = {
                    ...this.expandedCardIds,
                    [itemId]: !this.expandedCardIds[itemId]
                };
            },
            getVisibleNote(item) {
                const note = item?.note || '';
                if (this.isCardExpanded(item) || note.length <= 120) return note;
                return `${note.slice(0, 120)}…`;

            getVisibleStorySegments(item) {

                if (this.isCardExpanded(item) || segments.length <= 2) return segments;
                return segments.slice(0, 2);

            showCompactStoryHint(item) {

            canExpandCard(item) {

                if (category === 'album') return false;
                if (category === 'story') return (item?.segments || []).length > 2;
                return (item?.note || '').length > 120;
            },
            shouldShowExtraDetails(item) {
                return this.isCardExpanded(item) || this.getDisplayCategory(item) === 'album';
            },
            setListDensityMode(mode) {
                this.listDensityMode = mode;
                this.persistUiState();
            },
            handleEmptyStateAction() {
                if (this.filterQuery || this.filterAuthor || this.filterMood || this.filterFrom || this.filterTo) {
                    this.clearFilters();
                    return;
                }
                if (this.currentTab === 'recycle') {
                    this.switchTab('memory');
                    return;
                }
                this.switchTab('memory');

            goToItem(item) {
