<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#FFB7B2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/512x512/1f3f0.png">
    
    <title>橙心回忆 - 我们的琉璃城堡</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
    <style>
        :root {
            --paper-bg: #FFF0F5; --card-bg: rgba(255, 255, 255, 0.9); --ink-main: #7B5C6A; --ink-light: #A8959F;
            --accent-main: #F4C2C2; --accent-bronze: #E6A8D7; --accent-red: #FFB6C1; 
            --glass-bg: rgba(255, 255, 255, 0.6); --border-fine: rgba(255, 182, 193, 0.4);
            --story-bg: linear-gradient(180deg, rgba(255,255,255,0.95) 0%, rgba(255,240,245,0.7) 100%);
            --color-xiaocheng: #82CAFF; --color-xiaoxin: #FFB7B2;   
            --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
            --font-serif: "Noto Serif SC", "Songti SC", "STSong", serif;
            
            /* 午夜秘境专属色 */
            --midnight-red: #8B0000;
            --midnight-dark: #1A0505;
        }

        [data-theme="dark"] {
            --paper-bg: #2C1A3D; --card-bg: rgba(60, 35, 80, 0.85); --ink-main: #F5E6E8; --ink-light: #B8A5B6;
            --accent-main: #DDA0DD; --accent-bronze: #B3CEE5; --accent-red: #FFB7B2; 
            --glass-bg: rgba(44, 26, 61, 0.7); --border-fine: rgba(221, 160, 221, 0.2);
            --story-bg: linear-gradient(180deg, rgba(60,35,80,0.9) 0%, rgba(44,26,61,0.8) 100%);
            --color-xiaocheng: #AEC6CF; --color-xiaoxin: #F8C8DC;   
        }

        body { font-family: var(--font-ui); background: linear-gradient(-45deg, #FFE4E1, #FFF0F5, #E6E6FA, #F0F8FF); background-size: 400% 400%; animation: silkGradient 15s ease infinite; margin: 0; padding: 0; color: var(--ink-main); -webkit-font-smoothing: antialiased; }
        [data-theme="dark"] body { background: linear-gradient(-45deg, #2C1A3D, #1A1A2E, #3B1C32, #16213E); background-size: 400% 400%; }
        @keyframes silkGradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        body, .card, .control-panel, input, textarea, button, .story-seg { transition: background-color 0.5s ease, color 0.5s ease, border-color 0.5s ease, box-shadow 0.5s ease; }
        #app { max-width: 900px; margin: 0 auto; padding: 40px 20px; position: relative; box-sizing: border-box;}
        
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--paper-bg); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .login-box { text-align: center; background: var(--glass-bg); padding: 50px; border-radius: 30px; box-shadow: 0 15px 35px rgba(255, 182, 193, 0.2); border: 1px solid var(--border-fine); backdrop-filter: blur(20px);}
        [data-theme="dark"] .login-box { box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4); }
        .login-box h1 { font-family: var(--font-serif); font-size: 32px; letter-spacing: 4px; margin-bottom: 30px; color: var(--ink-main); }
        .login-box input { width: 220px; text-align: center; letter-spacing: 2px; padding: 15px; border-radius: 20px; border: 2px solid var(--border-fine); background: rgba(255,255,255,0.5); color: var(--ink-main); outline: none; font-size: 16px;}
        .login-box input:focus { border-color: var(--accent-bronze); background: var(--card-bg);}

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .nav-tabs { display: flex; gap: 20px; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 5px; -ms-overflow-style: none; scrollbar-width: none; }
        .nav-tabs::-webkit-scrollbar { display: none; }
        .tab { font-family: var(--font-serif); font-size: 18px; cursor: pointer; padding-bottom: 5px; color: var(--ink-light); white-space: nowrap; position: relative;}
        .tab::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 0; height: 3px; background: linear-gradient(90deg, var(--color-xiaoxin), var(--color-xiaocheng)); transition: 0.3s; border-radius: 3px;}
        .tab.active { color: var(--ink-main); font-weight: bold; }
        .tab.active::after { width: 100%; }
        
        .header-actions { display: flex; gap: 15px; align-items: center; }
        .theme-toggle { font-size: 22px; cursor: pointer; background: transparent; border: none; color: var(--ink-main); padding: 0; transition: transform 0.4s;}
        .theme-toggle:hover { transform: rotate(20deg); }
        .user-badge { font-family: var(--font-serif); font-size: 14px; color: var(--ink-main); background: linear-gradient(135deg, rgba(255,255,255,0.8), rgba(255,255,255,0.4)); border: 1px solid var(--border-fine); padding: 6px 16px; border-radius: 30px; cursor: pointer; display: flex; align-items: center; gap: 5px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); backdrop-filter: blur(10px);}
        [data-theme="dark"] .user-badge { background: rgba(0,0,0,0.2); }

        .control-panel { background: var(--glass-bg); backdrop-filter: blur(25px); border-radius: 24px; padding: 30px; margin-bottom: 50px; border: 1px solid var(--border-fine); display: flex; flex-direction: column; gap: 15px; box-shadow: 0 10px 40px rgba(255, 182, 193, 0.15); }
        [data-theme="dark"] .control-panel { box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3); }
        
        .file-upload-wrapper { position: relative; flex: none; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.5); border: 1px dashed var(--accent-bronze); border-radius: 12px; padding: 0 15px; height: 50px; cursor: pointer; transition: 0.3s;}
        [data-theme="dark"] .file-upload-wrapper { background: rgba(0,0,0,0.2); }
        .file-upload-wrapper:hover { background: var(--card-bg); }
        .file-upload-wrapper input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .file-upload-text { font-family: var(--font-ui); color: var(--accent-bronze); font-size: 14px; font-weight: bold;}

        .input-group { display: flex; gap: 15px; align-items: center; position: relative; z-index: 1;}
        .title-input, .note-input { padding: 14px; border-radius: 12px; border: 1px solid var(--border-fine); background: rgba(255,255,255,0.5); color: var(--ink-main); transition: 0.3s;}
        .title-input { font-family: var(--font-serif); font-size: 18px; width: 100%; box-sizing: border-box; text-align: center; letter-spacing: 2px; }
        .note-input { font-family: var(--font-ui); flex: 1; }
        [data-theme="dark"] .title-input, .note-input, input[type="date"] { background: rgba(0,0,0,0.2); }
        input[type="date"] { padding: 12px; border-radius: 12px; border: 1px solid var(--border-fine); background: rgba(255,255,255,0.5); color: var(--ink-main); font-family: var(--font-ui); }
        input:focus, textarea:focus { border-color: var(--accent-bronze); background: var(--card-bg); outline: none; box-shadow: 0 0 0 4px rgba(230, 168, 215, 0.2);}
        button.action-submit { background: linear-gradient(135deg, var(--color-xiaoxin), var(--color-xiaocheng)); color: #FFFFFF; border: none; padding: 14px 28px; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 15px; letter-spacing: 1px; box-shadow: 0 6px 20px rgba(255, 182, 193, 0.4); transition: 0.3s; }
        button.action-submit:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(255, 182, 193, 0.6); }
        button:disabled { opacity: 0.6; cursor: not-allowed; transform: none !important; }
        
        button.action-midnight { background: linear-gradient(135deg, #1A0505, #8B0000); box-shadow: 0 6px 20px rgba(139, 0, 0, 0.4); color: white;}
        button.action-midnight:hover { box-shadow: 0 10px 25px rgba(139, 0, 0, 0.6); }

        /* ====== 星月塔罗 & 秘戏大冒险 ====== */
        .tarot-board { display: flex; flex-direction: column; align-items: center; padding: 20px 0 50px 0; transition: 0.5s;}
        .tarot-title { font-family: var(--font-serif); font-size: 24px; color: var(--ink-main); margin-bottom: 10px; letter-spacing: 3px; font-weight: bold; transition: 0.5s;}
        .tarot-subtitle { font-family: var(--font-ui); font-size: 14px; color: var(--ink-light); margin-bottom: 30px; transition: 0.5s;}
        
        .mode-switch-wrap { margin-bottom: 30px; }
        .mode-switch { font-family: var(--font-serif); font-size: 13px; font-weight: bold; padding: 8px 16px; border-radius: 20px; cursor: pointer; transition: 0.3s; border: 1px solid var(--border-fine); background: var(--glass-bg); color: var(--ink-main);}
        .mode-switch.is-midnight { background: #2A0808; color: #FFD700; border-color: #8B0000; box-shadow: 0 0 15px rgba(139,0,0,0.5);}
        
        .tarot-card-container { width: 280px; height: 420px; perspective: 1000px; cursor: pointer; margin-bottom: 30px;}
        .game-decks-wrap { display: flex; gap: 30px; justify-content: center; flex-wrap: wrap; width: 100%;}
        .tarot-inner { width: 100%; height: 100%; transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform-style: preserve-3d; position: relative;}
        .tarot-card-container.flipped .tarot-inner { transform: rotateY(180deg); }
        .tarot-card-container.shaking { animation: shake 0.5s infinite; }
        @keyframes shake { 0% { transform: translate(1px, 1px) rotate(0deg); } 20% { transform: translate(-3px, 0px) rotate(1deg); } 40% { transform: translate(1px, -1px) rotate(1deg); } 60% { transform: translate(-3px, 1px) rotate(0deg); } 80% { transform: translate(-1px, -1px) rotate(1deg); } 100% { transform: translate(1px, -2px) rotate(-1deg); } }
        
        .tarot-front, .tarot-back { width: 100%; height: 100%; position: absolute; backface-visibility: hidden; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.15); border: 2px solid var(--accent-bronze); transition: 0.5s;}
        .tarot-back { background: linear-gradient(135deg, #2C1A3D, #3B1C32); background-size: 200% 200%; animation: silkGradient 5s ease infinite; display: flex; align-items: center; justify-content: center;}
        .tarot-back::after { content: '✨ 命运之轮 ✨'; color: rgba(255,255,255,0.7); font-family: var(--font-serif); font-size: 20px; letter-spacing: 3px; writing-mode: vertical-rl; transition: 0.5s;}
        .midnight-mode .tarot-back { background: linear-gradient(135deg, #1A0505, #4A0E17); border-color: #8B0000; box-shadow: 0 0 20px rgba(139,0,0,0.4);}
        .midnight-mode .tarot-back::after { content: '⛓️ 午夜秘境 ⛓️'; color: rgba(255, 69, 0, 0.7); }

        .game-deck-truth .tarot-back { background: linear-gradient(135deg, #3B1C32, #8B0045); border-color: #FF1493;}
        .game-deck-truth .tarot-back::after { content: '👄 抽一张真心话'; color: #FFB6C1; }
        .game-deck-dare .tarot-back { background: linear-gradient(135deg, #1A0505, #4A0E17); border-color: #8B0000;}
        .game-deck-dare .tarot-back::after { content: '⛓️ 抽一张大冒险'; color: #FF4500; }
        
        .tarot-front { background: var(--card-bg); transform: rotateY(180deg); padding: 30px 20px; display: flex; flex-direction: column; align-items: center; box-sizing: border-box; overflow-y: auto;}
        .midnight-mode .tarot-front { background: #1A1A1A; border-color: #8B0000;}
        .tarot-front::-webkit-scrollbar { width: 4px; }
        .tarot-front::-webkit-scrollbar-thumb { background: var(--border-fine); border-radius: 4px; }
        .midnight-mode .tarot-front::-webkit-scrollbar-thumb { background: #8B0000; }
        
        .tarot-emoji { font-size: 65px; margin-bottom: 15px; filter: drop-shadow(0 4px 10px rgba(255,182,193,0.5));}
        .midnight-mode .tarot-emoji { filter: drop-shadow(0 4px 15px rgba(255,0,0,0.4)); }
        .tarot-name { font-family: var(--font-serif); font-size: 22px; font-weight: bold; color: var(--accent-bronze); margin-bottom: 15px; border-bottom: 1px solid var(--border-fine); padding-bottom: 15px; width: 100%; text-align: center; transition: 0.5s;}
        .midnight-mode .tarot-name { color: #FF4500; border-bottom-color: #8B0000; }
        .tarot-text-box { text-align: left; width: 100%; font-family: var(--font-ui); font-size: 15px; color: var(--ink-main); line-height: 1.7; transition: 0.5s;}
        .midnight-mode .tarot-text-box { color: #E0E0E0; }
        .tarot-keyword { color: var(--accent-bronze); font-weight: bold; font-family: var(--font-serif); transition: 0.5s;}
        .midnight-mode .tarot-keyword { color: #FF4500; }
        .tarot-action { background: rgba(230, 168, 215, 0.15); padding: 12px 15px; border-radius: 12px; margin-top: 20px; font-weight: bold; color: var(--ink-main); border: 1px dashed var(--accent-bronze); transition: 0.5s;}
        .midnight-mode .tarot-action { background: rgba(139, 0, 0, 0.2); border-color: #8B0000; color: #FFB6C1; }
        .game-content { font-size: 18px; line-height: 2; text-align: center; margin-top: 20px; font-family: var(--font-serif);}

        /* ====== 🔞 欲海专属样式 ====== */
        .lust-board { padding: 40px 15px 50px; background: #0a0000; color: #ffb3b3; border-radius: 24px; box-shadow: inset 0 0 50px rgba(255,0,0,0.05); border: 1px solid #330000; min-height: 60vh; animation: lustFadeIn 0.8s ease;}
        @keyframes lustFadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .lust-title { text-align: center; color: #ff3333; font-family: var(--font-serif); font-size: 28px; letter-spacing: 4px; margin: 0 0 10px 0; text-shadow: 0 0 10px rgba(255,0,0,0.5);}
        .lust-subtitle { text-align: center; color: #994444; font-size: 14px; margin-bottom: 35px; letter-spacing: 1px;}

        .lust-nav { display: flex; justify-content: center; gap: 15px; margin-bottom: 40px; border-bottom: 1px solid #330000; padding-bottom: 15px; flex-wrap: wrap;}
        .lust-tab { padding: 10px 18px; cursor: pointer; color: #884444; font-weight: bold; transition: 0.3s; border-radius: 12px; border: 1px solid transparent; font-family: var(--font-serif); font-size: 15px;}
        .lust-tab.active { background: rgba(255,0,0,0.1); color: #ff4444; border-color: #8B0000; box-shadow: 0 0 15px rgba(255,0,0,0.2);}

        .lust-section { display: flex; flex-direction: column; align-items: center; width: 100%;}
        
        .dice-container { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 40px; width: 100%; flex-wrap: wrap;}
        .lust-dice { width: 130px; height: 130px; background: linear-gradient(135deg, #1a0000, #4a0000); border: 2px solid #8B0000; border-radius: 24px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; color: #ff6666; text-align: center; padding: 15px; box-sizing: border-box; box-shadow: 0 15px 30px rgba(0,0,0,0.6), inset 0 0 15px rgba(255,0,0,0.2); font-family: var(--font-serif); transition: 0.1s;}
        .lust-dice.rolling { animation: diceShake 0.2s infinite; color: transparent; text-shadow: 0 0 8px rgba(255,0,0,0.8); }
        .dice-cross { font-size: 30px; color: #551111; font-weight: bold;}

        .lust-btn { background: linear-gradient(135deg, #8B0000, #ff1a1a); color: white; border: none; padding: 16px 45px; font-size: 16px; font-weight: bold; letter-spacing: 2px; border-radius: 30px; cursor: pointer; box-shadow: 0 8px 25px rgba(255,0,0,0.4); transition: 0.3s; font-family: var(--font-serif);}
        .lust-btn:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 12px 30px rgba(255,0,0,0.6); }

        .gacha-box { width: 280px; height: 180px; background: linear-gradient(135deg, #2a0000, #0d0000); border: 2px dashed #8B0000; border-radius: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; color: #ff6666; font-size: 16px; font-weight: bold; transition: 0.3s; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); font-family: var(--font-serif); letter-spacing: 1px;}
        .gacha-box:hover { background: #3a0000; border-color: #ff0000; box-shadow: 0 10px 40px rgba(255,0,0,0.3);}
        .gacha-icon { font-size: 55px; margin-bottom: 15px; filter: drop-shadow(0 0 10px rgba(255,0,0,0.5));}
        .gacha-box.shaking { animation: diceShake 0.3s infinite; }

        .lust-result-card { background: rgba(20,0,0,0.85); border: 1px solid #8B0000; border-radius: 20px; padding: 30px; max-width: 450px; width: 100%; text-align: center; box-shadow: 0 15px 40px rgba(255,0,0,0.15); animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); backdrop-filter: blur(10px); box-sizing: border-box;}
        .lust-result-card h3 { color: #ff3333; font-size: 24px; margin: 0 0 12px 0; font-family: var(--font-serif); letter-spacing: 1px;}
        .lust-stars { color: #ffaa00; font-size: 20px; margin-bottom: 20px; letter-spacing: 3px; text-shadow: 0 0 10px rgba(255,170,0,0.4);}
        .lust-result-card p { color: #ffcccc; font-size: 16px; line-height: 2; margin: 0; text-align: justify; font-family: var(--font-ui);}

        .task-box { border-color: #6600cc; color: #aa66ff; background: linear-gradient(135deg, #1a0033, #0d001a);}
        .task-box:hover { background: #26004d; border-color: #9933ff; box-shadow: 0 10px 40px rgba(102,0,204,0.3);}
        .task-box .gacha-icon { filter: hue-rotate(250deg) drop-shadow(0 0 10px rgba(102,0,204,0.5)); }
        .task-result { border-color: #6600cc; box-shadow: 0 15px 40px rgba(102,0,204,0.15); }
        .task-result p { color: #ddbbff; text-align: justify; font-size: 17px;}

        @keyframes popIn { 0% { opacity: 0; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1); } }

        /* 画廊与星图等原有样式 */
        .stats-dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 20px;}
        .stats-card { background: var(--card-bg); border-radius: 24px; border: 1px solid var(--border-fine); padding: 30px; box-shadow: 0 10px 30px rgba(255, 182, 193, 0.15); backdrop-filter: blur(10px); text-align: center;}
        [data-theme="dark"] .stats-card { box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        .stats-title { font-family: var(--font-serif); font-size: 20px; color: var(--ink-main); margin-bottom: 20px; font-weight: bold;}
        .chart-container { position: relative; height: 250px; width: 100%; display: flex; justify-content: center; align-items: center;}

        .timeline-group { margin-bottom: 60px; }
        .timeline-header { font-family: var(--font-serif); font-size: 20px; color: var(--ink-main); margin-bottom: 25px; position: sticky; top: 0; z-index: 10; background: var(--glass-bg); backdrop-filter: blur(15px); padding: 15px 20px; border-radius: 20px; border: 1px solid var(--border-fine); display: inline-block; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        .grid { display: grid; gap: 30px; }
        .grid-memory { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
        .grid-list { grid-template-columns: 1fr; }

        .card { background: var(--card-bg); border-radius: 24px; border: 1px solid var(--border-fine); position: relative; overflow: hidden; box-shadow: 0 10px 30px rgba(255, 182, 193, 0.15); backdrop-filter: blur(10px); }
        [data-theme="dark"] .card { box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        .card:hover { transform: translateY(-6px); box-shadow: 0 15px 40px rgba(255, 182, 193, 0.3); }
        .card img { width: 100%; height: 280px; object-fit: cover; border-bottom: 1px solid var(--border-fine); display: block; cursor: zoom-in;}
        .card-info { padding: 30px; position: relative; }

        .album-cover { position: relative; cursor: pointer; background: #fff;}
        .album-cover::before, .album-cover::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--card-bg); border: 1px solid var(--border-fine); border-radius: 24px 24px 0 0; z-index: -1; transition: 0.3s;}
        .album-cover::before { transform: rotate(-3deg) scale(0.98); }
        .album-cover::after { transform: rotate(3deg) scale(0.98); }
        .album-badge { position: absolute; bottom: 15px; right: 15px; background: rgba(255,255,255,0.85); backdrop-filter: blur(5px); padding: 6px 12px; border-radius: 20px; font-size: 12px; color: var(--ink-main); font-weight: bold; border: 1px solid var(--border-fine); pointer-events: none;}
        
        .album-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--paper-bg); z-index: 1000; display: flex; flex-direction: column; overflow-y: auto; backdrop-filter: blur(20px); }
        .album-modal-header { position: sticky; top: 0; padding: 20px 30px; background: var(--glass-bg); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border-fine); display: flex; justify-content: space-between; align-items: center; z-index: 10;}
        .album-modal-header h2 { margin: 0; font-family: var(--font-serif); font-size: 24px; color: var(--ink-main); }
        .close-btn { background: var(--card-bg); border: 1px solid var(--border-fine); color: var(--ink-main); width: 40px; height: 40px; border-radius: 50%; font-size: 20px; cursor: pointer; }
        .album-modal-body { padding: 30px; max-width: 1200px; margin: 0 auto; width: 100%; box-sizing: border-box;}
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .gallery-item { position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 1; border: 1px solid var(--border-fine); background: var(--card-bg);}
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; transition: 0.4s; }
        .gallery-item:hover img { transform: scale(1.05); }
        .delete-img-btn { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; background: rgba(255,255,255,0.9); border-radius: 50%; border: none; color: #FF9AA2; cursor: pointer; opacity: 0; transition: 0.3s; font-size: 16px;}
        .gallery-item:hover .delete-img-btn { opacity: 1; }
        .append-area { margin-top: 40px; padding: 30px; text-align: center; border: 2px dashed var(--accent-bronze); border-radius: 20px; background: rgba(255,255,255,0.3); }

        .author-stamp { position: absolute; bottom: 15px; right: 25px; font-family: var(--font-serif); font-size: 12px; color: var(--ink-light); }
        .date { font-size: 13px; color: var(--ink-light); margin-bottom: 15px; display: block; text-align: center; letter-spacing: 1px;}
        
        .story-title { font-family: var(--font-serif); font-size: 24px; font-weight: bold; text-align: center; margin-bottom: 25px; letter-spacing: 2px; color: var(--ink-main);}
        .card-story { background: var(--story-bg); border: 1px solid var(--border-fine); }
        .story-content { font-family: var(--font-serif); font-size: 16px; line-height: 2.2; text-align: justify; }
        .text-xiaocheng { color: var(--color-xiaocheng); }
        .text-xiaoxin { color: var(--color-xiaoxin); }
        .story-seg { border-radius: 8px; padding: 4px 10px; margin-bottom: 10px; white-space: pre-wrap; word-wrap: break-word; display: block; transition: 0.3s;}
        .story-seg:hover { background: rgba(255, 182, 193, 0.1); }

        .edit-title, .seg-textarea, .edit-area { width: 100%; box-sizing: border-box; font-family: var(--font-serif); padding: 15px; border: 1px solid var(--border-fine); background: rgba(255,255,255,0.5); color: var(--ink-main); border-radius: 12px; outline: none; }
        .edit-seg-row { display: flex; gap: 12px; margin-bottom: 15px; align-items: flex-start; }
        .seg-author-badge { font-family: var(--font-serif); font-size: 12px; padding: 6px 10px; border-radius: 8px; color: white; white-space: nowrap; margin-top: 5px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);}
        .bg-xiaocheng { background: var(--color-xiaocheng); }
        .bg-xiaoxin { background: var(--color-xiaoxin); }
        .add-seg-btn { width: 100%; background: rgba(255, 255, 255, 0.3); border: 2px dashed var(--accent-bronze); color: var(--ink-main); padding: 12px; margin-top: 10px; border-radius: 12px; cursor: pointer; transition: 0.3s;}

        .actions { position: absolute; top: 15px; right: 15px; display: flex; gap: 10px; opacity: 0; z-index: 20;}
        .card:hover .actions { opacity: 1; }
        .action-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--glass-bg); border: 1px solid var(--border-fine); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; color: var(--ink-light); backdrop-filter: blur(10px); transition: 0.3s;}
        .action-btn:hover { color: white; background: var(--accent-bronze); border-color: var(--accent-bronze); transform: scale(1.1);}

        .wish-item { display: flex; align-items: center; gap: 15px; background: rgba(255,255,255,0.4); padding: 10px 15px; border-radius: 12px; border: 1px solid var(--border-fine);}
        .wish-checkbox { width: 22px; height: 22px; accent-color: var(--accent-bronze); cursor: pointer;}
        .wish-completed { text-decoration: line-through; color: var(--ink-light); opacity: 0.7;}
        .note { font-family: var(--font-serif); font-size: 16px; line-height: 2.2; color: var(--ink-main); white-space: pre-wrap; }
        
        @media (max-width: 768px) {
            #app { padding: 20px 15px; }
            .header { margin-bottom: 25px; }
            .nav-tabs { gap: 15px; }
            .control-panel { padding: 20px; margin-bottom: 30px;}
            .input-group { flex-direction: column; align-items: stretch; gap: 12px; }
            .file-upload-wrapper { width: 100%; box-sizing: border-box; }
            .actions { opacity: 1; }
            .gallery-grid { grid-template-columns: repeat(2, 1fr); }
            .stats-dashboard { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div id="app">
    <div v-if="!currentUser" class="login-overlay">
        <div class="login-box">
            <h1>开启梦境 🎀</h1>
            <input type="password" v-model="loginCode" @keyup.enter="login" placeholder="输入魔法暗号...">
        </div>
    </div>

    <template v-else>
        <div v-if="currentAlbum" class="album-modal">
            <div class="album-modal-header">
                <h2>《 {{ currentAlbum.title || '无名相册' }} 》</h2>
                <button class="close-btn" @click="closeAlbum">×</button>
            </div>
            <div class="album-modal-body">
                <div v-if="currentAlbum.note" class="album-desc" style="text-align: center; margin-bottom:30px;">{{ currentAlbum.note }}</div>
                <div class="gallery-grid">
                    <div v-for="img in currentAlbum.images" :key="img.public_id" class="gallery-item">
                        <img :src="img.url" @click="viewFull(img.url)">
                        <button class="delete-img-btn" @click="deleteImageFromAlbum(currentAlbum._id, img._id)">×</button>
                    </div>
                </div>
                <div class="append-area">
                    <div class="file-upload-wrapper" style="max-width: 300px; margin: 0 auto; margin-bottom: 15px;">
                        <input type="file" @change="handleAppendFiles" accept="image/*" multiple>
                        <span class="file-upload-text">{{ appendFiles.length > 0 ? `已选 ${appendFiles.length} 张图片 🌸` : '+ 挑选新照片入册' }}</span>
                    </div>
                    <button class="action-submit" @click="submitAppendPhotos" v-if="appendFiles.length > 0" :disabled="isUploading">
                        {{ isUploading ? '✨ 传送中...' : '确认追加照片' }}
                    </button>
                </div>
            </div>
        </div>

        <div class="header">
            <div class="nav-tabs">
                <div :class="['tab', {active: currentTab === 'memory'}]" @click="switchTab('memory')">纪事</div>
                <div :class="['tab', {active: currentTab === 'album'}]" @click="switchTab('album')">相册</div>
                <div :class="['tab', {active: currentTab === 'diary'}]" @click="switchTab('diary')">随笔</div>
                <div :class="['tab', {active: currentTab === 'wish'}]" @click="switchTab('wish')">心愿</div>
                <div :class="['tab', {active: currentTab === 'story'}]" @click="switchTab('story')">浮梦</div>
                <div :class="['tab', {active: currentTab === 'tarot'}]" @click="switchTab('tarot')">星占 🔮</div>
                <div :class="['tab', {active: currentTab === 'game'}]" @click="switchTab('game')">秘戏 🎲</div>
                <div :class="['tab', {active: currentTab === 'lust'}]" @click="switchTab('lust')">欲海 🔞</div>
                <div :class="['tab', {active: currentTab === 'stats'}]" @click="switchTab('stats')">星图 🌟</div>
            </div>
            <div class="header-actions">
                <button class="theme-toggle" @click="toggleTheme">{{ isDarkMode ? '🌙' : '✨' }}</button>
                <div class="user-badge" @click="logout">👑 {{ currentUser }}</div>
            </div>
        </div>

        <div v-if="currentTab === 'lust'" class="lust-board">
            <div class="lust-header">
                <h2 class="lust-title">🔞 极乐欲海</h2>
                <p class="lust-subtitle">抛弃理智，释放野兽的本能。今晚，没有底线。</p>
            </div>

            <div class="lust-nav">
                <div :class="['lust-tab', {active: lustSubTab === 'dice'}]" @click="lustSubTab = 'dice'">🎲 惹火骰子</div>
                <div :class="['lust-tab', {active: lustSubTab === 'gacha'}]" @click="lustSubTab = 'gacha'">🎁 体位盲盒</div>
                <div :class="['lust-tab', {active: lustSubTab === 'task'}]" @click="lustSubTab = 'task'">⛓️ 绝对指令</div>
            </div>

            <div v-if="lustSubTab === 'dice'" class="lust-section">
                <div class="dice-container">
                    <div :class="['lust-dice', {rolling: isRollingDice}]">{{ dice1 }}</div>
                    <div class="dice-cross">×</div>
                    <div :class="['lust-dice', {rolling: isRollingDice}]">{{ dice2 }}</div>
                </div>
                <button class="lust-btn" @click="rollLustDice" :disabled="isRollingDice">
                    {{ isRollingDice ? '欲火翻滚中...' : '掷出今晚的欲望' }}
                </button>
            </div>

            <div v-if="lustSubTab === 'gacha'" class="lust-section">
                <div v-if="!currentGacha" :class="['gacha-box', {shaking: isDrawingGacha}]" @click="drawGacha">
                    <div class="gacha-icon">📦</div>
                    <div>点击抽取今晚的狂欢体位</div>
                </div>
                <div v-else class="lust-result-card">
                    <h3>{{ currentGacha.name }}</h3>
                    <div class="lust-stars">{{ currentGacha.stars }}</div>
                    <p>{{ currentGacha.desc }}</p>
                </div>
                
                <button v-if="currentGacha" class="lust-btn" style="margin-top: 25px;" @click="saveLustReading">💌 记录这场疯狂</button>
                <button v-if="currentGacha" class="action-submit" style="margin-top: 15px; background: transparent; color: #ff3333; border: 1px solid #ff3333; box-shadow: none;" @click="resetLustGacha">太累了？换一个</button>
            </div>

            <div v-if="lustSubTab === 'task'" class="lust-section">
                <div v-if="!currentTask" :class="['gacha-box task-box', {shaking: isDrawingTask}]" @click="drawTask">
                    <div class="gacha-icon">📜</div>
                    <div>揭开今晚的绝对指令</div>
                </div>
                <div v-else class="lust-result-card task-result">
                    <p>{{ currentTask }}</p>
                </div>

                <button v-if="currentTask" class="lust-btn" style="background: linear-gradient(135deg, #6600cc, #aa00ff); box-shadow: 0 8px 25px rgba(102,0,204,0.4); margin-top: 25px;" @click="saveLustReading">💌 记录这次调教</button>
                <button v-if="currentTask" class="action-submit" style="margin-top: 15px; background: transparent; color: #aa66ff; border: 1px solid #aa66ff; box-shadow: none;" @click="resetLustTask">不敢玩？重新抽</button>
            </div>
        </div>

        <div v-if="currentTab === 'game'" class="tarot-board midnight-mode">
            <div class="tarot-title" style="color: #FF4500;">午夜秘戏 (18+)</div>
            <div class="tarot-subtitle" style="color: #E0E0E0;">剥下伪装，直面最深处的渴望与疯狂。你要选哪一个？</div>
            
            <div v-if="!drawnGameCard" class="game-decks-wrap">
                <div :class="['tarot-card-container game-deck-truth', { 'shaking': isDrawingGame === 'truth' }]" @click="drawGameCard('truth')">
                    <div class="tarot-inner"><div class="tarot-back"></div></div>
                </div>
                <div :class="['tarot-card-container game-deck-dare', { 'shaking': isDrawingGame === 'dare' }]" @click="drawGameCard('dare')">
                    <div class="tarot-inner"><div class="tarot-back"></div></div>
                </div>
            </div>

            <div v-else class="tarot-card-container flipped">
                <div class="tarot-inner">
                    <div class="tarot-front" :style="{ borderColor: drawnGameCard.type === 'truth' ? '#FF1493' : '#8B0000' }">
                        <div class="tarot-emoji">{{ drawnGameCard.type === 'truth' ? '👄' : '⛓️' }}</div>
                        <div class="tarot-name" :style="{ color: drawnGameCard.type === 'truth' ? '#FFB6C1' : '#FF4500', borderBottomColor: drawnGameCard.type === 'truth' ? '#FF1493' : '#8B0000' }">
                            {{ drawnGameCard.type === 'truth' ? '真心话' : '大冒险' }}
                        </div>
                        <div class="game-content" :style="{ color: drawnGameCard.type === 'truth' ? '#FFC0CB' : '#E0E0E0' }">
                            {{ drawnGameCard.text }}
                        </div>
                    </div>
                </div>
            </div>

            <button v-if="drawnGameCard" class="action-submit action-midnight" style="margin-top: 20px;" @click="saveGameReading">💌 记录这次刺激的挑战</button>
            <button v-if="drawnGameCard" class="action-submit" style="margin-top: 15px; background: transparent; color: #FF4500; border: 1px solid #FF4500; box-shadow: none;" @click="resetGameCard">退缩了？换一张</button>
        </div>

        <div v-if="currentTab === 'tarot'" :class="['tarot-board', {'midnight-mode': isMidnightMode}]">
            <div class="tarot-title" :style="{ color: isMidnightMode ? '#FF4500' : 'var(--ink-main)' }">
                {{ isMidnightMode ? '午夜秘境 (18+)' : '命运的指引' }}
            </div>
            <div class="tarot-subtitle" :style="{ color: isMidnightMode ? '#E0E0E0' : 'var(--ink-light)' }">
                {{ isMidnightMode ? '嘘，闭上眼睛，翻开这充满张力的规则卡牌...' : '在心里默念你们的名字，然后翻开魔法牌。' }}
            </div>
            <div class="mode-switch-wrap">
                <button :class="['mode-switch', {'is-midnight': isMidnightMode}]" @click="toggleMidnightMode">
                    {{ isMidnightMode ? '🌸 切换回白昼模式' : '💋 开启午夜秘境 (18+)' }}
                </button>
            </div>
            <div :class="['tarot-card-container', { 'flipped': drawnCard !== null, 'shaking': isDrawing }]" @click="drawTarotCard">
                <div class="tarot-inner">
                    <div class="tarot-back"></div>
                    <div class="tarot-front" v-if="drawnCard">
                        <div class="tarot-emoji">{{ drawnCard.emoji }}</div>
                        <div class="tarot-name">{{ drawnCard.name }}</div>
                        <div class="tarot-text-box">
                            <p><span class="tarot-keyword">✦ 关键词：</span>{{ drawnCard.keywords }}</p>
                            <p style="margin-top: 8px;">{{ drawnCard.meaning }}</p>
                            <div class="tarot-action">
                                {{ isMidnightMode ? '⛓️ 午夜指令：' : '💡 今日宜：' }}{{ drawnCard.action }}
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <button v-if="drawnCard" :class="['action-submit', {'action-midnight': isMidnightMode}]" style="margin-top: 20px;" @click="saveTarotReading">💌 将指引刻入随笔</button>
            <button v-if="drawnCard" class="action-submit" :style="{ marginTop: '15px', background: 'transparent', color: isMidnightMode ? '#FF4500' : 'var(--accent-bronze)', border: isMidnightMode ? '1px solid #FF4500' : '1px solid var(--accent-bronze)', boxShadow: 'none' }" @click="resetTarot">再次转动命运之轮</button>
            <button v-if="!drawnCard" :class="['action-submit', {'action-midnight': isMidnightMode}]" @click="drawTarotCard" :disabled="isDrawing">{{ isDrawing ? '命运之轮转动中...' : '揭开命运的卡牌' }}</button>
        </div>

        <div v-if="currentTab === 'stats'" class="stats-dashboard">
            <div class="stats-card">
                <div class="stats-title">📝 梦境字数贡献度</div>
                <div class="chart-container"><canvas id="storyChart"></canvas></div>
            </div>
            <div class="stats-card">
                <div class="stats-title">👣 时空魔法轨迹</div>
                <div class="chart-container"><canvas id="activityChart"></canvas></div>
            </div>
        </div>

        <div class="control-panel" v-if="currentTab !== 'stats' && currentTab !== 'tarot' && currentTab !== 'game' && currentTab !== 'lust'">
            <input v-if="currentTab === 'story' || currentTab === 'album'" type="text" v-model="newTitle" class="title-input" :placeholder="currentTab === 'album' ? '《 相册名称 》 (如：2026跨年之旅)' : '《 篇章名 》'">
            <div class="input-group">
                <div class="file-upload-wrapper" v-if="currentTab === 'memory' || currentTab === 'wish' || currentTab === 'story' || currentTab === 'album'">
                    <input type="file" @change="handleFiles" accept="image/*" :multiple="currentTab === 'album'">
                    <span class="file-upload-text">{{ selectedFiles.length > 0 ? `已选 ${selectedFiles.length} 张 🌸` : (currentTab==='album' ? '📸 批量选择照片' : '📸 唤醒记忆') }}</span>
                </div>
                <input type="date" v-model="newDate">
                <input type="text" class="note-input" v-model="newNote" :placeholder="placeholderText" @keyup.enter="uploadItem">
                <button class="action-submit" @click="uploadItem" :disabled="isUploading">{{ isUploading ? '✨ 施展魔法中...' : btnText }}</button>
            </div>
        </div>

        <div v-if="currentTab !== 'stats' && currentTab !== 'tarot' && currentTab !== 'game' && currentTab !== 'lust'" v-for="(itemsInGroup, monthYear) in groupedItems" :key="monthYear" class="timeline-group">
            <div class="timeline-header">🌸 {{ monthYear }}</div>
            <div :class="['grid', (currentTab === 'memory' || currentTab === 'album') ? 'grid-memory' : 'grid-list']">
                <div v-for="item in itemsInGroup" :key="item._id" :class="['card', {'card-story': currentTab === 'story'}]">
                    
                    <div class="actions">
                        <button v-if="currentTab !== 'album'" class="action-btn" @click="startEdit(item)">✎</button>
                        <button class="action-btn btn-delete" @click="deleteItem(item._id)">×</button>
                    </div>

                    <template v-if="currentTab === 'album'">
                        <div class="album-cover" @click="openAlbum(item)">
                            <img :src="item.images && item.images.length > 0 ? item.images[0].url : 'data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'100\' height=\'100\'><rect width=\'100\' height=\'100\' fill=\'%23F4C2C2\'/></svg>'">
                            <div class="album-badge">共 {{ item.images ? item.images.length : 0 }} 张相片</div>
                        </div>
                    </template>
                    <template v-else-if="item.url || (item.images && item.images.length > 0)">
                        <img v-if="item.images && item.images.length > 0" :src="item.images[0].url" @click="viewFull(item.images[0].url)">
                        <img v-else :src="item.url" @click="viewFull(item.url)">
                    </template>

                    <div class="card-info">
                        <span class="date">✦ {{ formatDate(item.date) }} ✦</span>
                        <div v-if="editingId !== item._id">
                            <div v-if="currentTab === 'album'" style="text-align: center; font-family: var(--font-serif); font-size: 20px; font-weight: bold; color: var(--ink-main); cursor:pointer;" @click="openAlbum(item)">《 {{ item.title || '无名相册' }} 》</div>
                            <div v-else-if="currentTab === 'story'" class="story-title">《 {{ item.title }} 》</div>
                            
                            <div v-if="currentTab === 'story'" class="story-content">
                                <p v-for="seg in item.segments" :key="seg.id" :class="['story-seg', seg.author === '小心' ? 'text-xiaoxin' : 'text-xiaocheng']">{{ seg.text }}</p>
                            </div>
                            <div v-else-if="currentTab === 'wish'" class="wish-item">
                                <input type="checkbox" class="wish-checkbox" :checked="item.completed" @change="toggleWish(item, $event)">
                                <span :class="['note', {'wish-completed': item.completed}]">{{ item.note }}</span>
                            </div>
                            <div v-else class="note">{{ item.note }}</div>
                        </div>
                        <div v-else>
                            <template v-if="currentTab === 'story'">
                                <input type="text" class="edit-title" v-model="editTitle" placeholder="篇章名">
                                <div v-for="(seg, index) in editSegments" :key="index" class="edit-seg-row">
                                    <span :class="['seg-author-badge', seg.author === '小心' ? 'bg-xiaoxin' : 'bg-xiaocheng']">{{ seg.author }}</span>
                                    <textarea class="seg-textarea" v-model="seg.text"></textarea>
                                    <button @click="editSegments.splice(index, 1)" class="action-btn" style="margin-top:10px;">×</button>
                                </div>
                                <button class="add-seg-btn" @click="addNewSegment">✨ 续写新的魔法段落</button>
                            </template>
                            <template v-else>
                                <textarea class="edit-area" v-model="editNote"></textarea>
                            </template>
                            <div class="edit-actions">
                                <button class="action-submit" @click="saveEdit(item._id)">保存魔法</button>
                                <button class="action-submit btn-cancel" @click="cancelEdit">取消</button>
                            </div>
                        </div>
                        <div class="author-stamp">
                            <span v-if="currentTab === 'story'">共创梦境</span>
                            <span v-else-if="currentTab === 'album'">建册：{{ item.author }}</span>
                            <span v-else>落笔：{{ item.author }}</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>
</div>

<script>
    const { createApp } = Vue;
    createApp({
        data() {
            return {
                currentUser: null, loginCode: '', currentTab: 'lust', 
                items: [], allItemsForStats: [],
                newTitle: '', newNote: '', newDate: '', selectedFiles: [], isUploading: false, 
                editingId: null, editTitle: '', editNote: '', editSegments: [],
                isDarkMode: false, currentAlbum: null, appendFiles: [],
                storyChartObj: null, activityChartObj: null,
                
                // 🔞 极乐欲海相关状态
                lustSubTab: 'dice', // dice, gacha, task
                isRollingDice: false, dice1: '动作', dice2: '部位',
                diceActions: ['用力揉捏 👐', '狂热舔舐 👅', '重重拍打 👋', '冰块摩擦 🧊', '隔衣挑逗 ✨', '狠狠咬住 🦷', '深吻舌吻 💋', '道具震动 🪄', '滴蜡热油 🕯️', '用力吸吮 💦', '掐住脖子 🛑', '粗口羞辱 🤬'],
                diceParts: ['阴蒂敏感带 🌸', '乳头胸部 🍒', '脖颈锁骨 🦢', '大腿内侧 腿', '耳垂耳后 👂', '蜜臀 🍑', '嘴唇 👄', '后庭穴口 🔞', '脚踝足部 🦶'],
                
                isDrawingGacha: false, currentGacha: null,
                gachaList: [

                    { name: '6. 恋人 (The Lovers)', emoji: '🔗', keywords: '甜蜜束缚、紧密贴合', meaning: '爱有时是一种想要将对方完全捆绑在身边的冲动。束缚不仅限制了行动，更将两人的气息彻底交融。', action: '使用领带、丝带或专用软绳，轻轻束缚被动方的双手，在无法反抗的状态下进行爱抚。' },
                    { name: '7. 战车 (The Chariot)', emoji: '⏳', keywords: '边缘控制、强行忍耐', meaning: '就像拉住狂奔的战马，极致的快感在于即将到达顶峰时的生生逼停。这是对耐力与欲望的极致玩弄。', action: '进行“边缘控制（Edging）”。在对方即将到达高潮时立即停止，反复 3 次后才允许释放。' },
                    { name: '8. 力量 (Strength)', emoji: '🦷', keywords: '轻微痛楚、印记烙刻', meaning: '微小的痛觉能让快感成倍放大，那是独属于你们俩的野性标记。', action: '在安全的前提下，通过轻咬、吸吮或轻拍（Spanking），在对方的隐秘部位留下属于你的红痕印记。' },
                    { name: '9. 隐士 (The Hermit)', emoji: '🪞', keywords: '窥视展示、视觉刺激', meaning: '在隐秘的结界里，打破平日里的端庄。看着镜子里的自己如何沉沦，是一种极具冲击力的视觉调教。', action: '面对一面大镜子进行互动（或打开手机前置摄像头）。被动方必须全程睁眼看着镜子里的自己。' },
                    { name: '10. 命运之轮 (Wheel of Fortune)', emoji: '🎲', keywords: '盲盒快感、骰子决定', meaning: '放弃大脑思考，把接下来的命运完全交给概率。每一次未知都伴随着心跳加速。', action: '由主导方在纸条上写下 3 个平时不敢尝试的大尺度动作，揉成团让另一方抽取并强制执行。' },
                    { name: '11. 正义 (Justice)', emoji: '⚖️', keywords: '罪与惩罚、清算旧账', meaning: '所有的“不乖”都要在今晚付出代价。以惩罚之名，行挑逗之实。', action: '回想对方最近犯的一个“小错”，以此为理由对她进行一场色气满满的小惩罚（如打屁股 10 下）。' },
                    { name: '12. 倒吊人 (The Hanged Man)', emoji: '🪢', keywords: '无力挣扎、被迫承受', meaning: '倒吊人意味着放弃控制权，全身心地挂在对方的掌控网里。越是挣扎，越是陷入情欲。', action: '将被动方以一种“失去发力点”的姿势固定（如双手举过头顶压住，或双腿被抬起），任由主导方施为。' },
                    { name: '13. 蜕变 (Death)', emoji: '🎭', keywords: '角色扮演、打破禁忌', meaning: '忘掉你们真实的名字和身份。今晚，你们是另一个人。穿上平日里不敢穿的衣服，撕下面具。', action: '设定一个背德/刺激的场景进行 Roleplay（如：冷酷女老板 x 犯错的小秘书），必须全程不出戏。' },
                    { name: '14. 节制 (Temperance)', emoji: '🛑', keywords: '延迟满足、局部禁区', meaning: '最高级的挑逗是“偏不给你”。当你极度渴望某个部位被触碰时，对方却偏偏绕道而行。', action: '设定一个“绝对禁区”（如某个最敏感的地方）。在接下来的 20 分钟内，绝对不允许触碰该区域。' },
                    { name: '15. 诱惑 (The Devil)', emoji: '😈', keywords: '欲望释放、野性本能', meaning: '恶魔在此，无需再伪装矜持。用最直白、最下流的语言去表达你的渴望，彻底释放野兽般的本能。', action: '进行一场毫无保留的 Dirty Talk（粗口调情）。把平时绝对说不出口的话，贴在对方耳边说出来。' },
                    { name: '16. 破冰 (The Tower)', emoji: '💥', keywords: '击碎底线、猛烈冲击', meaning: '温柔到此为止，塔的崩塌伴随着剧烈的震荡。这是打破常规节奏，用狂风骤雨将对方淹没的时刻。', action: '抛弃所有的前戏与铺垫，用你们能承受的最快节奏和最猛烈的力度，给对方一次头晕目眩的冲击。' },
                    { name: '17. 星星 (The Star)', emoji: '🕯️', keywords: '温热滴落、感官流淌', meaning: '液体的温度能在皮肤上划出星光的轨迹。那是视觉与触觉的双重奢靡享受。', action: '使用温热的按摩精油（或专业低温蜡烛），在对方的光裸的后背或大腿上缓缓滴落并揉开。' },
                    { name: '18. 月亮 (The Moon)', emoji: '🐾', keywords: '不安等待、轻缓折磨', meaning: '月亮代表着心理上的拉扯。你不知道下一步的抚摸会落在哪里，这种如同猫抓般的等待，最是磨人。', action: '用极其缓慢、轻柔的动作（如指尖或发丝）在对方全身游走，故意避开敏感点，直到对方主动求饶。' },
                    { name: '19. 太阳 (The Sun)', emoji: '🥵', keywords: '高调夸赞、羞耻展示', meaning: '把私密的潮红暴露在光明之下。在最敏感的时刻，强迫对方接受直白的赞美，是极大的心理冲击。', action: '在对方快要到达顶点时，强迫她睁眼看着你，并用最直白的语言夸赞她的身体反应（Praise Kink）。' },
                    { name: '20. 觉醒 (Judgement)', emoji: '🐕', keywords: '宠物视角、绝对降级', meaning: '抛弃人类的尊严，退化成顺从的宠物。这种身份的极致降级，会带来强烈的背德快感。', action: '一方戴上项圈（或用丝巾代替），另一方牵着走。被动方需爬行，并像小狗一样祈求主人的赏赐。' },
                    { name: '21. 世界 (The World)', emoji: '🌊', keywords: '彻底沉沦、潮汐释放', meaning: '经历了前面所有的克制与调教，这是规则彻底解除的时刻。将一切抛之脑后，一同在情欲的海啸中溺亡。', action: '解除所有束缚和限制条件。用彼此最舒服、最渴望的方式，一起毫无保留地达到最终的巅峰（并做好深度的 Aftercare 安抚）。' }
                ]
            }
        },
        computed: {
            placeholderText() { return '珍藏那一刻的闪光...'; },
            btnText() { return '入卷'; },
            currentDeck() { return this.isMidnightMode ? this.tarotDeckMidnight : this.tarotDeckRomantic; },
            groupedItems() {
                const groups = {};
                this.items.forEach(item => {
                    const dateObj = new Date(item.date);
                    const yearOptions = ['〇','一','二','三','四','五','六','七','八','九'];
                    const yearStr = dateObj.getFullYear().toString().split('').map(n => yearOptions[n]).join('');
                    const yearMonth = `${yearStr}年 ${dateObj.getMonth() + 1}月`;
                    if (!groups[yearMonth]) groups[yearMonth] = [];
                    groups[yearMonth].push(item);
                });
                return groups;
            }
        },
        methods: {
            vibrate(pattern = 50) {
                if ('vibrate' in navigator) { try { navigator.vibrate(pattern); } catch (e) {} }
            },
            login() {
                if (this.loginCode === 'xiaoxin') this.currentUser = '小心';
                else if (this.loginCode === 'xiaocheng') this.currentUser = '小橙';
                else return alert('魔法暗号不对哦');
                this.vibrate(50);
                localStorage.setItem('orange_user', this.currentUser);
                this.initApp();
            },
            logout() { localStorage.removeItem('orange_user'); this.currentUser = null; this.loginCode = ''; this.vibrate(50); },
            toggleTheme() {
                this.vibrate(30);
                this.isDarkMode = !this.isDarkMode;
                document.documentElement.setAttribute('data-theme', this.isDarkMode ? 'dark' : 'light');
                localStorage.setItem('orange_theme', this.isDarkMode ? 'dark' : 'light');
                if(this.currentTab === 'stats') this.renderCharts(); 
            },
            switchTab(tab) {
                this.vibrate(30);
                this.currentTab = tab; this.selectedFiles = []; this.newNote = ''; this.newTitle = '';
                if (tab === 'stats') this.fetchAllItemsForStats();
                else if (!['tarot', 'game', 'lust'].includes(tab)) this.getItems();
            },
            
            // 🔞 极乐欲海逻辑
            rollLustDice() {
                if(this.isRollingDice) return;
                this.isRollingDice = true;
                this.vibrate([30,50,30,50,30,50]);
                setTimeout(() => {
                    this.dice1 = this.diceActions[Math.floor(Math.random() * this.diceActions.length)];
                    this.dice2 = this.diceParts[Math.floor(Math.random() * this.diceParts.length)];
                    this.isRollingDice = false;
                    this.vibrate([150, 50, 150]); // 沉重有力的两次震击
                }, 1000);
            },
            drawGacha() {
                if(this.isDrawingGacha) return;
                this.isDrawingGacha = true;
                this.vibrate([50, 50, 50, 50]);
                setTimeout(() => {
                    this.currentGacha = this.gachaList[Math.floor(Math.random() * this.gachaList.length)];
                    this.isDrawingGacha = false;
                    this.vibrate(250); // 盲盒打开的冲击震动
                }, 1200);
            },
            resetLustGacha() { this.currentGacha = null; this.vibrate(40); },
            drawTask() {
                if(this.isDrawingTask) return;
                this.isDrawingTask = true;
                this.vibrate([80, 80, 80, 80]);
                setTimeout(() => {
                    this.currentTask = this.taskList[Math.floor(Math.random() * this.taskList.length)];
                    this.isDrawingTask = false;
                    this.vibrate([300]); // 最沉重的绝对指令震动
                }, 1500);
            },
            resetLustTask() { this.currentTask = null; this.vibrate(40); },
            saveLustReading() {
                this.vibrate(50);
                let title = '', content = '';
                if (this.lustSubTab === 'gacha' && this.currentGacha) {
                    title = `🔞 欲海盲盒：${this.currentGacha.name}`;
                    content = `【火辣指数】\n${this.currentGacha.stars}\n\n【体位要求】\n${this.currentGacha.desc}\n\n【事后回味】\n（写下对方被折腾成什么样了吧...）`;
                } else if (this.lustSubTab === 'task' && this.currentTask) {
                    title = `⛓️ 绝对指令达成`;
                    content = `【执行指令】\n${this.currentTask}\n\n【调教日记】\n（记录下你们疯狂的细节...）`;
                } else return;
                
                this.newTitle = title;
                this.newNote = content;
                this.switchTab('diary'); 
            },

            // 🎲 秘戏：真心话大冒险抽卡逻辑
            drawGameCard(type) {
                if (this.isDrawingGame || this.drawnGameCard) return;
                this.isDrawingGame = type;
                if (type === 'truth') this.vibrate([30, 50, 30, 50, 30]); 
                else this.vibrate([80, 100, 80, 100]); 
                setTimeout(() => {
                    const deck = type === 'truth' ? this.gameTruths : this.gameDares;
                    const randomIndex = Math.floor(Math.random() * deck.length);
                    this.drawnGameCard = { type: type, text: deck[randomIndex] };
                    this.isDrawingGame = null;
                    this.vibrate(type === 'truth' ? 100 : 200); 
                }, 1000);
            },
            resetGameCard() { this.drawnGameCard = null; this.vibrate(40); },
            saveGameReading() {
                this.vibrate(50);
                const isTruth = this.drawnGameCard.type === 'truth';
                this.newTitle = isTruth ? '👄 秘戏：真心话' : '⛓️ 秘戏：大冒险';
                this.newNote = `【抽取挑战】\n${this.drawnGameCard.text}\n\n【执行结果】\n（在这里写下你们做了什么，或者对方的反应吧...）`;
                this.switchTab('diary'); 
            },

            // 🔮 塔罗牌相关逻辑
            toggleMidnightMode() {
                this.isMidnightMode = !this.isMidnightMode;
                this.resetTarot(); 
                this.vibrate(this.isMidnightMode ? [150, 50, 200] : [50, 50, 50]); 
            },
            drawTarotCard() {
                if (this.isDrawing || this.drawnCard) return; 
                this.isDrawing = true;
                this.vibrate([30, 50, 30, 50, 30]);
                setTimeout(() => {
                    const randomIndex = Math.floor(Math.random() * this.currentDeck.length);
                    this.drawnCard = this.currentDeck[randomIndex];
                    this.isDrawing = false;
                    this.vibrate([100, 50, 100]); 
                }, 1200);
            },
            resetTarot() { this.drawnCard = null; this.vibrate(40); },
            saveTarotReading() {
                this.vibrate(50);
                const prefix = this.isMidnightMode ? '⛓️ 午夜指令' : '🔮 星月指引';
                const actionTitle = this.isMidnightMode ? '【⛓️ 午夜执行】' : '【💡 今日互动】';
                this.newTitle = `${prefix}：${this.drawnCard.name}`;
                this.newNote = `【✦ 牌意解读】\n${this.drawnCard.meaning}\n\n${actionTitle}\n${this.drawnCard.action}`;
                this.switchTab('diary'); 
                setTimeout(() => { this.uploadItem(); }, 200);
            },

            // 通用功能
            async compressImage(file) {
                const options = { maxSizeMB: 0.8, maxWidthOrHeight: 1920, useWebWorker: true, fileType: 'image/jpeg' };
                try { return await imageCompression(file, options); } catch (error) { return file; }
            },
            handleFiles(e) { this.selectedFiles = Array.from(e.target.files); this.vibrate(30);},
            openAlbum(item) { this.vibrate(30); this.currentAlbum = item; document.body.style.overflow = 'hidden'; },
            closeAlbum() { this.vibrate(30); this.currentAlbum = null; this.appendFiles = []; document.body.style.overflow = 'auto'; this.getItems(); },
            handleAppendFiles(e) { this.appendFiles = Array.from(e.target.files); this.vibrate(30);},
            async submitAppendPhotos() {
                if(this.appendFiles.length === 0) return;
                this.vibrate(50); this.isUploading = true; const fd = new FormData(); 
                for (let i = 0; i < this.appendFiles.length; i++) { const compressed = await this.compressImage(this.appendFiles[i]); fd.append('files', compressed, compressed.name); }
                try { const res = await axios.post(`/api/items/${this.currentAlbum._id}/images`, fd); this.currentAlbum = res.data; this.appendFiles = []; document.querySelector('.append-area input[type="file"]').value = ''; this.vibrate([50,50,50]); } catch (e) {} finally { this.isUploading = false; }
            },
            async deleteImageFromAlbum(albumId, imageId) {
                this.vibrate(30);
                if(confirm("确定要把这张照片移出相册吗？")) { const res = await axios.delete(`/api/items/${albumId}/images/${imageId}`); this.currentAlbum = res.data; }
            },
            async uploadItem() {
                if (!this.newNote && this.selectedFiles.length === 0 && this.newTitle === '') return alert("总得留下点魔法痕迹吧？");
                this.vibrate(50); this.isUploading = true; const fd = new FormData();
                for (let i = 0; i < this.selectedFiles.length; i++) { const compressed = await this.compressImage(this.selectedFiles[i]); fd.append('files', compressed, compressed.name); }
                fd.append('category', this.currentTab); fd.append('title', this.newTitle); fd.append('author', this.currentUser); 
                if (this.newDate) fd.append('date', this.newDate);
                if (this.currentTab === 'story') fd.append('segments', JSON.stringify([{ id: Date.now().toString(), author: this.currentUser, text: this.newNote }]));
                else fd.append('note', this.newNote);
                try {
                    await axios.post('/api/items', fd);
                    this.newNote = ''; this.newTitle = ''; this.newDate = new Date().toISOString().split('T')[0]; this.selectedFiles = [];
                    const fileInput = document.querySelector('.control-panel input[type="file"]'); if(fileInput) fileInput.value = '';
                    this.getItems(); this.vibrate([50,50,50]); 
                } catch (error) {} finally { this.isUploading = false; }
            },
            async fetchAllItemsForStats() { const res = await axios.get('/api/items'); this.allItemsForStats = res.data; this.renderCharts(); },
            renderCharts() {
                this.$nextTick(() => {
                    let textCount = { '小橙': 0, '小心': 0 }; let monthlyActivity = {};
                    this.allItemsForStats.forEach(item => {
                        if (item.category === 'story' && item.segments) { item.segments.forEach(seg => { if (seg.author === '小橙') textCount['小橙'] += seg.text.length; if (seg.author === '小心') textCount['小心'] += seg.text.length; }); }
                        const month = item.date.substring(0, 7); monthlyActivity[month] = (monthlyActivity[month] || 0) + 1;
                    });
                    if (this.storyChartObj) this.storyChartObj.destroy(); if (this.activityChartObj) this.activityChartObj.destroy();
                    const fontColor = this.isDarkMode ? '#F5E6E8' : '#7B5C6A';
                    const ctx1 = document.getElementById('storyChart');
                    if (ctx1 && (textCount['小橙'] > 0 || textCount['小心'] > 0)) {
                        this.storyChartObj = new Chart(ctx1, { type: 'doughnut', data: { labels: ['小橙执笔 (字)', '小心执笔 (字)'], datasets: [{ data: [textCount['小橙'], textCount['小心']], backgroundColor: ['#82CAFF', '#FFB7B2'], borderColor: this.isDarkMode ? '#1E293B' : '#FFFFFF', borderWidth: 3 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: fontColor, font: { family: 'Noto Serif SC'} } } } } });
                    }
                    const sortedMonths = Object.keys(monthlyActivity).sort(); const monthData = sortedMonths.map(m => monthlyActivity[m]);
                    const ctx2 = document.getElementById('activityChart');
                    if (ctx2 && sortedMonths.length > 0) {
                        this.activityChartObj = new Chart(ctx2, { type: 'bar', data: { labels: sortedMonths, datasets: [{ label: '留下的足迹 (条)', data: monthData, backgroundColor: '#E6A8D7', borderRadius: 6 }] }, options: { responsive: true, maintainAspectRatio: false, scales: { x: { ticks: { color: fontColor } }, y: { ticks: { color: fontColor, stepSize: 1 } } }, plugins: { legend: { labels: { color: fontColor, font: { family: 'Noto Serif SC'} } } } } });
                    }
                });
            },
            async getItems() { const res = await axios.get(`/api/items?category=${this.currentTab}`); this.items = res.data; },
            async deleteItem(id) { this.vibrate(30); if (confirm("真的要消除这段回忆吗？如果是相册，里面的照片也会随之消散哦。")) { await axios.delete(`/api/items/${id}`); this.getItems(); } },
            startEdit(item) { this.vibrate(30); this.editingId = item._id; this.editTitle = item.title || ''; this.editNote = item.note || ''; if (this.currentTab === 'story') { this.editSegments = item.segments ? JSON.parse(JSON.stringify(item.segments)) : [{ id: Date.now().toString(), author: item.author, text: item.note }]; } },
            addNewSegment() { this.vibrate(30); this.editSegments.push({ id: Date.now().toString(), author: this.currentUser, text: '' }); },
            cancelEdit() { this.vibrate(30); this.editingId = null; },
            async saveEdit(id) { this.vibrate(50); let payload = { title: this.editTitle }; if (this.currentTab === 'story') payload.segments = this.editSegments.filter(seg => seg.text.trim() !== ''); else payload.note = this.editNote; try { await axios.put(`/api/items/${id}`, payload); this.editingId = null; this.getItems(); } catch (e) {} },
            async toggleWish(item, event) { this.vibrate(30); try { await axios.put(`/api/items/${item._id}`, { completed: event.target.checked }); item.completed = event.target.checked; } catch (e) { event.target.checked = !event.target.checked; } },
            isFuture(timestamp) { return timestamp > Date.now(); },
            viewFull(url) { window.open(url, '_blank'); },
            formatDate(dateString) { return new Date(dateString).toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' }); },
            initApp() {
                this.newDate = new Date().toISOString().split('T')[0];
                this.currentTab === 'stats' ? this.fetchAllItemsForStats() : (!['tarot', 'game', 'lust'].includes(this.currentTab) && this.getItems());
                if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
            }
        },
        mounted() { 
            const savedUser = localStorage.getItem('orange_user'); if (savedUser) { this.currentUser = savedUser; this.initApp(); }
            const savedTheme = localStorage.getItem('orange_theme'); if (savedTheme === 'dark') { this.isDarkMode = true; document.documentElement.setAttribute('data-theme', 'dark'); }
        }
    }).mount('#app');
</script>
