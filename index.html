<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>橙心回忆 - 梦幻流光信箱</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        :root {
            /* 橙心主题的华丽色彩 */
            --orange-light: #ffd8b1;
            --orange-main: #ff9a44;
            --orange-glow: rgba(255, 154, 68, 0.4);
            --pink-dream: #fc6076;
            
            /* 水晶毛玻璃质感 */
            --glass-bg: rgba(255, 255, 255, 0.35);
            --glass-border: rgba(255, 255, 255, 0.6);
            --glass-shadow: 0 8px 32px rgba(255, 154, 68, 0.15);
            
            --text-main: #5a3e2b;
            --text-secondary: #8c6b5d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
            margin: 0; 
            padding: 40px 20px; 
            color: var(--text-main);
            min-height: 100vh;
            /* 梦幻流光动态背景 */
            background: linear-gradient(-45deg, #ffecd2, #fcb69f, #ff9a44, #ffc3a0);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            -webkit-font-smoothing: antialiased;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #app { max-width: 1000px; margin: 0 auto; }

        /* 华丽发光标题 */
        h1 { 
            text-align: center; 
            font-weight: 800; 
            font-size: 42px; 
            letter-spacing: 2px; 
            margin-bottom: 40px;
            background: linear-gradient(to right, #ff758c 0%, #ff7eb3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 4px 20px rgba(255, 117, 140, 0.4);
            animation: pulseGlow 3s infinite alternate;
        }

        @keyframes pulseGlow {
            from { text-shadow: 0px 4px 15px rgba(255, 117, 140, 0.3); }
            to { text-shadow: 0px 4px 25px rgba(255, 117, 140, 0.7); }
        }

        /* 极光水晶控制面板 */
        .control-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 30px;
            padding: 35px;
            margin-bottom: 50px;
            box-shadow: var(--glass-shadow);
            border: 1px solid var(--glass-border);
            border-top: 1px solid rgba(255,255,255,0.8);
            border-left: 1px solid rgba(255,255,255,0.8);
            display: flex; flex-direction: column; gap: 20px;
            position: relative;
            overflow: hidden;
        }

        /* 面板内部的微光点缀 */
        .control-panel::before {
            content: '';
            position: absolute;
            top: -50px; left: -50px;
            width: 150px; height: 150px;
            background: rgba(255, 255, 255, 0.4);
            filter: blur(40px);
            border-radius: 50%;
            pointer-events: none;
        }

        .input-group { display: flex; gap: 15px; flex-wrap: wrap; position: relative; z-index: 1;}

        input {
            padding: 15px 20px; border-radius: 18px; 
            border: 1px solid rgba(255, 255, 255, 0.5); 
            background: rgba(255, 255, 255, 0.4);
            font-size: 15px; outline: none; transition: all 0.3s ease;
            color: var(--text-main); flex: 1; min-width: 200px;
            backdrop-filter: blur(10px);
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.3);
        }
        
        input::placeholder { color: #a88a7b; }
        input:focus { 
            background: rgba(255, 255, 255, 0.7); 
            border: 1px solid var(--orange-main); 
            box-shadow: 0 0 15px var(--orange-glow); 
        }

        input[type="file"] { padding: 12px; flex: none; width: 220px; cursor: pointer; }
        input[type="date"] { flex: none; width: 140px; cursor: pointer; }

        /* 华丽的渐变按钮 */
        button {
            background: linear-gradient(135deg, #ff9a44 0%, #fc6076 100%);
            color: white; border: none; padding: 15px 30px; border-radius: 18px;
            font-size: 16px; font-weight: bold; cursor: pointer;
            box-shadow: 0 8px 20px var(--orange-glow);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative; overflow: hidden;
        }
        
        button:hover { 
            transform: translateY(-2px) scale(1.03); 
            box-shadow: 0 12px 25px rgba(252, 96, 118, 0.4); 
        }

        /* 时间轴标题 */
        .timeline-group { margin-bottom: 60px; }
        .timeline-header {
            font-size: 26px; font-weight: 700; color: #d45d3c;
            margin-bottom: 25px; padding-bottom: 10px;
            position: sticky; top: 10px; z-index: 10;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            display: inline-block;
        }

        /* 水晶相册卡片 */
        .letter-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px;
        }

        .letter-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 24px; overflow: hidden;
            box-shadow: 0 10px 30px rgba(200, 100, 50, 0.08);
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: pointer; 
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-top: 2px solid rgba(255, 255, 255, 1);
        }

        .letter-card:hover { 
            transform: translateY(-8px); 
            box-shadow: 0 15px 40px rgba(252, 96, 118, 0.15); 
            border-color: rgba(255, 154, 68, 0.4);
        }

        .letter-card img {
            width: 100%; height: 260px; object-fit: cover;
            border-bottom: 1px solid rgba(255,255,255,0.5);
        }

        .letter-info { padding: 22px; }
        .letter-date { 
            font-size: 13px; font-weight: bold; 
            color: var(--orange-main); 
            display: block; margin-bottom: 8px; 
            letter-spacing: 1px;
        }
        .letter-note { font-size: 16px; line-height: 1.6; color: var(--text-main); font-weight: 500;}
        
        .highlight { 
            background: linear-gradient(120deg, #ffd8b1 0%, #ffc3a0 100%); 
            color: #d45d3c; 
            border-radius: 6px; padding: 2px 6px; 
            box-shadow: 0 2px 5px rgba(255, 154, 68, 0.2);
        }
    </style>
</head>
<body>

<div id="app">
    <h1>✨ 橙心回忆 ✨</h1>

    <div class="control-panel">
        <input type="text" v-model="searchQuery" @input="getLetters" placeholder="🔍 搜索那天的只言片语，寻找珍贵的回忆...">
        
        <div class="input-group">
            <input type="file" @change="handleFile" accept="image/*">
            <input type="date" v-model="newDate" title="选择回忆发生的日期">
            <input type="text" v-model="newNote" placeholder="✍️ 写下关于这封信的温馨记忆...">
            <button @click="uploadLetter">珍藏回忆 🧡</button>
        </div>
    </div>

    <div v-for="(lettersInGroup, monthYear) in groupedLetters" :key="monthYear" class="timeline-group">
        <div class="timeline-header">{{ monthYear }}</div>
        
        <div class="letter-grid">
            <div v-for="letter in lettersInGroup" :key="letter._id" class="letter-card" @click="viewFull(letter.url)">
                <img :src="letter.url">
                <div class="letter-info">
                    <span class="letter-date">{{ formatDate(letter.date) }}</span>
                    <span class="letter-note" v-html="highlight(letter.note)"></span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // 这里的 JavaScript 逻辑与上一版完全一致，仅驱动 UI
    const { createApp } = Vue;
    createApp({
        data() {
            return {
                letters: [],
                searchQuery: '',
                newNote: '',
                newDate: '',
                selectedFile: null
            }
        },
        computed: {
            groupedLetters() {
                const groups = {};
                this.letters.forEach(letter => {
                    const dateObj = new Date(letter.date);
                    const yearMonth = `${dateObj.getFullYear()}年 ${dateObj.getMonth() + 1}月`;
                    if (!groups[yearMonth]) groups[yearMonth] = [];
                    groups[yearMonth].push(letter);
                });
                return groups;
            }
        },
        methods: {
            handleFile(e) { this.selectedFile = e.target.files[0]; },
            async uploadLetter() {
                if(!this.selectedFile) return alert("请先选择照片哦！");
                const fd = new FormData();
                fd.append('letterImage', this.selectedFile);
                fd.append('note', this.newNote);
                if(this.newDate) fd.append('date', this.newDate);
                
                try {
                    await axios.post('/api/upload', fd);
                    this.newNote = '';
                    this.newDate = new Date().toISOString().split('T')[0];
                    this.selectedFile = null;
                    document.querySelector('input[type="file"]').value = ''; 
                    this.getLetters();
                } catch (error) {
                    alert("上传失败，请稍后再试");
                }
            },
            async getLetters() {
                try {
                    const res = await axios.get(`/api/letters?q=${this.searchQuery}`);
                    this.letters = res.data;
                } catch (error) {
                    console.error("获取信件失败", error);
                }
            },
            highlight(text) {
                if(!text) return '';
                if(!this.searchQuery) return text;
                return text.replace(new RegExp(`(${this.searchQuery})`, 'gi'), '<span class="highlight">$1</span>');
            },
            viewFull(url) { window.open(url, '_blank'); },
            formatDate(dateString) {
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                return new Date(dateString).toLocaleDateString('zh-CN', options);
            }
        },
        mounted() { 
            this.newDate = new Date().toISOString().split('T')[0];
            this.getLetters(); 
        }
    }).mount('#app');
</script>
</body>
</html>
