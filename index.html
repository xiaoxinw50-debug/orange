                this.switchTab(item.category);
            },
            toggleDeepNightMode() {
                this.manualDeepNight = !this.manualDeepNight;
            },
            formatMemoryOption(item) {
                return `${this.formatDate(item.date)} · ${this.getCategoryLabel(item.category)} · ${this.getItemDisplayTitle(item)}`;
            },
            getItemInteractionCount(item) {
                return (item?.replies?.length || 0) + (item?.perspectives?.length || 0);
            },
            canReplyToItem(item) {
                return ['memory', 'diary'].includes(this.getDisplayCategory(item));
            },
            getReplyEntries(item) {
                return (item?.replies || []).slice().sort((a, b) => (b.time || 0) - (a.time || 0));
            },
            getReplyCount(item) {
                return this.getReplyEntries(item).length;
            },
            getLatestReply(item) {
                return this.getReplyEntries(item)[0] || null;
            },
            isInlineReplyOpen(item) {
                return this.inlineReplyItemId === item?._id;
            },
            toggleInlineReplyComposer(item) {
                if (!item?._id) return;
                this.inlineReplyItemId = this.inlineReplyItemId === item._id ? '' : item._id;
                if (!this.replyDraftsByItem[item._id]) {
                    this.replyDraftsByItem = { ...this.replyDraftsByItem, [item._id]: '' };
                }
            },
            closeInlineReplyComposer() {
                this.inlineReplyItemId = '';
            },
            getLatestInteractionPreview(item) {
                const reply = (item?.replies || []).slice().sort((a, b) => (b.time || 0) - (a.time || 0))[0];
                const perspective = (item?.perspectives || []).slice().sort((a, b) => (b.time || 0) - (a.time || 0))[0];
                const latest = [reply ? { ...reply, type: 'reply', label: '回信' } : null, perspective ? { ...perspective, type: 'perspective', label: '视角补完' } : null]
                    .filter(Boolean)
                    .sort((a, b) => (b.time || 0) - (a.time || 0))[0];
                if (!latest) return null;
                return {
                    type: latest.type,
                    label: latest.label,
                    text: `${latest.author}：${latest.text.slice(0, 44)}${latest.text.length > 44 ? '…' : ''}`
                };
            },
            openReplyFromList(item) {
                this.toggleInlineReplyComposer(item);
            },
            openPerspectiveFromList(item) {
                this.showNotice('info', '关系页入口已收起，先专注在记录和游乐里。');
            },
            switchTabWithMemory(item, type) {
                this.showNotice('info', '这类互动入口暂时已从主界面收起。');
            },
            getTemperatureLabel(state) {
                const target = this.temperatureOptions.find(item => item.key === state);
                return target ? target.label : '未标记';
            },
            getCompanionBucketLabel(bucket) {
                const target = this.companionBuckets.find(item => item.key === bucket);
                return target ? target.label : '未分类';
            },
            selectRepairPrompt(card) {
                this.repairDraftTitle = card.title;
                this.repairDraftPrompt = card.prompt;
            },
            setRelationshipEntries(entries) {
                const nextEntries = { praise: [], repair: [], ritual: [], temperature: [], companion: [], comfort: [] };
                entries.forEach(entry => {
                    if (nextEntries[entry.type]) nextEntries[entry.type].push(entry);
                });
                Object.keys(nextEntries).forEach(key => {
                    nextEntries[key].sort((a, b) => (b.time || 0) - (a.time || 0));
                });
                this.relationshipEntries = nextEntries;
            },
            ensureRelationshipSelections() {
                const firstItemId = this.relationshipItems[0]?._id || '';
                if (!this.selectedReplyItemId || !this.relationshipItems.some(item => item._id === this.selectedReplyItemId)) {
                    this.selectedReplyItemId = firstItemId;
                }
                if (!this.selectedPerspectiveItemId || !this.relationshipItems.some(item => item._id === this.selectedPerspectiveItemId)) {
                    this.selectedPerspectiveItemId = firstItemId;
                }
            },
            replaceItemInCollections(updatedItem) {
                this.items = this.items.map(item => item._id === updatedItem._id ? updatedItem : item);
                this.allItemsForStats = this.allItemsForStats.map(item => item._id === updatedItem._id ? updatedItem : item);
                if (this.currentAlbum && this.currentAlbum._id === updatedItem._id) {
                    this.currentAlbum = updatedItem;
                }
                this.ensureRelationshipSelections();
            },
            async loadRelationshipHub() {
                this.relationshipLoading = true;
                try {
                    const today = this.getLocalDateString();
                    const [itemsRes, entriesRes, questionRes] = await Promise.all([
                        axios.get('/api/items'),
                        axios.get('/api/relationship/entries'),
                        axios.get('/api/relationship/daily-question', { params: { date: today } })
                    ]);
                    this.allItemsForStats = itemsRes.data;
                    this.setRelationshipEntries(entriesRes.data);
                    this.dailyQuestion = questionRes.data;
                    if (this.currentTab === 'home') this.renderCharts();
                    this.ensureRelationshipSelections();
                } catch (error) {
                    this.showNotice('error', this.getErrorMessage(error, '关系页数据加载失败'));
                } finally {
                    this.relationshipLoading = false;
                }
            },
            async answerDailyQuestion(answer) {

                    const res = await axios.post('/api/relationship/daily-question/answer', {
                        date: this.getLocalDateString(),
                        author: this.currentUser,
                        answer
                    });
                    this.dailyQuestion = res.data;
                    this.showNotice('success', '今天的小问已经封存');
                } catch (error) {
                    this.showNotice('error', this.getErrorMessage(error, '提交答案失败'));
                }
            },
            async saveRelationshipEntry(type) {
                let payload = { type, author: this.currentUser, date: this.getLocalDateString() };
                if (type === 'praise') {
                    payload.text = this.praiseDraft;
                } else if (type === 'repair') {
                    payload.title = this.repairDraftTitle;
                    payload.prompt = this.repairDraftPrompt;
                    payload.text = this.repairDraftText;
                } else if (type === 'ritual') {
                    payload.title = this.ritualDraftTitle;
                    payload.text = this.ritualDraftText;
                    payload.date = this.ritualDraftDate || this.getLocalDateString();
                } else if (type === 'temperature') {
                    payload.state = this.temperatureDraftState;
                    payload.text = this.temperatureDraftText;
                } else if (type === 'companion') {
                    payload.title = this.companionDraftTitle;
                    payload.text = this.companionDraftText;
                    payload.bucket = this.companionDraftBucket;
                } else if (type === 'comfort') {
                    payload.title = this.comfortDraftTitle;
                    payload.text = this.comfortDraftText;
                }

                try {
                    const res = await axios.post('/api/relationship/entries', payload);
                    this.setRelationshipEntries([res.data, ...Object.values(this.relationshipEntries).flat()]);
                    if (type === 'praise') this.praiseDraft = '';
                    if (type === 'repair') { this.repairDraftTitle = ''; this.repairDraftPrompt = ''; this.repairDraftText = ''; }
                    if (type === 'ritual') { this.ritualDraftTitle = ''; this.ritualDraftText = ''; this.ritualDraftDate = ''; }
                    if (type === 'temperature') { this.temperatureDraftState = 'steady'; this.temperatureDraftText = ''; }
                    if (type === 'companion') { this.companionDraftTitle = ''; this.companionDraftText = ''; this.companionDraftBucket = 'quick'; }
                    if (type === 'comfort') { this.comfortDraftTitle = ''; this.comfortDraftText = ''; }
                    this.showNotice('success', '关系页内容已保存');
                } catch (error) {
                    this.showNotice('error', this.getErrorMessage(error, '保存失败'));
                }
            },
            async saveTemperatureEntry() {
                await this.saveRelationshipEntry('temperature');
            },
            async toggleRelationshipCompleted(entry) {
                try {
                    const res = await axios.put(`/api/relationship/entries/${entry._id}`, { completed: !entry.completed });
                    const merged = Object.values(this.relationshipEntries).flat().map(item => item._id === res.data._id ? res.data : item);
                    this.setRelationshipEntries(merged);
                } catch (error) {
                    this.showNotice('error', this.getErrorMessage(error, '状态更新失败'));
                }
            },
            async saveItemReply(itemId = this.selectedReplyItemId, draftText = this.replyDraft) {
                const text = String(draftText || '').trim();
                if (!itemId) {
                    this.showNotice('info', '先选择一条回忆');
                    return false;
                }
                if (!text) {
                    this.showNotice('info', '先写点内容再发送');
                    return false;
                }
                if (!this.isOnline) {
                    const targetItem = this.relationshipItems.find(item => item._id === itemId) || this.items.find(item => item._id === itemId);
                    if (!targetItem) {
                        this.showNotice('error', '这条回忆暂时没找到，稍后再试');
                        return false;
                    }
                    this.queueOfflineReply(targetItem, text);
                    if (itemId === this.selectedReplyItemId) this.replyDraft = '';
                    this.showNotice('info', '回信已离线保存，联网后会自动贴上去');
                    return true;
                }
                try {
                    const res = await axios.post(`/api/items/${itemId}/replies`, {
                        author: this.currentUser,
                        text,
                        date: this.getLocalDateString()
                    });
                    if (itemId === this.selectedReplyItemId) this.replyDraft = '';
                    this.replaceItemInCollections(res.data);
                    this.showNotice('success', '回信已经贴到这条回忆上');
                    return true;
                } catch (error) {
                    this.showNotice('error', this.getErrorMessage(error, '发送回信失败'));
                    return false;
                }
            },
            async submitInlineReply(item) {
                const draft = this.replyDraftsByItem[item?._id] || '';
                const saved = await this.saveItemReply(item?._id, draft);
                if (saved) {
                    this.replyDraftsByItem = {
                        ...this.replyDraftsByItem,
                        [item._id]: ''
                    };
                    this.inlineReplyItemId = '';
                }
            },
            async saveItemPerspective() {
                if (!this.selectedPerspectiveItemId) {
                    this.showNotice('info', '先选择一条回忆');
                    return;
                }
                try {
                    const res = await axios.post(`/api/items/${this.selectedPerspectiveItemId}/perspectives`, {
                        author: this.currentUser,
                        text: this.perspectiveDraft,
                        date: this.getLocalDateString()
                    });
                    this.perspectiveDraft = '';
                    this.replaceItemInCollections(res.data);
                    this.showNotice('success', '你的视角已经补进这条回忆了');
                } catch (error) {
                    this.showNotice('error', this.getErrorMessage(error, '保存视角失败'));
                }
            },
            async submitActiveResponse() {
                if (this.responseComposerMode === 'reply') {
                    await this.saveItemReply();
                } else {
                    await this.saveItemPerspective();
                }
            },

            wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight) {
                const chars = String(text || '').split('');
                let line = '';
                let row = 0;
                chars.forEach(char => {
                    const testLine = line + char;
                    if (ctx.measureText(testLine).width > maxWidth && line) {
                        ctx.fillText(line, x, y + row * lineHeight);
                        line = char;
                        row += 1;
                    } else {
                        line = testLine;
                    }
                });
                if (line) ctx.fillText(line, x, y + row * lineHeight);

            toggleBingoCell(index) {
                const target = this.bingoBoard[index];
                if (!target || target.free) return;
                const previousLines = this.bingoLineCount;
                this.bingoBoard = this.bingoBoard.map((cell, cellIndex) => cellIndex === index
                    ? { ...cell, completed: !cell.completed }
                    : cell);
                this.persistBingoBoard();
                const nextLines = this.bingoWinLines.length;
                if (nextLines > previousLines) {
                    this.incrementPlayStat('bingoWins', nextLines - previousLines);
                    this.playSuccessTone();

            playSuccessTone() {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                try {
                    if (!this.audioCtx) this.audioCtx = new AudioCtx();
                    const ctx = this.audioCtx;
                    const now = ctx.currentTime;
                    [440, 554.37, 659.25].forEach((freq, index) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.value = freq;
                        gain.gain.setValueAtTime(0.0001, now);
                        gain.gain.exponentialRampToValueAtTime(0.05, now + 0.02 + index * 0.03);
                        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.28 + index * 0.04);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + index * 0.03);
                        osc.stop(now + 0.35 + index * 0.04);
                    });
                } catch (error) {}
            },
            launchParticles(origin = { x: '50%', y: '32%' }, count = 20) {
                const particles = Array.from({ length: count }, (_, index) => {
                    const hue = Math.round(330 + Math.random() * 90);
                    const angle = Math.random() * Math.PI * 2;
                    const distance = 80 + Math.random() * 180;
                    const dx = `${Math.cos(angle) * distance}px`;
                    const dy = `${Math.sin(angle) * distance - 40}px`;
                    return {
                        id: `${Date.now()}-${index}-${Math.random().toString(16).slice(2)}`,
                        style: {
                            '--x': origin.x,
                            '--y': origin.y,
                            '--dx': dx,
                            '--dy': dy,
                            '--delay': `${Math.random() * 0.08}s`,
                            '--dur': `${0.8 + Math.random() * 0.45}s`,
                            '--size': `${8 + Math.random() * 10}px`,
                            '--hue': hue
                        }
                    };
                });
                this.particles = particles;
                window.clearTimeout(this.particleTimer);
                this.particleTimer = window.setTimeout(() => {
                    this.particles = [];
                }, 1400);
            },
            checkAchievementUnlocks() {
                const storageKey = 'orange_known_achievements';
                const unlocked = this.achievementCards.filter(item => item.unlocked);
                const unlockedKeys = unlocked.map(item => item.key);
                let knownKeys = [];
                try {
                    knownKeys = JSON.parse(localStorage.getItem(storageKey) || '[]');
                } catch (error) {
                    knownKeys = [];
                }
                if (!localStorage.getItem(storageKey)) {
                    localStorage.setItem(storageKey, JSON.stringify(unlockedKeys));
                    return;
                }
                const fresh = unlocked.filter(item => !knownKeys.includes(item.key));
                if (fresh.length > 0) {
                    localStorage.setItem(storageKey, JSON.stringify([...new Set([...knownKeys, ...fresh.map(item => item.key)])]));
                    this.achievementQueue.push(...fresh);
                    if (!this.activeAchievement) this.showNextAchievement();

                this.syncAnswers = { '小橙': '', '小心': '' };
            },
            
            // 🎲 秘戏：真心话大冒险抽卡逻辑
            drawGameCard(type) {
                if (this.isDrawingGame || this.drawnGameCard) return;
                this.isDrawingGame = type;
                
                // 不同的震动反馈：真心话是快速心跳，大冒险是沉重锁链
                if (type === 'truth') {
                    this.vibrate([30, 50, 30, 50, 30]); 
                } else {
                    this.vibrate([80, 100, 80, 100]); 
                }

                setTimeout(() => {
                    const deck = type === 'truth' ? this.gameTruths : this.gameDares;
                    const randomIndex = Math.floor(Math.random() * deck.length);
                    this.drawnGameCard = {
                        type: type,
                        text: deck[randomIndex]
                    };
                    this.isDrawingGame = null;
                    this.vibrate(type === 'truth' ? 100 : 200); // 翻开时的重击
                }, 1000);
            },
            resetGameCard() {
                this.drawnGameCard = null;
                this.vibrate(40);
            },
            saveGameReading() {
                this.vibrate(50);
                const isTruth = this.drawnGameCard.type === 'truth';
                const gameTitle = isTruth ? '👄 秘戏：真心话' : '⛓️ 秘戏：大冒险';
                const gameNote = `【抽取挑战】\n${this.drawnGameCard.text}\n\n【执行结果】\n（在这里写下你们做了什么，或者对方的反应吧...）`;
                this.switchTab('diary');
                this.$nextTick(() => {
                    this.newTitle = gameTitle;
                    this.newNote = gameNote;
                    this.showNotice('info', '已把秘戏挑战写入随笔草稿');
                });
            },

            // 🔮 塔罗牌相关逻辑
            toggleMidnightMode() {
                this.isMidnightMode = !this.isMidnightMode;
                this.resetTarot(); 
                this.vibrate(this.isMidnightMode ? [150, 50, 200] : [50, 50, 50]); 
            },
            drawTarotCard() {
                if (this.isDrawing || this.drawnCard) return; 
                this.isDrawing = true;
                this.vibrate([30, 50, 30, 50, 30]);
                setTimeout(() => {
                    const randomIndex = Math.floor(Math.random() * this.currentDeck.length);
                    this.drawnCard = this.currentDeck[randomIndex];
                    this.isDrawing = false;
                    this.vibrate([100, 50, 100]); 
                }, 1200);
            },
            resetTarot() { this.drawnCard = null; this.vibrate(40); },
            saveTarotReading() {
                this.vibrate(50);
                const prefix = this.isMidnightMode ? '⛓️ 午夜指令' : '🔮 星月指引';
                const actionTitle = this.isMidnightMode ? '【⛓️ 午夜执行】' : '【💡 今日互动】';
                const tarotTitle = `${prefix}：${this.drawnCard.name}`;
                const tarotNote = `【✦ 牌意解读】\n${this.drawnCard.meaning}\n\n${actionTitle}\n${this.drawnCard.action}`;
                this.switchTab('diary');
                this.$nextTick(() => {
                    this.newTitle = tarotTitle;
                    this.newNote = tarotNote;
                    this.uploadItem({ successMessage: '星月指引已刻入随笔', resetTarot: true });
                });
            },

            // 通用功能
            async compressImage(file) {
                const options = { maxSizeMB: 0.8, maxWidthOrHeight: 1920, useWebWorker: true, fileType: 'image/jpeg' };
                try { return await imageCompression(file, options); } catch (error) { return file; }
            },
            handleFiles(e) {
                const files = Array.from(e.target.files);
                this.revokePreviewUrls(this.selectedFilePreviews);
                this.selectedFiles = files;
                this.selectedFilePreviews = this.createFilePreviews(files);
                this.vibrate(30);
            },
            openAlbum(item) {
                this.vibrate(30);
                this.currentAlbum = item;
                this.albumReadOnly = Boolean(item.deletedAt);
                document.body.style.overflow = 'hidden';
            },
            closeAlbum(refresh = true) {
                this.vibrate(30);
                this.currentAlbum = null;
                this.revokePreviewUrls(this.appendFilePreviews);
                this.appendFiles = [];
                this.appendFilePreviews = [];
                this.albumReadOnly = false;
                if (!this.lightboxOpen) document.body.style.overflow = 'auto';
                if (refresh) this.getItems();
            },
            handleAppendFiles(e) {
                const files = Array.from(e.target.files);
                this.revokePreviewUrls(this.appendFilePreviews);
                this.appendFiles = files;
                this.appendFilePreviews = this.createFilePreviews(files);
                this.vibrate(30);
            },
            async submitAppendPhotos() {
                if (this.albumReadOnly) return;
                if(this.appendFiles.length === 0) return;
                this.vibrate(50); this.isUploading = true; const fd = new FormData(); 
                for (let i = 0; i < this.appendFiles.length; i++) { const compressed = await this.compressImage(this.appendFiles[i]); fd.append('files', compressed, compressed.name); }
                try {
                    const res = await axios.post(`/api/items/${this.currentAlbum._id}/images`, fd);
                    this.currentAlbum = res.data;
                    this.revokePreviewUrls(this.appendFilePreviews);
                    this.appendFiles = [];
                    this.appendFilePreviews = [];
                    document.querySelector('.append-area input[type="file"]').value = '';
                    this.showNotice('success', '照片已追加到相册');
                    this.vibrate([50,50,50]);
                } catch (error) {
                    this.showNotice('error', this.getErrorMessage(error, '追加照片失败'));
                } finally { this.isUploading = false; }
            },
            async deleteImageFromAlbum(albumId, imageId) {
                if (this.albumReadOnly) return;
                if (!imageId) {
                    this.showNotice('info', '这张是旧相册封面，暂时不支持单独删除');
                    return;
                }
                this.vibrate(30);
                if(confirm("确定要把这张照片移出相册吗？")) {
                    try {
                        const res = await axios.delete(`/api/items/${albumId}/images/${imageId}`);
                        this.currentAlbum = res.data;
                        this.showNotice('success', '照片已从相册移除');
                    } catch (error) {
                        this.showNotice('error', this.getErrorMessage(error, '删除照片失败'));
                    }
                }
            },
            async uploadItem(optionsOrEvent) {
                const options = optionsOrEvent && typeof optionsOrEvent.preventDefault === 'function' ? {} : (optionsOrEvent || {});
                if (!this.newNote && this.selectedFiles.length === 0 && this.newTitle === '') return alert("总得留下点魔法痕迹吧？");
                this.vibrate(50); this.isUploading = true;
                if (!this.isOnline) {
                    if (this.currentTab === 'album' || this.selectedFiles.length > 0) {
                        this.isUploading = false;
                        this.showNotice('info', '离线时暂不支持相册和图片上传，先联网再传照片');
                        return;
                    }
                    const payload = {
                        category: this.currentTab,
                        title: this.newTitle,
                        note: this.currentTab === 'story' ? '' : this.newNote,
                        segments: this.currentTab === 'story' ? [{ id: Date.now().toString(), author: this.currentUser, text: this.newNote }] : [],
                        author: this.currentUser,
                        mood: this.selectedMood,
                        date: this.newDate || this.getLocalDateString(),
                        time: Date.now()
                    };
                    this.queueOfflineCreate(payload);
                    this.revokePreviewUrls(this.selectedFilePreviews);
                    this.newNote = '';
                    this.newTitle = '';
                    this.newDate = this.getLocalDateString();
                    this.selectedFiles = [];
                    this.selectedMood = '';
                    this.selectedFilePreviews = [];
                    localStorage.removeItem(this.getComposerDraftKey());
                    this.refreshComposerDraftMeta();
                    const fileInput = document.querySelector('.control-panel input[type="file"]');
                    if (fileInput) fileInput.value = '';
                    this.markTabAsSeen(this.currentTab);
                    this.showNotice('info', '已离线保存，恢复网络后会自动同步');
                    this.isUploading = false;
                    return;
                }
                const fd = new FormData();
                for (let i = 0; i < this.selectedFiles.length; i++) { const compressed = await this.compressImage(this.selectedFiles[i]); fd.append('files', compressed, compressed.name); }
                fd.append('category', this.currentTab); fd.append('title', this.newTitle); fd.append('author', this.currentUser); 
                fd.append('mood', this.selectedMood);
                if (this.newDate) fd.append('date', this.newDate);
                if (this.currentTab === 'story') fd.append('segments', JSON.stringify([{ id: Date.now().toString(), author: this.currentUser, text: this.newNote }]));
                else fd.append('note', this.newNote);
                try {
                    await axios.post('/api/items', fd);
                    this.revokePreviewUrls(this.selectedFilePreviews);
                    this.newNote = ''; this.newTitle = ''; this.newDate = this.getLocalDateString(); this.selectedFiles = []; this.selectedMood = '';
                    this.selectedFilePreviews = [];
                    localStorage.removeItem(this.getComposerDraftKey());
                    this.refreshComposerDraftMeta();
                    const fileInput = document.querySelector('.control-panel input[type="file"]'); if(fileInput) fileInput.value = '';
                    this.markTabAsSeen(this.currentTab);
                    this.getItems();
                    if (this.currentTab === 'home') this.fetchAllItemsForStats();
                    if (options.resetTarot) this.resetTarot();
                    this.showNotice('success', options.successMessage || '内容已保存');
                    this.vibrate([50,50,50]); 
                } catch (error) {
                    this.showNotice('error', this.getErrorMessage(error, '保存失败，请稍后重试'));
                } finally { this.isUploading = false; }
            },
            async fetchAllItemsForStats() {
                this.dashboardLoading = true;
                try {
                    await this.refreshAllItemsSnapshot(true);
                } catch (error) {
                    this.allItemsForStats = [];
                } finally {
                    this.dashboardLoading = false;
                    this.$nextTick(() => this.restoreScrollPosition(this.currentTab));
                }
            },
            renderCharts() {
                this.$nextTick(() => {
                    let textCount = { '小橙': 0, '小心': 0 }; let monthlyActivity = {};
                    this.allItemsForStats.forEach(item => {
                        if (item.category === 'story' && item.segments) { item.segments.forEach(seg => { if (seg.author === '小橙') textCount['小橙'] += seg.text.length; if (seg.author === '小心') textCount['小心'] += seg.text.length; }); }
                        const month = item.date.substring(0, 7); monthlyActivity[month] = (monthlyActivity[month] || 0) + 1;
                    });
                    if (this.storyChartObj) this.storyChartObj.destroy(); if (this.activityChartObj) this.activityChartObj.destroy();
                    const fontColor = this.isDarkMode ? '#F5E6E8' : '#7B5C6A';
                    const ctx1 = document.getElementById('storyChart');
                    if (ctx1 && (textCount['小橙'] > 0 || textCount['小心'] > 0)) {
                        this.storyChartObj = new Chart(ctx1, { type: 'doughnut', data: { labels: ['小橙执笔 (字)', '小心执笔 (字)'], datasets: [{ data: [textCount['小橙'], textCount['小心']], backgroundColor: ['#82CAFF', '#FFB7B2'], borderColor: this.isDarkMode ? '#1E293B' : '#FFFFFF', borderWidth: 3 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: fontColor, font: { family: 'Noto Serif SC'} } } } } });
                    }
                    const sortedMonths = Object.keys(monthlyActivity).sort(); const monthData = sortedMonths.map(m => monthlyActivity[m]);
                    const ctx2 = document.getElementById('activityChart');
                    if (ctx2 && sortedMonths.length > 0) {
                        this.activityChartObj = new Chart(ctx2, { type: 'bar', data: { labels: sortedMonths, datasets: [{ label: '留下的足迹 (条)', data: monthData, backgroundColor: '#E6A8D7', borderRadius: 6 }] }, options: { responsive: true, maintainAspectRatio: false, scales: { x: { ticks: { color: fontColor } }, y: { ticks: { color: fontColor, stepSize: 1 } } }, plugins: { legend: { labels: { color: fontColor, font: { family: 'Noto Serif SC'} } } } } });
                    }
                });
            },
            async getItems() {
                this.itemsLoading = true;
                try {
                    const params = {};
                    if (this.currentTab === 'recycle') params.deletedOnly = true;
                    else params.category = this.currentTab;
                    if (this.filterQuery.trim()) params.q = this.filterQuery.trim();
                    if (this.filterAuthor) params.author = this.filterAuthor;
                    if (this.filterMood) params.mood = this.filterMood;
                    if (this.filterFrom) params.from = this.filterFrom;
                    if (this.filterTo) params.to = this.filterTo;
                    const res = await axios.get('/api/items', { params });
                    this.items = this.mergeItemsWithQueuedContent(res.data, this.currentTab);
                    if (this.getTrackedTabs().includes(this.currentTab)) {
                        this.markTabAsSeen(this.currentTab, this.getLatestActivityForTab(this.currentTab, this.items));
                    }
                    this.refreshAllItemsSnapshot(false);
                } catch (error) {
                    this.items = this.mergeItemsWithQueuedContent([], this.currentTab);
                    this.showNotice(this.isOnline ? 'error' : 'info', this.isOnline ? this.getErrorMessage(error, '内容加载失败') : '当前离线，仅展示本地待同步内容');
                } finally {
                    this.itemsLoading = false;
                    this.$nextTick(() => this.restoreScrollPosition(this.currentTab));
                }
            },
            async deleteItem(id) {
                this.closeCardMenu();
                this.vibrate(30);
                if (confirm("真的要消除这段回忆吗？如果是相册，里面的照片也会随之消散哦。")) {
                    try {
                        await axios.delete(`/api/items/${id}`, { params: { author: this.currentUser } });
                        this.pushUndoAction({
                            kind: 'delete',
                            id,
                            label: '内容已移入回收站，可在 8 秒内恢复。'
                        });
                        this.showNotice('success', '内容已移入回收站');
                        this.getItems();
                        this.fetchAllItemsForStats();
                    } catch (error) {
                        this.showNotice('error', this.getErrorMessage(error, '删除失败'));
                    }
                }
            },
            async restoreItem(id) {
                this.closeCardMenu();
                this.vibrate(30);
                try {
                    await axios.post(`/api/items/${id}/restore`);
                    this.showNotice('success', '内容已恢复');
                    this.getItems();
                    this.fetchAllItemsForStats();
                } catch (error) {
                    this.showNotice('error', this.getErrorMessage(error, '恢复失败'));
                }
            },
            async permanentlyDeleteItem(id) {
                this.closeCardMenu();
                this.vibrate(30);
                if (!confirm('这会彻底删除内容和图片，无法恢复，确定继续吗？')) return;
                try {
                    await axios.delete(`/api/items/${id}/permanent`);
                    this.showNotice('success', '内容已彻底删除');
                    this.getItems();
                    this.fetchAllItemsForStats();
                } catch (error) {
                    this.showNotice('error', this.getErrorMessage(error, '彻底删除失败'));
                }
            },
            startEdit(item) { this.closeCardMenu(); this.vibrate(30); this.editingId = item._id; this.editTitle = item.title || ''; this.editNote = item.note || ''; this.editMood = item.mood || ''; if (this.currentTab === 'story') { this.editSegments = item.segments ? JSON.parse(JSON.stringify(item.segments)) : [{ id: Date.now().toString(), author: item.author, text: item.note }]; } },
            addNewSegment() { this.vibrate(30); this.editSegments.push({ id: Date.now().toString(), author: this.currentUser, text: '' }); },
            cancelEdit() { this.vibrate(30); this.editingId = null; this.editMood = ''; },
            async saveEdit(id) {
                this.vibrate(50);
                let payload = { title: this.editTitle, mood: this.editMood };
                if (this.currentTab === 'story') payload.segments = this.editSegments.filter(seg => seg.text.trim() !== '');
                else payload.note = this.editNote;
                try {
                    await axios.put(`/api/items/${id}`, payload);
                    this.editingId = null;
                    this.editMood = '';
                    this.getItems();
                    this.fetchAllItemsForStats();
                    this.showNotice('success', '修改已保存');
                } catch (error) {
                    this.showNotice('error', this.getErrorMessage(error, '保存修改失败'));
                }
            },
            async toggleWish(item, event) {
                this.vibrate(30);
                try {
                    const previousCompleted = Boolean(item.completed);
                    await axios.put(`/api/items/${item._id}`, { completed: event.target.checked });
                    item.completed = event.target.checked;
                    this.pushUndoAction({
                        kind: 'wish_toggle',
                        id: item._id,
                        previousCompleted,
                        label: '心愿状态已变更，可在 8 秒内恢复。'
                    });
                } catch (error) {
                    event.target.checked = !event.target.checked;
                    this.showNotice('error', this.getErrorMessage(error, '心愿状态更新失败'));
                }
            },
            isFuture(timestamp) { return timestamp > Date.now(); },
            viewFull(url) { this.openLightbox([{ url, alt: '预览图片' }], 0, '图片预览'); },
            formatDate(dateString) { return new Date(dateString).toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' }); },
            initApp() {
                this.newDate = this.getLocalDateString();
                this.reviewDate = this.getLocalDateString();
                this.isOnline = navigator.onLine !== false;
                this.loadSeenTabState();
                this.loadNotificationState();
                this.loadSyncQueue();
                this.allItemsForStats = this.mergeItemsWithQueuedContent(this.allItemsForStats);
                if (this.showComposer) this.loadComposerDraftForTab(this.currentTab);
                if (this.currentTab === 'home') this.fetchAllItemsForStats();
                else if (this.currentTab !== 'game') this.getItems();
                this.processSyncQueue(false);
                this.ensureContentNotificationSetup(true);
                this.checkRemoteNotifications();
                this.startReminderPolling();
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.register('/sw.js').catch(() => {
                        this.showNotice('error', '离线能力注册失败');
                    });
                }
            }
        },
        watch: {
            newTitle() { this.scheduleComposerDraftSave(); },
            newNote() { this.scheduleComposerDraftSave(); },
            newDate() { this.scheduleComposerDraftSave(); },
            selectedMood() { this.scheduleComposerDraftSave(); },
            playMode() { this.persistUiState(); },
            listDensityMode() { this.persistUiState(); },
            idvCustomFavorites: {
                handler() { this.persistIdvState(); },
                deep: true
            },
            idvMatchDraft: {
                handler() { this.persistIdvState(); },
                deep: true
            }
        },
        mounted() { 
            this.loadUiState();
            this.loadPlayStats();
            this.loadGameState();
            this.loadIdvState();
            this.loadPrivatePlayState();
            this.loadBingoBoard();
            this.loadSyncQueue();
            this.refreshComposerDraftMeta();
            this.refreshInstallState();
            const savedBaseDate = localStorage.getItem('orange_relationship_base'); if (savedBaseDate) this.relationshipBaseDate = savedBaseDate;
            const savedUser = localStorage.getItem('orange_user'); if (savedUser) { this.currentUser = savedUser; this.initApp(); }
            const savedTheme = localStorage.getItem('orange_theme'); if (savedTheme === 'dark') { this.isDarkMode = true; document.documentElement.setAttribute('data-theme', 'dark'); }
            document.addEventListener('click', this.closeCardMenu);
            document.addEventListener('click', this.handleGlobalActivity, true);
            document.addEventListener('keydown', this.handleGlobalKeydown, true);
            document.addEventListener('visibilitychange', this.handleVisibilityRefresh);
            window.addEventListener('beforeinstallprompt', this.handleBeforeInstallPrompt);
            window.addEventListener('appinstalled', this.handleAppInstalled);
            window.addEventListener('beforeunload', this.handleBeforeUnload);
            window.addEventListener('focus', this.handleWindowFocus);
            window.addEventListener('online', this.handleOnline);
            window.addEventListener('offline', this.handleOffline);
        },
        beforeUnmount() {
            window.clearTimeout(this.draftSaveTimer);
            window.clearTimeout(this.undoTimer);
            window.clearTimeout(this.decisionSpinTimer);
            window.clearTimeout(this.nightDiceTimer);
            window.clearTimeout(this.nightGachaTimer);
            window.clearTimeout(this.nightTaskTimer);
            window.clearInterval(this.surpriseRollTimer);
            window.clearInterval(this.scenarioRollTimer);
            window.clearTimeout(this.scenarioRevealTimer);
            window.clearTimeout(this.privateAutoLockTimer);
            window.clearTimeout(this.onlineRefreshTimer);
            this.stopReminderPolling();
            document.removeEventListener('click', this.closeCardMenu);
            document.removeEventListener('click', this.handleGlobalActivity, true);
            document.removeEventListener('keydown', this.handleGlobalKeydown, true);
            document.removeEventListener('visibilitychange', this.handleVisibilityRefresh);
            window.removeEventListener('beforeinstallprompt', this.handleBeforeInstallPrompt);
            window.removeEventListener('appinstalled', this.handleAppInstalled);
            window.removeEventListener('beforeunload', this.handleBeforeUnload);
            window.removeEventListener('focus', this.handleWindowFocus);
            window.removeEventListener('online', this.handleOnline);
            window.removeEventListener('offline', this.handleOffline);
        }
    }).mount('#app');
</script>
</body>
</html>
