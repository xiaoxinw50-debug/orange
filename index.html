<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>她的信箱 - 梦幻收藏</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        :root {
            /* 苹果风格的高级柔和渐变 */
            --bg-color: #f5f5f7;
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-main: #1d1d1f;
            --text-secondary: #86868b;
            --apple-blue: #0071e3;
        }

        body {
            /* 使用苹果系统默认字体，极具现代感 */
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            /* 增加梦幻的背景光晕 */
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(200, 220, 255, 0.6), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(255, 210, 230, 0.5), transparent 25%);
            background-attachment: fixed;
            margin: 0; padding: 40px 20px; color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        #app { max-width: 960px; margin: 0 auto; }

        h1 { text-align: center; font-weight: 600; font-size: 32px; letter-spacing: -0.5px; margin-bottom: 40px; }

        /* 苹果毛玻璃质感控制面板 */
        .control-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 30px;
            margin-bottom: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
            border: 1px solid var(--glass-border);
            display: flex; flex-direction: column; gap: 15px;
        }

        .input-group { display: flex; gap: 15px; flex-wrap: wrap; }

        input {
            padding: 14px 18px; border-radius: 14px; 
            border: 1px solid transparent; background: rgba(0, 0, 0, 0.04);
            font-size: 15px; outline: none; transition: all 0.3s ease;
            color: var(--text-main); flex: 1; min-width: 200px;
        }
        input:focus { background: white; border: 1px solid var(--apple-blue); box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.1); }

        /* 特别定制文件上传按钮和提交按钮 */
        input[type="file"] { padding: 10px; background: transparent; flex: none; width: 220px;}
        input[type="date"] { flex: none; width: 140px; }

        button {
            background: var(--apple-blue); color: white;
            border: none; padding: 14px 28px; border-radius: 14px;
            font-size: 15px; font-weight: 600; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        button:hover { transform: scale(1.02); background: #0077ed; box-shadow: 0 4px 12px rgba(0, 113, 227, 0.3); }

        /* 时间轴分组标题 (吸顶效果) */
        .timeline-group { margin-bottom: 50px; }
        .timeline-header {
            font-size: 22px; font-weight: 600; color: var(--text-main);
            margin-bottom: 20px; padding-bottom: 10px;
            border-bottom: 1px solid rgba(0,0,0,0.08);
            position: sticky; top: 0; z-index: 10;
            background: rgba(245, 245, 247, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding-top: 15px;
        }

        /* 照片瀑布流卡片 */
        .letter-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px;
        }

        .letter-card {
            background: white; border-radius: 20px; overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: pointer; border: 1px solid rgba(0,0,0,0.02);
        }

        .letter-card:hover { transform: translateY(-6px); box-shadow: 0 12px 30px rgba(0,0,0,0.08); }

        .letter-card img {
            width: 100%; height: 240px; object-fit: cover;
            border-bottom: 1px solid rgba(0,0,0,0.03);
        }

        .letter-info { padding: 18px; }
        .letter-date { font-size: 13px; font-weight: 500; color: var(--text-secondary); display: block; margin-bottom: 6px; }
        .letter-note { font-size: 15px; line-height: 1.5; color: var(--text-main); }
        
        .highlight { background: rgba(0, 113, 227, 0.15); color: var(--apple-blue); border-radius: 4px; padding: 0 4px; }
    </style>
</head>
<body>

<div id="app">
    <h1>Memories</h1>

    <div class="control-panel">
        <input type="text" v-model="searchQuery" @input="getLetters" placeholder="搜索信件备注，寻找那天的回忆... (Search)">
        
        <div class="input-group">
            <input type="file" @change="handleFile" accept="image/*">
            <input type="date" v-model="newDate" title="选择这封信的日期">
            <input type="text" v-model="newNote" placeholder="写下关于这封信的回忆...">
            <button @click="uploadLetter">保存回忆</button>
        </div>
    </div>

    <div v-for="(lettersInGroup, monthYear) in groupedLetters" :key="monthYear" class="timeline-group">
        <div class="timeline-header">{{ monthYear }}</div>
        
        <div class="letter-grid">
            <div v-for="letter in lettersInGroup" :key="letter._id" class="letter-card" @click="viewFull(letter.url)">
                <img :src="letter.url">
                <div class="letter-info">
                    <span class="letter-date">{{ formatDate(letter.date) }}</span>
                    <span class="letter-note" v-html="highlight(letter.note)"></span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const { createApp } = Vue;
    createApp({
        data() {
            return {
                letters: [],
                searchQuery: '',
                newNote: '',
                newDate: '', // 绑定的自定义日期
                selectedFile: null
            }
        },
        computed: {
            // Vue 的计算属性：将平铺的信件数组，按“年月”进行分组，实现时间轴效果
            groupedLetters() {
                const groups = {};
                this.letters.forEach(letter => {
                    const dateObj = new Date(letter.date);
                    // 格式化为 "2024年 5月"
                    const yearMonth = `${dateObj.getFullYear()}年 ${dateObj.getMonth() + 1}月`;
                    if (!groups[yearMonth]) {
                        groups[yearMonth] = [];
                    }
                    groups[yearMonth].push(letter);
                });
                return groups;
            }
        },
        methods: {
            handleFile(e) { 
                this.selectedFile = e.target.files[0]; 
            },
            async uploadLetter() {
                if(!this.selectedFile) return alert("请先选择照片哦！");
                const fd = new FormData();
                fd.append('letterImage', this.selectedFile);
                fd.append('note', this.newNote);
                if(this.newDate) fd.append('date', this.newDate); // 传入自选时间
                
                try {
                    await axios.post('/api/upload', fd);
                    this.newNote = '';
                    this.newDate = '';
                    this.selectedFile = null;
                    document.querySelector('input[type="file"]').value = ''; 
                    this.getLetters();
                } catch (error) {
                    alert("上传失败，请稍后再试");
                }
            },
            async getLetters() {
                try {
                    const res = await axios.get(`/api/letters?q=${this.searchQuery}`);
                    this.letters = res.data;
                } catch (error) {
                    console.error("获取信件失败", error);
                }
            },
            highlight(text) {
                if(!text) return '';
                if(!this.searchQuery) return text;
                return text.replace(new RegExp(`(${this.searchQuery})`, 'gi'), '<span class="highlight">$1</span>');
            },
            viewFull(url) { 
                window.open(url, '_blank'); 
            },
            formatDate(dateString) {
                // 将 2024-05-20 转换为更易读的格式
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                return new Date(dateString).toLocaleDateString('zh-CN', options);
            }
        },
        mounted() { 
            // 初始化时将日期选择器默认设置为今天
            this.newDate = new Date().toISOString().split('T')[0];
            this.getLetters(); 
        }
    }).mount('#app');
</script>
</body>
</html>
