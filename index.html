<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>她的信箱 - 梦幻收藏</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #fce4ec 0%, #e3f2fd 100%);
            --accent-pink: #ffafcc;
            --accent-blue: #a2d2ff;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            font-family: 'STKaiti', 'KaiTi', serif; /* 使用楷体增加书信感 */
            margin: 0; padding: 20px; color: #5a5a5a;
        }

        #app { max-width: 900px; margin: 0 auto; }

        /* 上传区域 */
        .upload-section {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        input[type="text"], input[type="file"] {
            padding: 10px; border-radius: 10px; border: 1px solid var(--accent-blue);
            margin-right: 10px; outline: none; background: rgba(255,255,255,0.8);
        }

        button {
            background: var(--accent-pink);
            color: white; border: none; padding: 10px 25px;
            border-radius: 20px; cursor: pointer; font-weight: bold;
            transition: 0.3s;
        }
        button:hover { transform: scale(1.05); background: #ff8fab; }

        /* 搜索框 */
        .search-box {
            width: 100%; padding: 15px; border-radius: 30px;
            border: none; margin-bottom: 30px; font-size: 16px;
            box-shadow: 0 5px 15px rgba(162, 210, 255, 0.3);
            text-align: center;
        }

        /* 信件展示卡片 */
        .letter-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
        }

        .letter-card {
            background: white; border-radius: 15px; overflow: hidden;
            transition: 0.4s; position: relative;
            border: 8px solid white; box-shadow: 0 10px 20px rgba(0,0,0,0.08);
        }

        .letter-card:hover { transform: rotate(2deg) scale(1.03); }

        .letter-card img {
            width: 100%; height: 200px; object-fit: cover;
            filter: sepia(0.1) contrast(1.05); /* 淡淡的复古滤镜 */
        }

        .letter-info { padding: 15px; background: #fffafb; }
        .letter-date { font-size: 12px; color: var(--accent-blue); }
        .letter-note { font-size: 15px; margin-top: 5px; display: block; }
        
        .highlight { background: #fff176; }
    </style>
</head>
<body>

<div id="app">
    <h1 style="text-align: center; color: #88a9c9;">✉️ 她的信件博物馆</h1>

    <div class="upload-section">
        <h3>添加新的信件记录</h3>
        <input type="file" @change="handleFile">
        <input type="text" v-model="newNote" placeholder="写一点关于这封信的备注 (用于搜索)...">
        <button @click="uploadLetter">存入信箱</button>
    </div>

    <input type="text" class="search-box" v-model="searchQuery" @input="getLetters" placeholder="搜索信件备注，寻找那天的回忆...">

    <div class="letter-grid">
        <div v-for="letter in letters" :key="letter._id" class="letter-card">
            <img :src="letter.url" @click="viewFull(letter.url)">
            <div class="letter-info">
                <span class="letter-date">{{ letter.date }}</span>
                <span class="letter-note" v-html="highlight(letter.note)"></span>
            </div>
        </div>
    </div>
</div>

<script>
    const { createApp } = Vue;
    createApp({
        data() {
            return {
                letters: [],
                searchQuery: '',
                newNote: '',
                selectedFile: null
            }
        },
        methods: {
            handleFile(e) { this.selectedFile = e.target.files[0]; },
            async uploadLetter() {
                if(!this.selectedFile) return alert("请先选择照片");
                const fd = new FormData();
                fd.append('letterImage', this.selectedFile);
                fd.append('note', this.newNote);
                
                await axios.post('http://localhost:3000/api/upload', fd);
                this.newNote = '';
                this.getLetters();
            },
            async getLetters() {
                const res = await axios.get(`http://localhost:3000/api/letters?q=${this.searchQuery}`);
                this.letters = res.data;
            },
            highlight(text) {
                if(!this.searchQuery) return text;
                return text.replace(new RegExp(`(${this.searchQuery})`, 'gi'), '<mark class="highlight">$1</mark>');
            },
            viewFull(url) { window.open(url, '_blank'); }
        },
        mounted() { this.getLetters(); }
    }).mount('#app');
</script>
</body>
</html>
