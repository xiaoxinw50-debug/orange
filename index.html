<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>橙心回忆</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        /* ================= Apple iOS/macOS 规范变量 ================= */
        :root {
            /* Light Mode (类 iOS 备忘录/照片底色) */
            --bg-base: #F5F5F7; 
            --bg-card: #FFFFFF;
            --bg-elevated: rgba(255, 255, 255, 0.75);
            --bg-input: rgba(118, 118, 128, 0.12);
            --text-primary: #1D1D1F;
            --text-secondary: #86868B;
            --divider: rgba(60, 60, 67, 0.1);
            --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.04);
            --shadow-float: 0 8px 32px rgba(0, 0, 0, 0.08);
            
            /* 专属色彩 (克制的高级莫兰迪/Apple系统色调) */
            --color-xiaocheng: #007AFF; /* Apple System Blue */
            --color-xiaoxin: #FF2D55;   /* Apple System Pink */
            --color-xiaocheng-bg: rgba(0, 122, 255, 0.1);
            --color-xiaoxin-bg: rgba(255, 45, 85, 0.1);
            
            /* 字体排版 */
            --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            --font-serif: "Noto Serif SC", "Songti SC", serif; /* 仅用于长文阅读 */
            
            /* 丝滑动画曲线 */
            --spring: cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* Dark Mode */
        [data-theme="dark"] {
            --bg-base: #000000; 
            --bg-card: #1C1C1E;
            --bg-elevated: rgba(28, 28, 30, 0.75);
            --bg-input: rgba(118, 118, 128, 0.24);
            --text-primary: #F5F5F7;
            --text-secondary: #EBEBF5;
            --divider: rgba(84, 84, 88, 0.65);
            --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.2);
            --shadow-float: 0 8px 32px rgba(0, 0, 0, 0.4);
            
            --color-xiaocheng: #0A84FF; 
            --color-xiaoxin: #FF375F;   
            --color-xiaocheng-bg: rgba(10, 132, 255, 0.15);
            --color-xiaoxin-bg: rgba(255, 55, 95, 0.15);
        }

        /* 全局重置与平滑 */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: var(--font-ui); background-color: var(--bg-base); 
            margin: 0; padding: 0; color: var(--text-primary); 
            -webkit-font-smoothing: antialiased; 
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        #app { max-width: 800px; margin: 0 auto; padding: 20px; padding-bottom: 80px;}

        /* 可复用的点击压感效果 (物理反馈) */
        .btn-press { transition: transform 0.2s var(--spring), opacity 0.2s; cursor: pointer; }
        .btn-press:active { transform: scale(0.96); opacity: 0.8; }

        /* ================= 登录页 (FaceID 风格) ================= */
        .login-overlay { position: fixed; inset: 0; background: var(--bg-base); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);}
        .login-box { text-align: center; width: 100%; max-width: 320px; }
        .login-box h1 { font-size: 28px; font-weight: 600; margin-bottom: 8px; color: var(--text-primary); letter-spacing: -0.5px;}
        .login-box p { color: var(--text-secondary); font-size: 15px; margin-bottom: 30px; }
        .login-box input { width: 100%; text-align: center; letter-spacing: 2px; padding: 16px; border-radius: 14px; border: none; background: var(--bg-input); color: var(--text-primary); outline: none; font-size: 17px; transition: 0.3s;}
        .login-box input:focus { background: var(--bg-card); box-shadow: 0 0 0 2px var(--color-xiaocheng); }

        /* ================= 顶部导航 (iOS Segmented Control) ================= */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; position: sticky; top: 0; z-index: 50; padding: 10px 0; background: var(--bg-elevated); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); margin: -20px -20px 30px -20px; padding: 20px; border-bottom: 1px solid var(--divider);}
        
        .nav-tabs { display: flex; background: var(--bg-input); border-radius: 9px; padding: 2px; }
        .tab { font-size: 14px; font-weight: 500; padding: 6px 16px; border-radius: 7px; color: var(--text-primary); cursor: pointer; transition: all 0.3s var(--spring); }
        .tab.active { background: var(--bg-card); box-shadow: 0 3px 8px rgba(0,0,0,0.12), 0 3px 1px rgba(0,0,0,0.04); }
        
        .header-actions { display: flex; gap: 15px; align-items: center; }
        .theme-toggle { font-size: 20px; background: none; border: none; color: var(--text-primary); padding: 0; cursor: pointer; }
        .user-badge { font-size: 13px; font-weight: 500; color: var(--text-secondary); display: flex; align-items: center; gap: 4px;}

        /* ================= 极简控制台 ================= */
        .control-panel { background: var(--bg-card); border-radius: 20px; padding: 20px; margin-bottom: 40px; box-shadow: var(--shadow-card); transition: 0.4s var(--spring);}
        
        .file-upload-wrapper { position: relative; display: flex; align-items: center; justify-content: center; background: var(--bg-input); border-radius: 14px; padding: 0 15px; height: 50px; cursor: pointer; transition: 0.3s;}
        .file-upload-wrapper:active { background: var(--divider); }
        .file-upload-wrapper input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
        .file-upload-text { font-size: 15px; font-weight: 500; color: var(--color-xiaocheng); }

        .input-group { display: flex; flex-direction: column; gap: 12px; margin-top: 12px;}
        .input-row { display: flex; gap: 12px; }
        
        .apple-input { width: 100%; font-family: var(--font-ui); font-size: 16px; padding: 14px 16px; border-radius: 14px; border: none; background: var(--bg-input); color: var(--text-primary); outline: none; transition: 0.3s; }
        .apple-input:focus { background: var(--bg-base); box-shadow: 0 0 0 2px var(--color-xiaocheng); }
        .title-input { font-weight: 600; text-align: center; }
        
        .action-submit { background: var(--color-xiaocheng); color: #FFFFFF; border: none; padding: 14px 24px; border-radius: 14px; font-size: 16px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3); flex-shrink: 0;}
        .action-submit:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ================= 时间轴与卡片 (iOS 照片流风格) ================= */
        .timeline-group { margin-bottom: 40px; }
        .timeline-header { font-size: 22px; font-weight: 700; color: var(--text-primary); margin-bottom: 16px; letter-spacing: -0.5px;}
        
        .grid { display: grid; gap: 20px; }
        .grid-memory { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
        
        .card { background: var(--bg-card); border-radius: 20px; overflow: hidden; box-shadow: var(--shadow-card); position: relative; transition: transform 0.4s var(--spring), box-shadow 0.4s var(--spring); }
        .card:active { transform: scale(0.98); }
        
        /* 苹果相册排版 */
        .album-grid { display: grid; gap: 2px; background: var(--bg-card);}
        .album-grid.cols-1 { grid-template-columns: 1fr; }
        .album-grid.cols-2 { grid-template-columns: 1fr 1fr; }
        .album-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
        .album-img-wrap { aspect-ratio: 1; overflow: hidden; position: relative;}
        .album-grid.cols-1 .album-img-wrap { aspect-ratio: 4/3; } 
        .album-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
        
        .card-info { padding: 20px; }
        .date { font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 8px; display: block; }
        
        /* 故事/长文排版 */
        .story-title { font-size: 20px; font-weight: 700; color: var(--text-primary); margin-bottom: 16px; letter-spacing: -0.5px;}
        .story-content { font-family: var(--font-serif); font-size: 16px; line-height: 1.8; color: var(--text-primary); }
        .story-seg { border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; white-space: pre-wrap; word-wrap: break-word; }
        .text-xiaocheng { background: var(--color-xiaocheng-bg); color: var(--color-xiaocheng); border-left: 3px solid var(--color-xiaocheng);}
        .text-xiaoxin { background: var(--color-xiaoxin-bg); color: var(--color-xiaoxin); border-left: 3px solid var(--color-xiaoxin);}

        .note { font-size: 16px; line-height: 1.6; color: var(--text-primary); white-space: pre-wrap; }
        
        /* 心愿单 (Apple Reminders 风格) */
        .wish-item { display: flex; align-items: flex-start; gap: 12px; }
        .wish-checkbox { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--divider); appearance: none; outline: none; cursor: pointer; position: relative; flex-shrink: 0; margin-top: 2px;}
        .wish-checkbox:checked { background: var(--color-xiaocheng); border-color: var(--color-xiaocheng); }
        .wish-checkbox:checked::after { content: '✓'; position: absolute; color: white; font-size: 14px; left: 4px; top: 0px; font-weight: bold;}
        .wish-completed { color: var(--text-secondary); text-decoration: line-through; }

        .author-stamp { margin-top: 16px; font-size: 12px; color: var(--text-secondary); display: flex; justify-content: space-between; align-items: center;}

        /* 操作悬浮菜单 (类 iOS 触觉反馈菜单) */
        .actions { position: absolute; top: 12px; right: 12px; display: flex; gap: 8px; opacity: 0; transition: 0.2s; }
        .card:hover .actions { opacity: 1; }
        .action-btn { width: 32px; height: 32px; border-radius: 16px; background: var(--bg-elevated); border: none; color: var(--text-primary); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); box-shadow: var(--shadow-card); font-size: 16px; display: flex; align-items: center; justify-content: center;}
        .btn-delete { color: var(--color-xiaoxin); }

        /* 相册模态框 (iOS Sheet Modal) */
        .album-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1000; display: flex; align-items: flex-end; backdrop-filter: blur(5px); opacity: 0; pointer-events: none; transition: 0.4s var(--spring);}
        .album-modal.active { opacity: 1; pointer-events: auto; }
        .album-modal-body { width: 100%; max-height: 90vh; background: var(--bg-base); border-radius: 20px 20px 0 0; display: flex; flex-direction: column; transform: translateY(100%); transition: 0.4s var(--spring); overflow: hidden;}
        .album-modal.active .album-modal-body { transform: translateY(0); }
        
        .modal-header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--divider); background: var(--bg-elevated); backdrop-filter: saturate(180%) blur(20px); z-index: 10;}
        .modal-header h2 { margin: 0; font-size: 17px; font-weight: 600; }
        .close-btn { background: var(--bg-input); border: none; border-radius: 15px; width: 30px; height: 30px; font-size: 18px; color: var(--text-secondary); display: flex; align-items: center; justify-content: center;}
        
        .modal-content { overflow-y: auto; padding: 20px; }
        .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; border-radius: 12px; overflow: hidden; background: var(--bg-card);}
        .gallery-item { position: relative; aspect-ratio: 1; }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; }
        .delete-img-btn { position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; background: rgba(255,255,255,0.8); border-radius: 12px; border: none; color: var(--color-xiaoxin); backdrop-filter: blur(10px); display: none;}
        .gallery-item:hover .delete-img-btn { display: block; }

        /* 移动端适配 */
        @media (max-width: 600px) {
            .header { margin: -20px -20px 20px -20px; }
            .nav-tabs { width: 100%; justify-content: space-between; }
            .tab { flex: 1; text-align: center; padding: 8px 0;}
            .header-actions { position: absolute; right: 20px; top: -40px; } /* 调整移动端按钮位置 */
            .input-row { flex-direction: column; gap: 12px; }
            .actions { opacity: 1; }
            .delete-img-btn { display: block; }
        }
    </style>
</head>
<body>

<div id="app">
    <div v-if="!currentUser" class="login-overlay">
        <div class="login-box">
            <h1>解锁回忆</h1>
            <p>请输入面容或验证密码</p>
            <input type="password" v-model="loginCode" @keyup.enter="login" placeholder="密码 (xiaoxin / xiaocheng)">
        </div>
    </div>

    <template v-else>
        <div class="header">
            <div class="nav-tabs">
                <div :class="['tab', {active: currentTab === 'memory'}]" @click="switchTab('memory')">纪事</div>
                <div :class="['tab', {active: currentTab === 'album'}]" @click="switchTab('album')">相册</div>
                <div :class="['tab', {active: currentTab === 'diary'}]" @click="switchTab('diary')">随笔</div>
                <div :class="['tab', {active: currentTab === 'wish'}]" @click="switchTab('wish')">心愿</div>
                <div :class="['tab', {active: currentTab === 'story'}]" @click="switchTab('story')">浮梦</div>
            </div>
            <div class="header-actions">
                <button class="theme-toggle btn-press" @click="toggleTheme">
                    <svg v-if="isDarkMode" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                    <svg v-else width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </button>
                <div class="user-badge" @click="logout" style="cursor:pointer;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
                    {{ currentUser }}
                </div>
            </div>
        </div>

        <div :class="['album-modal', {active: currentAlbum}]">
            <div class="album-modal-body" v-if="currentAlbum">
                <div class="modal-header">
                    <h2>{{ currentAlbum.title || '未命名相册' }}</h2>
                    <button class="close-btn btn-press" @click="closeAlbum">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                </div>
                <div class="modal-content">
                    <p v-if="currentAlbum.note" style="color:var(--text-secondary); font-size:15px; margin-top:0;">{{ currentAlbum.note }}</p>
                    <div class="gallery-grid">
                        <div v-for="img in currentAlbum.images" :key="img.public_id" class="gallery-item">
                            <img :src="img.url" @click="viewFull(img.url)">
                            <button class="delete-img-btn btn-press" @click="deleteImageFromAlbum(currentAlbum._id, img._id)">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                            </button>
                        </div>
                    </div>
                    
                    <div style="margin-top: 30px; display:flex; gap:10px;">
                        <div class="file-upload-wrapper" style="flex:1;">
                            <input type="file" @change="handleAppendFiles" accept="image/*" multiple>
                            <span class="file-upload-text">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: middle; margin-right:5px;"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                                {{ appendFiles.length > 0 ? `已选 ${appendFiles.length} 张` : '添加照片' }}
                            </span>
                        </div>
                        <button v-if="appendFiles.length > 0" class="action-submit btn-press" @click="submitAppendPhotos" :disabled="isUploading">
                            {{ isUploading ? '上传中...' : '完成' }}
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="control-panel">
            <input v-if="currentTab === 'story' || currentTab === 'album'" type="text" v-model="newTitle" class="apple-input title-input" :placeholder="currentTab === 'album' ? '相册名称' : '篇章标题'">
            <div class="input-group">
                <textarea v-if="currentTab !== 'album'" class="apple-input note-input" v-model="newNote" :placeholder="placeholderText" rows="2" style="resize:none;"></textarea>
                <textarea v-else class="apple-input note-input" v-model="newNote" placeholder="相册描述 (选填)" rows="1" style="resize:none;"></textarea>
                
                <div class="input-row">
                    <div class="file-upload-wrapper" style="flex:1;" v-if="currentTab !== 'diary'">
                        <input type="file" @change="handleFiles" accept="image/*" :multiple="currentTab === 'album'">
                        <span class="file-upload-text">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: middle; margin-right:5px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                            {{ selectedFiles.length > 0 ? `已选 ${selectedFiles.length} 张` : '选择照片' }}
                        </span>
                    </div>
                    <input type="date" v-model="newDate" class="apple-input" style="flex:1;">
                    <button class="action-submit btn-press" @click="uploadItem" :disabled="isUploading">{{ isUploading ? '处理中...' : btnText }}</button>
                </div>
            </div>
        </div>

        <div v-for="(itemsInGroup, monthYear) in groupedItems" :key="monthYear" class="timeline-group">
            <div class="timeline-header">{{ monthYear }}</div>
            
            <div :class="['grid', (currentTab === 'memory' || currentTab === 'album') ? 'grid-memory' : 'grid-list']">
                <div v-for="item in itemsInGroup" :key="item._id" class="card">
                    
                    <div class="actions">
                        <button v-if="currentTab !== 'album'" class="action-btn btn-press" @click="startEdit(item)">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                        </button>
                        <button class="action-btn btn-delete btn-press" @click="deleteItem(item._id)">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                        </button>
                    </div>

                    <template v-if="currentTab === 'album'">
                        <div style="cursor: pointer;" @click="openAlbum(item)">
                            <img :src="item.images && item.images.length > 0 ? item.images[0].url : 'data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'100\' height=\'100\'><rect width=\'100\' height=\'100\' fill=\'%23F5F5F7\'/></svg>'">
                            <div style="position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.5); color: white; padding: 4px 10px; border-radius: 10px; font-size: 12px; font-weight: bold; backdrop-filter: blur(5px);">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: middle; margin-right:4px; margin-top:-2px;"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                                {{ item.images ? item.images.length : 0 }}
                            </div>
                        </div>
                    </template>
                    <template v-else-if="item.url || (item.images && item.images.length > 0)">
                        <div v-if="item.images && item.images.length > 0" :class="['album-grid', getGridClass(item.images.length)]">
                            <div v-for="(img, idx) in item.images" :key="idx" class="album-img-wrap" @click="viewFull(img.url)">
                                <img :src="img.url">
                            </div>
                        </div>
                        <img v-else :src="item.url" @click="viewFull(item.url)">
                    </template>

                    <div class="card-info">
                        <span class="date">{{ formatDate(item.date) }}</span>
                        
                        <div v-if="editingId === item._id" style="margin-top: 10px;">
                            <template v-if="currentTab === 'story'">
                                <input type="text" class="apple-input" v-model="editTitle" placeholder="篇章名" style="margin-bottom:10px;">
                                <div v-for="(seg, index) in editSegments" :key="index" style="display:flex; gap:10px; margin-bottom:10px; align-items: flex-start;">
                                    <span :style="{ color: seg.author === '小心' ? 'var(--color-xiaoxin)' : 'var(--color-xiaocheng)', fontSize: '12px', fontWeight: 'bold', marginTop:'14px' }">{{ seg.author }}</span>
                                    <textarea class="apple-input" v-model="seg.text" rows="2" style="flex:1;"></textarea>
                                    <button class="action-btn btn-delete btn-press" style="margin-top:8px;" @click="editSegments.splice(index, 1)">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                                    </button>
                                </div>
                                <button class="file-upload-wrapper btn-press" style="width:100%; border:none; color:var(--color-xiaocheng); background:var(--bg-input);" @click="addNewSegment">+ 添加新段落</button>
                            </template>
                            <template v-else>
                                <textarea class="apple-input" v-model="editNote" rows="3"></textarea>
                            </template>
                            <div style="display:flex; gap:10px; margin-top: 15px;">
                                <button class="action-submit btn-press" style="flex:1;" @click="saveEdit(item._id)">保存</button>
                                <button class="action-submit btn-press" style="flex:1; background:var(--bg-input); color:var(--text-primary);" @click="cancelEdit">取消</button>
                            </div>
                        </div>

                        <div v-else>
                            <div v-if="currentTab === 'album'" style="font-size: 18px; font-weight: 600; cursor:pointer;" @click="openAlbum(item)">{{ item.title || '无名相册' }}</div>
                            <div v-else-if="currentTab === 'story'" class="story-title">{{ item.title }}</div>
                            
                            <div v-if="currentTab === 'story'" class="story-content">
                                <div v-for="seg in item.segments" :key="seg.id" :class="['story-seg', seg.author === '小心' ? 'text-xiaoxin' : 'text-xiaocheng']">{{ seg.text }}</div>
                            </div>
                            <div v-else-if="currentTab === 'wish'" class="wish-item">
                                <input type="checkbox" class="wish-checkbox" :checked="item.completed" @change="toggleWish(item, $event)">
                                <span :class="['note', {'wish-completed': item.completed}]">{{ item.note }}</span>
                            </div>
                            <div v-else class="note">{{ item.note }}</div>
                        </div>

                        <div class="author-stamp">
                            <span>记录人</span>
                            <span style="font-weight: 500; color: var(--text-primary);">{{ item.author }}</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>
</div>

<script>
    const { createApp } = Vue;
    createApp({
        data() {
            return {
                currentUser: null,
                loginCode: '',
                currentTab: 'memory', 
                items: [],
                newTitle: '', newNote: '', newDate: '', 
                selectedFiles: [], 
                isUploading: false, 
                editingId: null, editTitle: '', editNote: '', editSegments: [],
                isDarkMode: false,
                currentAlbum: null,
                appendFiles: [] 
            }
        },
        computed: {
            placeholderText() {
                if (this.currentTab === 'memory') return '记录这一刻...';
                if (this.currentTab === 'diary') return '写点什么...';
                if (this.currentTab === 'story') return '输入平行世界的故事...';
                return '许下心愿...';
            },
            btnText() {
                if (this.currentTab === 'album') return '新建';
                return '保存';
            },
            groupedItems() {
                const groups = {};
                this.items.forEach(item => {
                    const dateObj = new Date(item.date);
                    const yearMonth = `${dateObj.getFullYear()}年 ${dateObj.getMonth() + 1}月`;
                    if (!groups[yearMonth]) groups[yearMonth] = [];
                    groups[yearMonth].push(item);
                });
                return groups;
            }
        },
        methods: {
            login() {
                if (this.loginCode === 'xiaoxin') this.currentUser = '小心';
                else if (this.loginCode === 'xiaocheng') this.currentUser = '小橙';
                else return alert('密码错误');
                localStorage.setItem('orange_user', this.currentUser);
                this.initApp();
            },
            logout() {
                localStorage.removeItem('orange_user');
                this.currentUser = null;
                this.loginCode = '';
            },
            toggleTheme() {
                this.isDarkMode = !this.isDarkMode;
                const theme = this.isDarkMode ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('orange_theme', theme);
            },
            switchTab(tab) {
                this.currentTab = tab;
                this.getItems();
                this.selectedFiles = [];
                this.newNote = '';
                this.newTitle = '';
            },
            handleFiles(e) { this.selectedFiles = Array.from(e.target.files); },
            getGridClass(count) {
                if (count === 1) return 'cols-1';
                if (count === 2 || count === 4) return 'cols-2';
                return 'cols-3'; 
            },
            openAlbum(item) {
                this.currentAlbum = item;
                document.body.style.overflow = 'hidden'; 
            },
            closeAlbum() {
                this.currentAlbum = null;
                this.appendFiles = [];
                document.body.style.overflow = 'auto';
                this.getItems(); 
            },
            handleAppendFiles(e) { this.appendFiles = Array.from(e.target.files); },
            async submitAppendPhotos() {
                if(this.appendFiles.length === 0) return;
                this.isUploading = true;
                const fd = new FormData();
                this.appendFiles.forEach(file => fd.append('files', file));
                try {
                    const res = await axios.post(`/api/items/${this.currentAlbum._id}/images`, fd);
                    this.currentAlbum = res.data; 
                    this.appendFiles = [];
                } catch (e) { alert("追加失败"); } 
                finally { this.isUploading = false; }
            },
            async deleteImageFromAlbum(albumId, imageId) {
                if(confirm("移除此照片？")) {
                    try {
                        const res = await axios.delete(`/api/items/${albumId}/images/${imageId}`);
                        this.currentAlbum = res.data; 
                    } catch(e) { alert("删除失败"); }
                }
            },
            async uploadItem() {
                if (!this.newNote && this.selectedFiles.length === 0 && this.newTitle === '') return;
                this.isUploading = true;
                const fd = new FormData();
                this.selectedFiles.forEach(file => fd.append('files', file));
                fd.append('category', this.currentTab);
                fd.append('title', this.newTitle);
                fd.append('author', this.currentUser); 
                if (this.newDate) fd.append('date', this.newDate);
                
                if (this.currentTab === 'story') {
                    const initialSegment = [{ id: Date.now().toString(), author: this.currentUser, text: this.newNote }];
                    fd.append('segments', JSON.stringify(initialSegment));
                } else { fd.append('note', this.newNote); }
                
                try {
                    await axios.post('/api/items', fd);
                    this.newNote = ''; this.newTitle = '';
                    this.newDate = new Date().toISOString().split('T')[0];
                    this.selectedFiles = [];
                    this.getItems();
                } catch (error) { alert("上传失败"); } 
                finally { this.isUploading = false; }
            },
            async getItems() {
                const res = await axios.get(`/api/items?category=${this.currentTab}`);
                this.items = res.data;
            },
            async deleteItem(id) {
                if (confirm("删除此条目？")) {
                    await axios.delete(`/api/items/${id}`);
                    this.getItems();
                }
            },
            startEdit(item) { this.editingId = item._id; this.editTitle = item.title || ''; this.editNote = item.note || ''; },
            cancelEdit() { this.editingId = null; },
            async saveEdit(id) {
                let payload = { title: this.editTitle, note: this.editNote };
                try {
                    await axios.put(`/api/items/${id}`, payload);
                    this.editingId = null;
                    this.getItems();
                } catch (e) { alert("修改失败"); }
            },
            async toggleWish(item, event) {
                try {
                    await axios.put(`/api/items/${item._id}`, { completed: event.target.checked });
                    item.completed = event.target.checked;
                } catch (e) { event.target.checked = !event.target.checked; }
            },
            viewFull(url) { window.open(url, '_blank'); },
            formatDate(dateString) { 
                const d = new Date(dateString); 
                return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`; 
            },
            initApp() {
                this.newDate = new Date().toISOString().split('T')[0];
                this.getItems(); 
            }
        },
        mounted() { 
            const savedUser = localStorage.getItem('orange_user');
            if (savedUser) { this.currentUser = savedUser; this.initApp(); }
            const savedTheme = localStorage.getItem('orange_theme');
            if (savedTheme === 'dark') { this.isDarkMode = true; document.documentElement.setAttribute('data-theme', 'dark'); }
        }
    }).mount('#app');
</script>
</body>
</html>
